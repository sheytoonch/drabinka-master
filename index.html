.notes-view-tab.active{border-bottom-color:#6ca9ff;opacity:1;}
.notes-view-tab:hover{opacity:1;}
.notes-editor[contenteditable] img, .wiki-editor[contenteditable] img{display:block;max-width:100%;height:auto;max-height:360px;object-fit:contain;margin:9px 0;border-radius:4px;user-select:none;-webkit-user-drag:element;cursor:grab;}
.wiki-category{padding:0 0 6px;}
.wiki-category>h1{font-size:22px;line-height:1.25;font-weight:750;margin:0 0 17px;overflow-wrap:anywhere;}
.wiki-entry{margin:0 0 24px;min-width:0;}.wiki-entry>h2{font-size:17px;line-height:1.4;font-weight:700;margin:0 0 5px;overflow-wrap:anywhere;}
.wiki-editor[contenteditable]{display:block;min-height:36px;outline:0!important;box-shadow:none!important;font-size:13px;line-height:1.65;overflow-wrap:anywhere;cursor:text;}
.wiki-editor[contenteditable][data-wiki-empty="true"]:not(:focus):before{content:"-";color:#8295aa;pointer-events:none;}
.wiki-editor[contenteditable] p, .wiki-editor[contenteditable] div{margin:0 0 .65em;}
.wiki-editor[contenteditable] h1{font-size:20px;font-weight:750;margin:.8em 0 .4em;}
.wiki-editor[contenteditable] h2{font-size:17px;font-weight:700;margin:.75em 0 .4em;}
.wiki-editor[contenteditable] h3{font-size:14px;font-weight:700;margin:.7em 0 .35em;}
.wiki-editor[contenteditable] ul, .wiki-editor[contenteditable] ol{padding-left:22px;}
.wiki-editor[contenteditable] p:last-child, .wiki-editor[contenteditable] div:last-child{margin-bottom:0;}

html[data-theme="dark"] .wiki-editor[contenteditable][data-wiki-empty="true"]:not(:focus):before{color:#879bb3;}

/* liczniki w podsumowaniu zamiast w wąskim nagłówku projektu. */
.upper-head > .panel-cap.right{display:flex;flex-direction:column;align-items:flex-start;gap:8px;justify-content:flex-start;}
.upper-head .summary-cap-title{white-space:nowrap;}
.upper-head .project-timer{flex-direction:column;flex-wrap:nowrap;color:#526b86;font:500 10px/1.25 "Segoe UI",Arial,sans-serif;letter-spacing:0;text-transform:none;}

.upper-head .project-timer-label{font-size:9px;}
.upper-head .project-timer-value{font-size:10px;}
html[data-theme="dark"] .upper-head .project-timer{color:#bed1e6;}
@media(max-width:720px){.upper-head > .panel-cap.right{gap:5px}.upper-head .project-timer{gap:5px;font-size:9px}}

/* Alternatywa dla wysuwanego notatnika: wyśrodkowany, przewijany modal.
   Używa dokładnie tego samego edytora i danych; nie kopiuje zawartości. */
.notes-expand{display:inline-flex;align-items:center;justify-content:center;width:29px;height:28px;min-width:29px;padding:4px;}
.notes-expand svg{display:block;width:17px;height:17px;}
.notes-expand .notes-restore-icon{display:none;}
.notes-widget.is-modal .notes-expand .notes-expand-icon{display:none;}
.notes-widget.is-modal .notes-expand .notes-restore-icon{display:block;}
.notes-modal-backdrop{display:none;}
.notes-widget.is-modal{position:fixed;inset:0;top:0;right:0;bottom:0;left:0;width:100%;height:100dvh;z-index:90;pointer-events:auto;}
.notes-widget.is-modal .notes-modal-backdrop{display:block;position:absolute;inset:0;width:100%;height:100%;background:rgba(8,17,31,.72);border:0;padding:0;cursor:default;pointer-events:auto;}
.notes-widget.is-modal .notes-tab{display:none;}
.notes-widget.is-modal .notes-panel, .notes-widget.is-modal.is-open .notes-panel{position:absolute;z-index:1;border:1px solid #a6b8cf;box-shadow:0 18px 65px #0008;visibility:visible;pointer-events:auto;transition:none;}
.notes-widget.is-modal .notes-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 22px 22px;scrollbar-gutter:stable;}
.notes-widget.is-modal .notes-editor[contenteditable], .notes-widget.is-modal .wiki-editor[contenteditable]{font-size:14px;line-height:1.7;}
.notes-widget.is-modal .notes-top{padding:12px 18px;}
.notes-widget.is-modal .notes-formatbar{padding:8px 16px;}
@media(max-width:620px){.notes-widget.is-modal .notes-panel, .notes-widget.is-modal.is-open .notes-panel{width:calc(100vw - 16px);height:calc(100dvh - 20px);max-height:calc(100dvh - 20px)}.notes-widget.is-modal .notes-list{padding:12px}.notes-widget.is-modal .notes-top{padding:9px 10px}.notes-widget.is-modal .notes-formatbar{padding:7px 9px}}
@media(prefers-reduced-motion:reduce){.notes-widget.is-modal .notes-panel{transition:none!important}}

/* kwadratowe przyciski ikonowe w całej aplikacji, również w encyklopedii. */
.notes-widget .notes-actions .notes-copy, .notes-widget .notes-actions .notes-close, .notes-widget .notes-actions .notes-search-toggle{
 box-sizing:border-box;display:inline-grid;place-items:center;flex:0 0 32px;width:32px;min-width:32px;height:32px;min-height:32px;aspect-ratio:1;padding:0;border-radius:7px;line-height:1;
}
.notes-widget .notes-actions .notes-add{font-size:20px;}
.notes-widget .notes-actions svg, .notes-heading-copy svg, .notes-search-nav svg{display:block;flex:none;width:17px;height:17px;}
.notes-widget .notes-format-btn, .notes-widget .notes-format-btn:has(svg){box-sizing:border-box;display:inline-grid;place-items:center;flex:0 0 30px;width:30px;min-width:30px;height:30px;min-height:30px;padding:0;aspect-ratio:1;}
.chapter-collapse{box-sizing:border-box;width:24px;min-width:24px;height:24px;min-height:24px;}
.add-section-btn{box-sizing:border-box;width:30px;min-width:30px;height:30px;min-height:30px;}
.search-close{box-sizing:border-box;min-width:30px;height:30px;padding:0;display:inline-grid;place-items:center;}

/* etykiety: + w kategorii oddzielony pionową linią, dolny + znów kołem. */
.category-pill{gap:0;padding-right:0;}
.cat-add{
 width:26px;min-width:26px;height:100%;margin:0;padding:0 0 0 1px;
 border:0;border-left:1px solid #8ea5c0;border-radius:0;
 background:transparent;box-shadow:none;
}
.cat-add:hover{background:rgba(255,255,255,.16);border-left-color:#6f8eaf;}
.cat-add svg{width:12px;height:12px;}
html[data-theme="dark"] .cat-add{border-left-color:#7289a4;background:transparent;box-shadow:none;}
html[data-theme="dark"] .cat-add:hover{background:rgba(255,255,255,.08);border-left-color:#92a9c3;}
.add-section-btn{border-radius:999px!important;}


/* zaznaczona szyna dodawania rozdziału: płaska, szara, bez ozdobników. */
.graph-rail-selection::before,
.graph-rail-selection::after{display:none!important;}
.upper-shell.graph-rail-integrated .graph-rail-selection{
 border:0!important;
 background:rgba(136,146,160,.22)!important;box-shadow:none!important;
}
html[data-theme="dark"] .upper-shell.graph-rail-integrated .graph-rail-selection{
 background:rgba(138,148,161,.18)!important;
}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection{
 background:rgba(141,150,160,.16)!important;
}

html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button{
 color:#5d7085;
}
.upper-shell.graph-rail-integrated .graph-rail-selection button:hover,
.upper-shell.graph-rail-integrated .graph-rail-selection button:focus-visible{
 background:rgba(255,255,255,.08);color:#fff;outline:2px solid #8bbbee44;outline-offset:1px;
}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button:hover,
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button:focus-visible{
 background:rgba(70,90,110,.08);color:#2d4b68;
}


/* podgląd rozdziału przy najechaniu bez tekstowych banerów. */
.graph-chapter-preview.is-range .graph-chapter-preview-head{display:none!important;}
.graph-project .graph-chapter-preview.is-empty.is-compact .graph-chapter-preview-compact-label{display:none!important;}
.graph-chapter-preview.is-range .graph-chapter-preview-middle,
.graph-chapter-preview.is-range .graph-chapter-preview-left,
.graph-chapter-preview.is-range .graph-chapter-preview-right,
.graph-chapter-preview.is-range .graph-chapter-preview-rail{display:none!important;}
.graph-chapter-preview.is-range{background:rgba(136,146,160,.14)!important;border:0!important;box-shadow:none!important;}
html[data-theme="dark"] .graph-chapter-preview.is-range{background:rgba(138,148,161,.12)!important;}
html[data-theme="light"] .graph-chapter-preview.is-range{background:rgba(141,150,160,.10)!important;}
.graph-project .graph-chapter-preview.is-empty.is-compact{background:rgba(136,146,160,.18)!important;border:0!important;box-shadow:none!important;}
html[data-theme="dark"] .graph-project .graph-chapter-preview.is-empty.is-compact{background:rgba(138,148,161,.15)!important;}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty.is-compact{background:rgba(141,150,160,.12)!important;}


/* siatka: bez poziomego podświetlenia i linii podglądu
   przy najechaniu pomiędzy rozdziałami. Pionowa szyna + pozostaje aktywna. */
.app:not(.graph-mode-active) .split-highlight,
.app:not(.graph-mode-active) .split-highlight.is-visible{display:none!important;}
.app:not(.graph-mode-active) .gaprow:hover,
html[data-theme="dark"] .app:not(.graph-mode-active) .gaprow:hover{background:transparent;}
.app:not(.graph-mode-active) .gap-place:hover,
html[data-theme="dark"] .app:not(.graph-mode-active) .gap-place:hover{background:transparent;}
.app:not(.graph-mode-active) .gap-place::after,
.app:not(.graph-mode-active) .gap-place:hover::after{content:none!important;opacity:0!important;}

/* Dokument notatek: poziome separatory zamiast oddzielnych kart. */
.notes-list:has(> .notes-section){gap:0;}
.notes-section{border:0;border-radius:0;background:transparent;overflow:visible;}
.notes-section + .notes-section{margin-top:18px;padding-top:18px;border-top:1px solid #c5d1df;}
/* Wcześniejszy styl dokumentu stosuje selektor dark o większej specyficzności. */
.notes-section-top, html[data-theme="dark"] .notes-section-top{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:36px;padding:2px 2px 6px;margin:0 0 7px;border:0;background:transparent;}
.notes-section-top .notes-section-name{width:auto;flex:1;min-width:0;max-width:none;font-size:17px;line-height:1.4;}
.notes-section .notes-editor[contenteditable]{padding:7px 2px 15px;}
.notes-section .notes-title-input{font-size:17px;}
.notes-heading-copy{box-sizing:border-box;display:inline-grid;place-items:center;flex:0 0 29px;width:29px;min-width:29px;height:29px;min-height:29px;aspect-ratio:1;border:1px solid transparent;background:transparent;color:#607993;border-radius:6px;padding:0;cursor:pointer;}
.notes-heading-copy:hover, .notes-heading-copy:focus-visible{background:#dbe8f6;color:#284760;border-color:#b8cee3;outline:0;}
.wiki-heading-row, .wiki-entry-heading{display:flex;align-items:center;gap:8px;min-width:0;}
.wiki-heading-row>h1, .wiki-entry-heading>h2{flex:1;min-width:0;}
.wiki-heading-row>h1{margin:0 0 12px;}
.wiki-entry-heading>h2{margin:0 0 5px;}
.wiki-entry + .wiki-entry{border-top:1px solid #c5d1df;margin-top:20px;padding-top:17px;}
.wiki-category + .wiki-category{border-top:1px solid #aabbd0;margin-top:27px;padding-top:17px;}
/* Wyszukiwanie nie zmienia zawartości HTML edytorów ani pozycji kursora. */
.notes-searchbar{display:flex;align-items:center;gap:6px;padding:8px 11px;border-bottom:1px solid #c8d4e4;background:#f2f6fb;min-width:0;}
.notes-searchbar[hidden]{display:none!important;}
.notes-search-input{flex:1;min-width:0;height:32px;border-radius:6px;border:1px solid #c3d0de;background:#fff;color:#24364d;padding:0 9px;font:400 12px/1.4 "Segoe UI",Arial,sans-serif;outline:0;}
.notes-search-input:focus{border-color:#649bdf;box-shadow:0 0 0 1px #649bdf55;}
.notes-search-count{flex:none;color:#6b829c;font-size:11px;white-space:nowrap;}
.notes-search-nav{box-sizing:border-box;display:inline-grid;place-items:center;flex:0 0 30px;width:30px;min-width:30px;height:30px;min-height:30px;aspect-ratio:1;border:1px solid #c2d0df;border-radius:6px;background:#ecf3fa;color:#405c79;padding:0;cursor:pointer;}
.notes-search-nav:hover:not(:disabled){background:#dbe8f6;}
.notes-search-nav:disabled{opacity:.35;cursor:default;}
.notes-search-hit{border-radius:4px;}
.notes-search-current>.notes-section-top, .notes-search-current>.wiki-entry-heading{background:#ffe39b2b;border-radius:5px;box-shadow:inset 3px 0 #e6ab3c;}
::highlight(dm-note-search){background:#f7d568;color:#203040;}
html[data-theme="dark"] .notes-section{background:transparent;border-color:transparent;}
html[data-theme="dark"] .notes-section-top{background:transparent;border-color:transparent;}
html[data-theme="dark"] .notes-section + .notes-section, html[data-theme="dark"] .wiki-entry + .wiki-entry{border-top-color:#5b6f86;}
html[data-theme="dark"] .wiki-category + .wiki-category{border-top-color:#5b6f86;}
html[data-theme="dark"] .notes-heading-copy{color:#97b1ca;}
html[data-theme="dark"] .notes-heading-copy:hover, html[data-theme="dark"] .notes-heading-copy:focus-visible{background:#344961;color:#e7f1ff;border-color:#536c87;}
html[data-theme="dark"] .notes-searchbar{background:#1e2d40;border-bottom-color:#40556d;}
html[data-theme="dark"] .notes-search-input{background:#172435;color:#e5eefa;border-color:#536b85;}
html[data-theme="dark"] .notes-search-count{color:#a8bfd5;}
html[data-theme="dark"] .notes-search-nav{background:#273c54;color:#e2edfa;border-color:#4e647d;}
html[data-theme="dark"] .notes-search-nav:hover:not(:disabled){background:#3c5570;}
html[data-theme="dark"] .notes-search-current>.notes-section-top, html[data-theme="dark"] .notes-search-current>.wiki-entry-heading{background:#e4b54b20;}
@media(max-width:600px){.notes-searchbar{flex-wrap:wrap}.notes-search-input{flex-basis:100%}}


/* liczniki w dwóch osobnych wierszach, bez zbędnego zegara. */
.upper-head .project-timer{display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;align-items:start;gap:5px;margin:0;width:100%;max-width:100%;}
.upper-head .project-timer-part{display:flex;flex-direction:row;align-items:baseline;gap:6px;margin:0;width:100%;min-width:0;white-space:nowrap;}
.upper-head .project-timer svg, .upper-head .project-timer::before{display:none!important;content:none!important;}
/* Akcje notatnika i encyklopedii: spójne kwadratowe przyciski i prawdziwe SVG. */
.notes-widget .notes-actions .notes-copy, .notes-widget .notes-actions .notes-close, .notes-widget .notes-actions .notes-expand{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:32px;min-width:32px;height:32px;min-height:32px;flex:0 0 32px;aspect-ratio:1;padding:0;border-radius:7px;font-size:0;line-height:0;}
.notes-widget .notes-actions .notes-copy svg, .notes-widget .notes-actions .notes-close svg, .notes-widget .notes-actions .notes-expand svg{display:block;width:18px;height:18px;flex:none;}
.notes-widget .notes-actions .notes-expand .notes-restore-icon{display:none;}
.notes-widget.is-modal .notes-actions .notes-expand .notes-expand-icon{display:none;}
.notes-widget.is-modal .notes-actions .notes-expand .notes-restore-icon{display:block;}

/* modal w pełnej wysokości i niezależny, przewijany spis treści. */
.notes-body{display:flex;flex:1;min-height:0;min-width:0;overflow:hidden;}
.notes-body>.notes-list{flex:1;min-width:0;min-height:0;overflow-y:auto;}
.notes-outline{display:none;}
.notes-widget.is-modal .notes-panel, .notes-widget.is-modal.is-open .notes-panel{
 top:0;bottom:0;left:50%;right:auto;transform:translateX(-50%);
 width:min(1220px,100vw);height:100dvh;max-height:none;min-height:0;
 border-radius:0;border-top:0;border-bottom:0;
}
.notes-widget.is-modal .notes-outline{
 box-sizing:border-box;display:flex;flex-direction:column;flex:0 0 231px;width:231px;min-width:0;
 overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;
 border-right:1px solid #c6d3e2;background:#f0f5fa;padding:17px 8px 22px;
}
.notes-outline-title{position:sticky;top:-17px;z-index:1;padding:0 10px 13px;margin:0 0 7px;
 font-size:10px;letter-spacing:1.2px;font-weight:800;color:#6e839b;background:inherit;}
.notes-outline-items{display:flex;flex-direction:column;gap:2px;min-width:0;}
.notes-outline-item{display:block;box-sizing:border-box;width:100%;max-width:100%;min-height:30px;flex:none;
 border:1px solid transparent;border-radius:5px;background:transparent;color:#455e78;
 padding:6px 7px 6px calc(8px + var(--outline-level,0)*13px);text-align:left;
 font-size:12px;line-height:1.4;overflow-wrap:anywhere;cursor:pointer;}
.notes-outline-item:hover, .notes-outline-item:focus-visible{background:#e0ebf6;color:#253b56;border-color:#c3d4e7;}
.notes-outline-item[aria-current="location"]{background:#d5e7f8;color:#24496f;font-weight:700;}
.notes-outline-item[style*="--outline-level: 0"]{font-weight:700;color:#273e5c;}
.notes-outline-empty{font-size:11px;color:#8494a6;padding:10px;}
html[data-theme="dark"] .notes-widget.is-modal .notes-outline{background:#1b2b40;border-color:#455a71;scrollbar-color:#566f89 #1b2b40;}
html[data-theme="dark"] .notes-outline-title{color:#9db4cc;}
html[data-theme="dark"] .notes-outline-item{color:#bdcee0;}
html[data-theme="dark"] .notes-outline-item[style*="--outline-level: 0"]{color:#ebf3fd;}
html[data-theme="dark"] .notes-outline-item:hover, html[data-theme="dark"] .notes-outline-item:focus-visible{background:#30465e;border-color:#526983;color:#fff;}
html[data-theme="dark"] .notes-outline-item[aria-current="location"]{background:#385573;color:#fff;}
@media(max-width:750px){
 .notes-widget.is-modal .notes-outline{flex-basis:162px;width:162px;padding:12px 5px}
 .notes-widget.is-modal .notes-list{padding:13px}
 .notes-outline-item{font-size:11px;padding-left:calc(5px + var(--outline-level,0)*8px)}
 .notes-outline-title{font-size:9px;top:-12px}
}
@media(max-width:450px){
 .notes-widget.is-modal .notes-outline{flex-basis:122px;width:122px}
 .notes-widget.is-modal .notes-list{padding:9px}
}

/* minimalna, jednowierszowa stopka: wszystkie informacje bez utraty miejsca planszy. */
.app-footer{
 box-sizing:border-box;height:20px;flex:0 0 20px;min-height:20px;
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:0 10px;min-width:0;overflow:hidden;
 border-top:1px solid #c9d5e3;background:#edf2f8;color:#627a94;
 font:500 9px/1.15 "Segoe UI",Arial,sans-serif;letter-spacing:0;user-select:none;
}
.app-footer-meta{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;}
.app-footer-name{font-weight:750;color:#3c5470;white-space:nowrap;}
.app-footer-version, .app-footer-date{font-weight:400;color:inherit;white-space:nowrap;}
/* Copyright i warunki licencji widoczne w stopce; pełny tekst znajduje się w LICENSE. */
.app-footer-license{white-space:nowrap;flex:none;color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-width:0;}
.app-footer-license:hover, .app-footer-license:focus-visible{color:#315b89;text-decoration:underline;}
.app-footer-license-compact{display:none;}
html[data-theme="dark"] .app-footer-license:hover, html[data-theme="dark"] .app-footer-license:focus-visible{color:#e3efff;}
@media(max-width:1080px){.app-footer-license-rights{display:none}}
@media(max-width:790px){.app-footer-license-full{display:none}.app-footer-license-compact{display:inline}}
.app-footer-json{white-space:nowrap;min-width:0;font-variant-numeric:tabular-nums;}
.app-footer-json time{font-weight:600;}
.app-footer .project-timer{
 display:flex;flex:none;align-items:center;justify-content:flex-end;gap:10px;
 margin:0;padding:0;width:auto;max-width:none;color:inherit;font:inherit;letter-spacing:inherit;
 white-space:nowrap;font-variant-numeric:tabular-nums;
}
.app-footer .project-timer-part{display:inline-flex;align-items:baseline;gap:4px;margin:0;width:auto;white-space:nowrap;}
.app-footer .project-timer-label{font-size:9px;opacity:.9;}
.app-footer .project-timer-value{color:#2e4967;font-size:9px;font-weight:750;}
html[data-theme="dark"] .app-footer{background:#182536;border-top-color:#34465b;color:#a0b4c9;}
html[data-theme="dark"] .app-footer-name{color:#dbe8f6;}
html[data-theme="dark"] .app-footer .project-timer-value{color:#ecf4fe;}
@media(max-width:760px){
 .app-footer{gap:8px;padding:0 9px;font-size:9px}
 .app-footer-meta{gap:5px}
 .app-footer .project-timer{gap:7px}
 .app-footer .project-timer-part{gap:4px}
 .app-footer .project-timer-label, .app-footer .project-timer-value{font-size:9px}
}
@media(max-width:580px){
 .app-footer{gap:5px;padding:0 5px;font-size:8px}
 .app-footer-meta{gap:4px}
 .app-footer .project-timer{gap:5px}
 .app-footer .project-timer-label, .app-footer .project-timer-value{font-size:8px}
 .app-footer-json-label{font-size:0}
 .app-footer-json-label::after{content:"JSON:";font-size:8px}
}

/* czytelne wątki i zwijane, regulowane panele. */
.thread-guides{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.thread-guide{position:absolute;top:0;bottom:0;width:1px;background:rgba(99,122,152,.24);pointer-events:none;}
html[data-theme="dark"] .thread-guide{background:rgba(153,177,206,.25);}
.head-shift .thread-guides{z-index:3;}
.upper-shell{position:relative;}
.panel-cap.left, .panel-cap.right{flex-direction:row!important;align-items:flex-start!important;justify-content:space-between;gap:3px;padding:5px 6px 3px 9px!important;white-space:nowrap;}
/* oddzielny oddech dla podpisu planszy i ikon, nad nagłówkami wątków. */
.upper-head .panel-cap.center-cap{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:7px 9px;height:39px;}
.panel-cap-label, .summary-cap-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.panel-toggle{appearance:none;box-sizing:border-box;display:inline-grid;place-items:center;flex:0 0 23px;width:23px;height:23px;min-height:23px;padding:0;background:transparent;border:1px solid transparent;border-radius:5px;color:#708aa7;cursor:pointer;}
.panel-toggle svg{display:block;width:16px;height:16px;}
.panel-toggle:hover, .panel-toggle:focus-visible{background:#a1b7d028;color:#376081;border-color:#a1b7d088;}
html[data-theme="dark"] .panel-toggle{color:#a5bacf;}
html[data-theme="dark"] .panel-toggle:hover, html[data-theme="dark"] .panel-toggle:focus-visible{background:#3a5169;color:#eef6ff;border-color:#617992;}
.upper-shell.left-collapsed .panel-cap.left, .upper-shell.right-collapsed .panel-cap.right{padding:5px 6px 3px 9px!important;justify-content:initial;}
.upper-shell.left-collapsed .panel-cap.left .panel-cap-label, .upper-shell.right-collapsed .panel-cap.right .panel-cap-label{display:none;}
.upper-shell.left-collapsed .chapter-left, .upper-shell.right-collapsed .chapter-right{padding:0!important;overflow:hidden;}
.upper-shell.left-collapsed .chapter-left>*, .upper-shell.right-collapsed .chapter-right>*{display:none!important;}
.upper-shell.left-collapsed .chapter-seg.left{padding:3px 5px;justify-content:center;}
.upper-shell.left-collapsed .chapter-seg.left .handle, .upper-shell.left-collapsed .chapter-seg.left input, .upper-shell.left-collapsed .chapter-seg.left .chapter-index{display:none;}
.upper-shell.right-collapsed .chapter-seg.right{padding:0;}
.panel-resizer{position:absolute;top:0;bottom:8px;width:11px;z-index:30;cursor:col-resize;touch-action:none;user-select:none;background:transparent;transform:translateX(-50%);}
.panel-resizer::before{content:"";display:block;position:absolute;left:5px;top:0;bottom:0;width:1px;background:transparent;pointer-events:none;}
.panel-resizer:hover::before, .dm-resizing .panel-resizer::before{background:#89a5c9;}
.panel-resizer-left{left:var(--left);}
.panel-resizer-right{left:calc(100% - var(--right) - var(--scrollbar-space,0px));}

.dock{position:relative;height:var(--dock-height,126px)!important;min-height:0!important;max-height:calc(100dvh - 230px);}
.dock-scroll{padding-right:47px!important;}
.dock-resizer{position:absolute;top:-4px;left:0;right:0;height:8px;z-index:25;cursor:row-resize;touch-action:none;background:transparent;}
.dock-resizer:hover::after, .dm-resizing .dock-resizer::after{content:"";position:absolute;top:3px;left:0;right:0;height:1px;background:#91b2d8;}
.dock-toggle{position:absolute;top:5px;width:23px;height:23px;display:grid;place-items:center;padding:0;border:1px solid #8799b063;background:#53698124;color:#8198b2;border-radius:5px;z-index:5;}
.dock-toggle:hover{background:#a5bcd044;color:#d9eaff;}
.dock-mini-title{display:none;position:absolute;top:6px;left:12px;font-size:10px;letter-spacing:1px;font-weight:750;color:#94aac4;}
.dock.is-collapsed .dock-scroll{display:none;}
.dock.is-collapsed .dock-mini-title{display:block;}
.dock.is-collapsed .dock-toggle{top:2px;height:23px;}
.toolbar-notes-btn{height:34px;width:34px;min-width:34px;display:grid;place-items:center;padding:0;border-radius:7px;}
.toolbar-notes-btn svg{display:block;}
.toolbar-notes-btn[aria-pressed="true"]{background:#476788;border-color:#7f9fc1;}
/* Poziomy pasek: natywny scrollbar-color zgodny z górnym pionowym przewijaniem. */
/* Nowy przełącznik ukrywa jedynie metki na kartach, nie ich dane ani etykiety w bibliotece. */
.board-controls{display:flex;align-items:center;justify-content:flex-end;gap:3px;flex:none;}
/* dyskretne separatory grup narzędzi, bez nowych stref nakładanych na planszę. */
.board-controls-divider{display:block;flex:0 0 1px;width:1px;height:16px;margin:0 5px;background:#a6b5c7;pointer-events:none;align-self:center;}
html[data-theme="dark"] .board-controls-divider{background:#586e86;}
.tile-labels-hidden .tile-tags{display:none!important;}
.tile-labels-toggle[aria-pressed="false"]{color:#6c829a;opacity:.82;}

/* Filtr wątków: lista wyboru jest niezależna od wyszukiwarki wydarzeń. */
.thread-filter-wrap{position:relative;flex:none;}
.btn.thread-filter-btn{width:34px;height:34px;min-width:34px;display:grid;place-items:center;padding:0;border-radius:7px;}
.thread-filter-btn[aria-pressed="true"]{background:#476788;border-color:#91b1d7;color:#fff;}
.thread-filter-panel{position:absolute;right:0;top:calc(100% + 9px);z-index:120;width:320px;max-width:calc(100vw - 24px);max-height:min(580px,calc(100vh - 77px));display:flex;flex-direction:column;overflow:hidden;padding:0;border:1px solid #a6b9cd;border-radius:9px;background:#f9fbff;color:#243750;box-shadow:0 14px 34px #0c192d77;}
.thread-filter-panel[hidden]{display:none!important;}
.thread-filter-top{padding:11px 12px 7px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;}
.thread-filter-close{border:0;background:transparent;color:inherit;padding:0 4px;font-size:21px;line-height:1.1;}
.thread-filter-input{display:block;width:calc(100% - 24px);margin:0 12px 9px;padding:9px 10px;border-radius:6px;border:1px solid #a8bad0;background:#fff;color:#243750;font-size:12px;}
.thread-filter-counter{padding:0 12px 7px;font-size:11px;color:#657991;}
.thread-filter-list{min-height:38px;overflow-y:auto;overscroll-behavior:contain;padding:5px 7px;border-top:1px solid #d6e0ec;border-bottom:1px solid #d6e0ec;}
.thread-filter-item{display:flex;align-items:center;gap:9px;min-height:35px;padding:6px 8px;border-radius:5px;font-size:12px;cursor:pointer;overflow-wrap:anywhere;}
.thread-filter-item:hover{background:#e6effa;}
.thread-filter-item input{width:15px;height:15px;margin:0;flex:none;accent-color:#416eaa;cursor:pointer;}
.thread-filter-item span{min-width:0;flex:1;}
.thread-filter-empty{padding:12px 7px;font-size:12px;color:#687e99;}
.thread-filter-actions{display:flex;gap:7px;padding:10px 12px;}
.thread-filter-actions button{flex:1;min-width:0;padding:9px 6px;border-radius:6px;font-size:11px;font-weight:650;white-space:nowrap;border:1px solid #9aadc4;background:#e7eef8;color:#263d5b;}
.thread-filter-actions button:hover:not(:disabled){background:#d5e4f5;}
.thread-filter-actions .thread-filter-apply{background:#456b92;color:#fff;border-color:#456b92;}
.thread-filter-actions .thread-filter-apply:hover:not(:disabled){background:#35577d;}
.thread-filter-actions button:disabled{opacity:.45;cursor:not-allowed;}
html[data-theme="dark"] .thread-filter-panel{background:#253348;color:#e9f0fa;border-color:#526881;box-shadow:0 13px 34px #0009;}
html[data-theme="dark"] .thread-filter-input{background:#1b293a;color:#f0f5fb;border-color:#65768d;}
html[data-theme="dark"] .thread-filter-counter, html[data-theme="dark"] .thread-filter-empty{color:#acbdd3;}
html[data-theme="dark"] .thread-filter-list{border-color:#41536a;}
html[data-theme="dark"] .thread-filter-item:hover{background:#344961;}
html[data-theme="dark"] .thread-filter-actions button{background:#30445b;color:#eaf0fa;border-color:#60758e;}
html[data-theme="dark"] .thread-filter-actions button:hover:not(:disabled){background:#3e5570;}
html[data-theme="dark"] .thread-filter-actions .thread-filter-apply{background:#5479a2;border-color:#7193b7;}
html[data-theme="dark"] .thread-filter-actions .thread-filter-apply:hover:not(:disabled){background:#6489b3;}

/* Potwierdzenia podmiany projektu - Anuluj jako podstawowy, początkowo aktywny wybór. */
.project-switch-backdrop{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;padding:20px;background:rgba(5,11,22,.72);}
.project-switch-dialog{width:min(445px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid #52677f;border-radius:13px;background:#223146;color:#ecf3fb;box-shadow:0 19px 65px #000a;padding:23px 24px;}
.project-switch-dialog h2{font-size:17px;line-height:1.35;font-weight:700;margin:0 0 10px;}
.project-switch-dialog p{font-size:13px;line-height:1.6;margin:0 0 13px;color:#d2dfed;}
.project-switch-warning{border-left:3px solid #d1a568;padding:8px 11px;background:#ffffff09;}
.project-switch-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:19px;flex-wrap:wrap;}
.project-switch-actions button{border:1px solid #657d9a;border-radius:8px;min-height:39px;padding:9px 16px;background:#2f4158;color:#eaf0fa;font-size:12px;font-weight:650;}
.project-switch-actions button:hover{background:#405570;}
.project-switch-actions .project-switch-cancel{background:#bcd8f6;border-color:#bcd8f6;color:#14283f;font-weight:750;order:0;}
.project-switch-actions .project-switch-cancel:hover{background:#d7e9fc;}
.project-switch-actions .project-switch-confirm{order:1;border-color:#a87472;color:#ffceca;background:transparent;}
.project-switch-actions .project-switch-confirm:hover{background:#663a40;color:#fff;}
.project-switch-dialog .project-switch-cancel:focus-visible{outline:3px solid #e3f0ff!important;outline-offset:3px!important;box-shadow:0 0 0 5px #6b9bc8!important;}
html[data-theme="light"] .project-switch-dialog{background:#fff;color:#24354c;border-color:#a9bbcf;box-shadow:0 15px 55px #0006;}
html[data-theme="light"] .project-switch-dialog p{color:#4a5e75;}
html[data-theme="light"] .project-switch-warning{background:#fff7e9;border-left-color:#bc8355;}
html[data-theme="light"] .project-switch-actions .project-switch-cancel{background:#315b89;color:#fff;border-color:#315b89;}
html[data-theme="light"] .project-switch-actions .project-switch-confirm{background:#fff;color:#a13d40;border-color:#bd9999;}
html[data-theme="light"] .project-switch-actions .project-switch-confirm:hover{background:#f9e8e8;}

.btn.graph-mode-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;min-height:34px;padding:0;border-radius:7px;}
@media(max-width:720px){.btn.graph-mode-btn{width:32px;height:32px;min-width:32px;min-height:32px}}
.graph-mode-btn[aria-pressed="true"]{border-color:#95aec9!important;background:#384f68!important;}
.graph-tool{display:grid;place-items:center;width:25px;height:25px;min-width:25px;padding:0;border-radius:5px;}
.graph-tool-active{background:#48698c!important;color:#f8fbff!important;}
.graph-mode-active .track-strip{gap:24px;}
.graph-board{position:relative;overflow:visible;min-height:182px;}
/* Stabilne przewijanie jest zarządzane przez graf, nie przez natywne scroll anchoring. */
.graph-mode-active .upper-scroll{overflow-anchor:none;}
.graph-wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0;color:#8598ae;}
.graph-wire-local{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.72;}
.graph-wire-before{fill:none;stroke:color-mix(in srgb,var(--graph-source-color,#7da5d0) 84%,#e5f0ff);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;marker-start:none;marker-mid:none;marker-end:none;}
html[data-theme="light"] .graph-wire-before{stroke:color-mix(in srgb,var(--graph-source-color,#7da5d0) 78%,#273c54);}
.graph-wire-equal{fill:none;stroke:#be9bf0;stroke-width:2.5;marker-start:none;marker-mid:none;marker-end:none;}
/* dwie gładkie krawędzie Béziera wyznaczają bezszwową wstęgę
   o szerokości 5→1 px. Zewnętrzny path jest wypełniony, bo sam SVG stroke
   nie obsługuje zmiennej grubości. Relacje equal pozostają liniami. */
.graph-wires .graph-wire-before{fill:color-mix(in srgb,var(--graph-source-color,#7da5d0) 84%,#e5f0ff);stroke:none;stroke-width:0;marker-start:none;marker-mid:none;marker-end:none;}
html[data-theme="light"] .graph-wires .graph-wire-before{fill:color-mix(in srgb,var(--graph-source-color,#7da5d0) 78%,#273c54);stroke:none;}
.graph-wires .graph-wire-local{fill:currentColor;stroke:none;stroke-width:0;marker-start:none;marker-mid:none;marker-end:none;}


/* Chwilowy cel nawigacji z menu etykiety - bez zmiany wymiarów wpisu. */
.wiki-entry-heading.wiki-target-flash{
 --wiki-flash-bg: #ffe3a0;
 --wiki-flash-edge: #ae710c;
 border-radius:5px;
 animation:wiki-target-pulse 750ms ease-in-out 2;
}
html[data-theme="dark"] .wiki-entry-heading.wiki-target-flash{
 --wiki-flash-bg:#725523;
 --wiki-flash-edge:#f5ca73;
}
@keyframes wiki-target-pulse{
 0%,100%{background-color:transparent;box-shadow:inset 0 0 0 2px transparent;}
 35%,65%{background-color:var(--wiki-flash-bg);box-shadow:inset 0 0 0 2px var(--wiki-flash-edge);}
}
@media(prefers-reduced-motion:reduce){
 .wiki-entry-heading.wiki-target-flash{animation:none;background-color:var(--wiki-flash-bg);box-shadow:inset 0 0 0 2px var(--wiki-flash-edge);}
}

.notes-editor .note-image-drop-before,.wiki-editor .note-image-drop-before{box-shadow:0 -2px 0 #719ac5;}
.notes-editor .note-image-drop-after,.wiki-editor .note-image-drop-after{box-shadow:0 2px 0 #719ac5;}

@media(max-width:760px){.app-footer:has(.json-backup-warning:not([hidden])) .app-footer-license{display:none}.app-footer .json-backup-warning{order:-1}}
@media(max-width:480px){.app-footer:has(.json-backup-warning:not([hidden])) .app-footer-date{display:none}}

/* Duże sekcje dokumentu, bez zmian w bibliotece etykiet. */
.wiki-heading-row{background:color-mix(in srgb,var(--wiki-category-color) 48%,#e8edf4);border-radius:4px;padding:8px 10px;margin:0 0 15px;}
.wiki-heading-row>h1{font-size:18px;line-height:1.35;font-weight:750;margin:0;overflow-wrap:anywhere;}
html[data-theme="dark"] .wiki-heading-row{background:color-mix(in srgb,var(--wiki-category-color) 43%,#243348);}
.wiki-entry-heading>h2{font-size:17px;line-height:1.4;font-weight:700;margin:0;overflow-wrap:anywhere;}
.wiki-label-select{display:block;width:100%;border:0;padding:3px 0;text-align:left;background:transparent;color:inherit;font:inherit;overflow-wrap:anywhere;cursor:pointer;}
.wiki-label-select:hover{text-decoration:underline;text-underline-offset:3px;}
.wiki-label-select:focus-visible{outline:2px solid #709bd3;outline-offset:2px;border-radius:3px;}
.wiki-entry-heading.label-focus{border-radius:4px;background:color-mix(in srgb,var(--label-focus-color) 45%,#ffe3a0);box-shadow:inset 0 0 0 1px #9b773e;color:#192c42;}
html[data-theme="dark"] .wiki-entry-heading.label-focus{background:color-mix(in srgb,var(--label-focus-color) 44%,#6f5736);box-shadow:inset 0 0 0 1px #ad956b;color:#fff9ed;}

/* Nagłówki sekcji i pierwszy poziom spisu treści tylko w panelu dokumentu. */
.notes-panel .notes-section-top{background:#dce6f0;border-radius:4px;padding:8px 10px;margin:0 0 15px;box-sizing:border-box;}
.notes-panel .notes-section-top .notes-section-name{font-size:18px;font-weight:750;overflow-wrap:anywhere;white-space:normal;}
html[data-theme="dark"] .notes-panel .notes-section-top{background:#2d4057;}
.notes-panel .notes-outline-item[data-outline-section]{background:#dce6f0;border-radius:4px;margin-top:6px;white-space:normal;overflow-wrap:anywhere;}
.notes-panel .notes-outline-item[data-outline-section="wiki"]{background:color-mix(in srgb,var(--wiki-category-color) 48%,#e8edf4);}
html[data-theme="dark"] .notes-panel .notes-outline-item[data-outline-section]{background:#2d4057;}
html[data-theme="dark"] .notes-panel .notes-outline-item[data-outline-section="wiki"]{background:color-mix(in srgb,var(--wiki-category-color) 43%,#243348);}
.notes-panel .notes-outline-item[data-outline-section]:hover,.notes-panel .notes-outline-item[data-outline-section]:focus-visible,.notes-panel .notes-outline-item[data-outline-section][aria-current="location"]{background:#c4d9ed;color:#24496f;}
html[data-theme="dark"] .notes-panel .notes-outline-item[data-outline-section]:hover,html[data-theme="dark"] .notes-panel .notes-outline-item[data-outline-section]:focus-visible,html[data-theme="dark"] .notes-panel .notes-outline-item[data-outline-section][aria-current="location"]{background:#385573;color:#fff;}
.notes-panel .notes-search-current>.notes-section-top{background:#f4e2b7;}
html[data-theme="dark"] .notes-panel .notes-search-current>.notes-section-top{background:#564d39;}
.graph-node{position:absolute;z-index:1;min-width:0;box-sizing:border-box;}
.graph-node .tile{width:100%;height:auto;min-height:54px;
 /* Cienki obrys: SOLID używa natywnego border, a DASHED jednej ścieżki
   SVG ciągłej również na zaokrąglonych rogach. Oba mają wspólną grubość. */
 --dm-graph-line-color:color-mix(in srgb,var(--tile-accent) 76%,#42566f);
 border:var(--dm-tile-border-width) solid var(--dm-graph-line-color);
}
html[data-theme="dark"] .graph-node .tile{
 --dm-graph-line-color:color-mix(in srgb,var(--tile-accent) 78%,#dce7f5);
 border-color:var(--dm-graph-line-color);
}
.graph-node .tile.selected{
 --dm-graph-line-color:color-mix(in srgb,var(--tile-accent) 86%,#ecf4ff);
}
.app .graph-node.graph-uncertain .tile{border-color:transparent;}
.graph-node .graph-tile-outline{
 position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);overflow:visible;
 pointer-events:none;user-select:none;z-index:1;
}
.graph-node .graph-tile-outline rect{
 x:.5px;y:.5px;width:calc(100% - 1px);height:calc(100% - 1px);
 rx:6.5px;ry:6.5px;
 fill:none;stroke:var(--dm-graph-line-color);
 stroke-width:var(--dm-tile-border-width);vector-effect:non-scaling-stroke;
 stroke-linejoin:round;
}
/* Kreska 9 px / przerwa 8 px na całym obrysie, także na narożnikach. */
.graph-node.graph-uncertain .graph-tile-outline rect{stroke-dasharray:9px 8px;}
.graph-node.graph-certain .graph-tile-outline,
.app.graph-borders-uniform .graph-node .graph-tile-outline{display:none;}
/* W trybie jednolitym każdy kafelek wraca do natywnego obrysu 1 px. */
.app.graph-borders-uniform .graph-node .tile{border-style:solid;border-color:var(--dm-graph-line-color);}
/* Zachowanie specjalnego obrysu dla zgłaszanego konfliktu relacji. */
.graph-node.graph-conflict-node .graph-tile-outline{display:none;}
/* Testowy identyfikator wydarzenia: sam tekst na środku górnego obrysu.
   Nie jest częścią treści, nie dodaje wysokości i nie przechwytuje kliknięć. */
.graph-node > .qa-tile-index{
 position:absolute;top:-6px;left:50%;transform:translateX(-50%);
 z-index:6;pointer-events:none;user-select:none;white-space:nowrap;
 padding:0 4px;margin:0;border:0;border-radius:0;box-shadow:none;
 background:color-mix(in srgb,var(--tile-accent) 57%,white);
 color:#273850;font:400 10px/12px "Segoe UI",Arial,sans-serif;
 letter-spacing:.1px;
}
html[data-theme="dark"] .graph-node > .qa-tile-index{
 background:color-mix(in srgb,var(--tile-accent) 25%,#1d2a3a);
 color:#e8f0fb;
}
/* Wspólna linia bazowa oznaczenia i nazwy wątku (także przy zoomie
   i zawijaniu długiej nazwy). Bez osobnych rozmiarów fontu ani flex-itemów. */
.track-head .qa-track-label{
 display:block;flex:1;min-width:0;overflow:hidden;overflow-wrap:anywhere;
 font:600 12px/1.3 "Segoe UI",Arial,sans-serif;
}
.track-head .qa-track-label .editable{
 display:inline;font:inherit;line-height:inherit;overflow:visible;
 overflow-wrap:anywhere;word-break:normal;
}
.track-head .qa-track-prefix{
 display:inline;white-space:nowrap;font-size:inherit;font-weight:700;line-height:inherit;
 opacity:.88;pointer-events:none;user-select:none;
}
.track-head.is-empty .track-options.qa-track-empty-code{
 font:700 12px/1.3 "Segoe UI",Arial,sans-serif;
}
/* Dyskretne oznaczenia kolejności kliknięć (nie kolejności kolumn). */
.graph-node.graph-choice-one .tile, .graph-node.graph-choice-two .tile{outline:2px solid color-mix(in srgb,var(--tile-accent) 80%,#e5efff);outline-offset:2px;}
.graph-node.graph-choice-one .tile:focus-within, .graph-node.graph-choice-two .tile:focus-within, .graph-node.graph-choice-more .tile:focus-within{outline:2px solid color-mix(in srgb,var(--tile-accent) 80%,#e5efff)!important;outline-offset:2px;}
html[data-theme="light"] .graph-node.graph-choice-one .tile:focus-within, html[data-theme="light"] .graph-node.graph-choice-two .tile:focus-within, html[data-theme="light"] .graph-node.graph-choice-more .tile:focus-within{outline-color:color-mix(in srgb,var(--tile-accent) 78%,#435a72)!important;}
html[data-theme="light"] .graph-node.graph-choice-one .tile, html[data-theme="light"] .graph-node.graph-choice-two .tile{outline-color:color-mix(in srgb,var(--tile-accent) 78%,#435a72);}
.graph-node[data-graph-choice].graph-choice-one::after, .graph-node[data-graph-choice].graph-choice-two::after{content:attr(data-graph-choice);position:absolute;right:-7px;top:-9px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#203047;font:bold 11px/1 system-ui;z-index:5;pointer-events:none;box-shadow:0 1px 4px #0004;}
.graph-node.graph-choice-one::after{background:var(--tile-accent);}
.graph-node.graph-choice-two::after{background:var(--tile-accent);}
.graph-tool:disabled{opacity:.56;cursor:default;}
/* Lokalny wybór jednej z trzech relacji; poza przepływem grafu. */
.graph-link-popover{position:fixed;z-index:11000;box-sizing:border-box;width:min(356px,calc(100vw - 16px));padding:12px;border-radius:11px;background:var(--panel,#243448);color:var(--text,#e5eaf0);border:1px solid var(--line,#71849b);box-shadow:0 14px 40px #0006;font:12px/1.45 system-ui,sans-serif;}
.graph-link-popover-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px;}
.graph-link-close{background:transparent;border:0;color:inherit;font-size:19px;line-height:1;cursor:pointer;padding:0 5px;border-radius:4px;}
.graph-link-close:hover{background:#9caac133;}
.graph-link-pair{display:flex;gap:7px;align-items:center;margin-bottom:10px;min-width:0;}
.graph-link-name{min-width:0;max-width:48%;padding:4px 7px;border-radius:5px;border:1px solid color-mix(in srgb,var(--link-color,#8ea2b7) 58%,#ffffff26);background:color-mix(in srgb,var(--link-color,#8ea2b7) 18%,#ffffff0d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.graph-link-name b{display:inline-grid;place-items:center;width:16px;height:16px;margin-right:4px;border-radius:50%;color:var(--link-ink,#26313f);background:var(--link-color,#f2b775);font-size:10px;font-weight:800;}
.graph-link-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
.graph-link-option{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 3px 8px;border:1px solid #94a6ba55;border-radius:8px;color:inherit;background:#8b9aac13;cursor:pointer;font:600 11px/1.25 system-ui,sans-serif;}
.graph-link-option:hover, .graph-link-option:focus-visible{background:#7194b82e;border-color:#8bb2da;outline:none;}
.graph-link-option.is-current{background:#5b80a54a;border-color:#9bbcdc;}
.graph-link-mini{position:relative;width:84px;height:74px;max-width:100%;border-radius:5px;}
.graph-link-mini-node{position:absolute;width:32px;height:21px;display:grid;place-items:center;border-radius:4px;color:#25313e;font-weight:800;font-size:12px;box-shadow:0 1px 2px #0002;}
.graph-link-mini-node.one{left:5px;background:#f2b775;border:1px solid #d19965;}
.graph-link-mini-node.two{right:5px;background:#81cfe1;border:1px solid #65b0c1;}
.graph-link-mini-line{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#9bbcdc;stroke-width:2;stroke-linecap:round;pointer-events:none;}
.graph-link-error{margin:9px 0 0;color:#f0adab;font-size:11px;line-height:1.4;}
.graph-link-remove-wrap{margin-top:12px;padding-top:12px;border-top:1px solid #91a2b74d;}
.graph-link-remove{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;min-height:48px;margin:0;padding:9px 12px;border:1px solid #d77a7e;border-radius:8px;background:#c9556025;color:#ffc6cb;cursor:pointer;text-align:left;font:700 12px/1.25 system-ui,sans-serif;transition:background .14s,border-color .14s;}
.graph-link-remove svg{width:19px;height:19px;flex:none;}
.graph-link-remove:hover, .graph-link-remove:focus-visible{background:#c9556040;border-color:#f3a2a5;outline:none;}
.graph-link-remove:active{background:#c9556050;}
.graph-link-remove small{display:block;margin-top:2px;font-size:10px;font-weight:500;color:inherit;opacity:.82;}
html[data-theme="light"] .graph-link-remove-wrap{border-top-color:#cad5e0;}
html[data-theme="light"] .graph-link-remove{background:#fff2f2;border-color:#ce757e;color:#9d2735;}
html[data-theme="light"] .graph-link-remove:hover, html[data-theme="light"] .graph-link-remove:focus-visible{background:#ffe0e3;border-color:#ad3642;}
.graph-tool.graph-tool-active{background:#48698c!important;color:#f8fbff!important;}
.graph-node.graph-choice-more .tile{outline:2px solid color-mix(in srgb,var(--tile-accent) 80%,#e5efff);outline-offset:2px;}
html[data-theme="light"] .graph-node.graph-choice-more .tile{outline-color:color-mix(in srgb,var(--tile-accent) 78%,#435a72);}
.graph-node[data-graph-choice].graph-choice-more::after{content:attr(data-graph-choice);position:absolute;right:-7px;top:-9px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--tile-accent);color:#203047;font:bold 11px/1 system-ui;z-index:5;pointer-events:none;}
html[data-theme="light"] .graph-link-popover{background:#fff;color:#273950;border-color:#b6c5d6;box-shadow:0 12px 32px #21344c3b;}
html[data-theme="light"] .graph-link-name{background:color-mix(in srgb,var(--link-color,#8ea2b7) 20%,white);border-color:color-mix(in srgb,var(--link-color,#8ea2b7) 55%,#cfd8e4);}
html[data-theme="light"] .graph-link-option{background:#f5f7fa;border-color:#cbd5e1;}
html[data-theme="light"] .graph-link-option:hover, html[data-theme="light"] .graph-link-option:focus-visible{background:#e3edfa;border-color:#6b98c7;}
html[data-theme="light"] .graph-link-option.is-current{background:#d9e9fb;border-color:#6b98c7;}
html[data-theme="light"] .graph-link-error{color:#a43b38;}


.graph-node.drop{outline:2px dashed #99b8d4;outline-offset:2px;border-radius:7px;}

.graph-project{grid-template-rows:minmax(0,1fr);min-height:100%;}
.graph-project .chapter-middle{min-height:100%;padding:0;overflow:clip;}
.graph-project .chapter-left, .graph-project .chapter-right{min-height:100%;}
.graph-project .graph-board{min-height:100%;cursor:crosshair;}
.graph-lane{position:absolute;top:0;bottom:0;z-index:0;box-sizing:border-box;--lane-dot:color-mix(in srgb,var(--track-color) 22%,transparent);background-color:transparent;background-image:linear-gradient(to bottom,var(--lane-dot) 0 1px,transparent 1px 6px),linear-gradient(to bottom,var(--lane-dot) 0 1px,transparent 1px 6px);background-position:left top,right top;background-size:1px 6px,1px 6px;background-repeat:repeat-y;border:0;cursor:crosshair;}
.graph-lane:hover{background-color:transparent;}
.graph-node{cursor:grab;}
.graph-board .graph-wires{z-index:3;}
.graph-board .graph-node{z-index:4;}
@media (prefers-reduced-motion: reduce){.graph-node{animation:none!important;transition:none!important}}

/* Eksperymentalne rozdziały grafu: poziome obszary na całą szerokość planszy. */
.graph-chapter-layers{position:absolute;inset:0;z-index:1;pointer-events:none;}
/* W każdym rozdziale grafu obowiązuje identyczne tło, niezależne od numeru i kolejności utworzenia. */
.graph-chapter-band{position:absolute;left:0;right:0;box-sizing:border-box;border-top:1px solid #8ca2bb6c;border-bottom:1px solid #8ca2bb6c;background:rgba(120,151,187,.055);pointer-events:none;}
.graph-chapter-band.graph-chapter-gap{background:rgba(127,144,165,.025);border-top:1px solid #8ca2bb55;border-bottom:1px solid #8ca2bb55;}
.graph-chapter-band.is-drop-target{background:rgba(120,175,231,.22)!important;box-shadow:inset 0 0 0 2px rgba(118,188,243,.6);}
.graph-chapter-band-head{position:absolute;top:7px;left:32px;right:15px;display:flex;align-items:center;gap:9px;min-height:23px;font:700 12px/1.25 system-ui,sans-serif;pointer-events:none;}
.graph-chapter-band-head .graph-chapter-name{display:inline-block;max-width:330px;border:1px solid transparent;border-radius:4px;padding:3px 7px;color:var(--text,#dfe9f8);background:rgba(25,40,55,.4);pointer-events:auto;}
.graph-chapter-band-head .graph-chapter-name[contenteditable="true"]:focus{border-color:#8ab8ea;outline:none;}
.graph-chapter-band-head .graph-chapter-counter{color:var(--muted,#9aacc3);font:500 11px/1.2 system-ui,sans-serif;}
.graph-chapter-band.graph-chapter-gap .graph-chapter-name{color:var(--muted,#9aacc3);font-weight:550;background:transparent;}
.graph-chapter-band.graph-chapter-gap .graph-chapter-band-head{left:145px;}
html[data-theme="light"] .graph-chapter-band-head .graph-chapter-name{color:#334b64;background:#ffffffd9;}
html[data-theme="light"] .graph-chapter-band.graph-chapter-gap .graph-chapter-name{color:#63788f;background:transparent;}
/* Naglowki rozdzialow sa wspolne dla paneli 01 / 02 / 03 (jak w widoku tabeli). */
.graph-project{position:relative;}
.graph-chapter-overlays{position:absolute;inset:0;pointer-events:none;overflow:visible;}

.graph-chapter-banner-left, .graph-chapter-banner-center, .graph-chapter-banner-right{min-width:0;display:flex;align-items:center;padding:4px 10px;gap:9px;}


.graph-chapter-banner-index{font-size:12px;font-weight:650;white-space:nowrap;}
.graph-chapter-banner-name{font-size:12px;font-weight:650;min-width:80px;max-width:50%;border-radius:4px;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;}
.graph-chapter-banner-name:focus{outline:1px solid #78addf;background:#ffffff24;}
.graph-chapter-banner-count{font-size:11px;color:#657b92;white-space:nowrap;}






.graph-chapter-add-slot{position:absolute;left:var(--left);right:var(--right);height:30px;display:flex;align-items:flex-start;padding:3px 0 0 15px;box-sizing:border-box;pointer-events:none;z-index:3;}
.graph-chapter-add-button{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:25px;padding:0 9px;border:1px solid #6b879f79;border-radius:5px;background:#e6edf5;color:#466781;font:650 11px/1 system-ui,sans-serif;cursor:pointer;transition:background-color .15s,border-color .15s;}
.graph-chapter-add-button:hover, .graph-chapter-add-button:focus-visible{background:#cfe1f4;border-color:#527eae;outline:2px solid #527eae88;outline-offset:1px;}
html[data-theme="dark"] .graph-chapter-banner{background:#26384d;color:#e6edf7;border-top-color:#4b6582;border-bottom-color:#4b6079;}
html[data-theme="dark"] .graph-chapter-banner-left{border-right-color:#42546c;}
html[data-theme="dark"] .graph-chapter-banner-right{border-left-color:#42546c;}
html[data-theme="dark"] .graph-chapter-banner-count{color:#9fb2cb;}
html[data-theme="dark"] .graph-chapter-add-button{background:#233448;color:#c7d9f0;border-color:#647f9d;}
html[data-theme="dark"] .graph-chapter-add-button:hover, html[data-theme="dark"] .graph-chapter-add-button:focus-visible{background:#354d68;border-color:#9fbde0;}
.upper-shell.left-collapsed .graph-chapter-banner-left{padding:3px 5px;}
.upper-shell.left-collapsed .graph-chapter-banner-index{font-size:10px;}
.upper-shell.right-collapsed .graph-chapter-banner-right{padding:0;}
/* Zwinięte pasy grafu nie powinny układać opisów i statystyk pionowo. */
.upper-shell.left-collapsed .graph-chapter-banner-left > *,
.upper-shell.right-collapsed .graph-chapter-banner-right > *,
.upper-shell.left-collapsed .graph-chapter-side-left > *,
.upper-shell.right-collapsed .graph-chapter-side-right > *{visibility:hidden;}
/* Włączone rozdziały są świadomym stanem widoku: przycisk jest podświetlony.
   Wyłączony pozostaje neutralny, jak pozostałe przełączniki. */
.graph-chapters-tool[aria-pressed="false"]:not(:hover):not(:focus-visible){opacity:.6;}

/* Szyna rozdziałów mieści się w pustym marginesie na początku planszy. */
.graph-chapter-rail{position:absolute;z-index:12;left:var(--left);width:25px;box-sizing:border-box;border-left:1px solid rgba(123,152,185,.43);border-right:1px solid rgba(123,152,185,.38);background:rgba(100,129,163,.075);pointer-events:none;overflow:visible;}
.graph-rail-selection{position:absolute;left:2px;right:2px;border:1px solid rgba(130,192,242,.8);border-radius:5px;background:rgba(98,170,224,.17);box-sizing:border-box;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.graph-rail-selection::before, .graph-rail-selection::after{content:"";position:absolute;left:-3px;width:7px;height:2px;background:#9ac8ee;}
.graph-rail-selection::before{top:-1px;}.graph-rail-selection::after{bottom:-1px;}
.graph-rail-selection button, .graph-rail-boundary-add{appearance:none;display:flex;align-items:center;justify-content:center;width:20px;height:20px;min-width:20px;min-height:20px;border:1px solid #7c9dbe;border-radius:5px;background:#314a68;color:#e9f3ff;box-shadow:0 1px 4px #0004;font:700 16px/1 system-ui,sans-serif;cursor:pointer;pointer-events:auto;padding:0;}
.graph-rail-selection button:hover, .graph-rail-selection button:focus-visible, .graph-rail-boundary-add:hover, .graph-rail-boundary-add:focus-visible{background:#4779a8;border-color:#bbd9f6;outline:2px solid #8bbbee66;outline-offset:1px;}
.graph-rail-selection button{position:sticky;top:45px;bottom:45px;}
.graph-rail-boundary-add{position:absolute;left:2px;width:19px;height:19px;min-height:19px;font-size:15px;opacity:.8;}
.graph-rail-boundary-add:hover, .graph-rail-boundary-add:focus-visible{opacity:1;}
/* Miejsce na szynę w nagłówku rozdziału: przycisk nie zasłania nazwy. */
.graph-chapter-banner-center{padding-left:34px;}
html[data-theme="light"] .graph-chapter-rail{background:rgba(118,163,204,.10);border-color:#a3b8d2;}
html[data-theme="light"] .graph-rail-selection{background:rgba(91,154,201,.12);border-color:#699ec5;}
html[data-theme="light"] .graph-rail-selection button, html[data-theme="light"] .graph-rail-boundary-add{background:#e7f1fa;color:#28517a;border-color:#7aa0c1;box-shadow:0 1px 3px #31445b33;}
html[data-theme="light"] .graph-rail-selection button:hover, html[data-theme="light"] .graph-rail-boundary-add:hover{background:#c4e1f9;}


/* Cztery rzeczywiste kolumny: 01 | szyna | 02 | 03. */
.upper-shell.graph-rail-integrated .upper-head, .upper-shell.graph-rail-integrated .h-rail-grid, .upper-shell.graph-rail-integrated .graph-project{
 grid-template-columns:var(--left) var(--graph-rail-width) minmax(0,1fr) var(--right);
}
.graph-rail-head, .graph-rail-scroll-spare{display:none;}
.graph-rail-integrated .graph-rail-head{
 display:block;min-width:0;background:#edf1f7;border-right:2px solid #8da1b9;
}
.graph-rail-integrated .graph-rail-scroll-spare{
 display:block;min-width:0;background:#e7edf4;border-right:2px solid #8da1b9;
}
.graph-rail-integrated .panel-cap.left{border-right:0;}
.graph-rail-integrated .h-rail-grid .spare:first-child{border-right:0;}
.graph-rail-integrated .graph-project .chapter-left{border-right:0;padding-right:10px;}
.graph-rail-integrated .graph-project .chapter-right{grid-column:4;grid-row:1;}
.graph-rail-integrated .graph-project .chapter-middle{grid-column:3;grid-row:1;}
.graph-rail-integrated .graph-project .chapter-left{grid-column:1;grid-row:1;}
.upper-shell.graph-rail-integrated .graph-chapter-rail{
 grid-column:2;grid-row:1;align-self:stretch;position:relative;
 left:auto;right:auto;top:0;width:100%;height:100%;min-height:100%;
 box-sizing:border-box;border:0;border-right:2px solid #42546c;
 overflow:visible;
}
.upper-shell.graph-rail-integrated .graph-chapter-banner{
 grid-template-columns:var(--left) var(--graph-rail-width) minmax(0,1fr) var(--right);
}


.graph-rail-integrated .graph-chapter-banner-rail{display:block;min-width:0;background:inherit;border-right:2px solid #8da1b9;}



/* Każdy przycisk jest wyśrodkowany w szynie, a jego środek leży na krawędzi rozdziału. */





html[data-theme="dark"] .graph-rail-integrated .graph-rail-head{background:#1a2635;border-right-color:#42546c;}
html[data-theme="dark"] .graph-rail-integrated .graph-rail-scroll-spare{background:#1d2b3c;border-right-color:#42546c;}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-chapter-rail{background:transparent;border-right-color:#a0aec1;}
html[data-theme="light"] .graph-rail-integrated .graph-rail-head{background:#edf1f7;border-right-color:#8da1b9;}
html[data-theme="light"] .graph-rail-integrated .graph-rail-scroll-spare{background:#e7edf4;border-right-color:#8da1b9;}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection{
 border-right-color:#518cbf;background:linear-gradient(90deg,transparent,rgba(75,135,185,.13));
}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add{background:transparent;border:0;box-shadow:none;}


/* W grafie lewy uchwyt należy do całego bloku OPIS + szyna rozdziałów,
   więc siedzi na jego zewnętrznej prawej krawędzi. */
.upper-shell.graph-rail-integrated .panel-resizer-left{
 left:calc(var(--left) + var(--graph-rail-width));
}
.upper-shell.graph-rail-integrated .panel-resizer-left::before{
 left:5px;width:2px;background:#58718e;
}
html[data-theme="light"] .upper-shell.graph-rail-integrated .panel-resizer-left::before{background:#8da1b9;}
.upper-shell.graph-rail-integrated .panel-resizer-left:hover::before, .dm-resizing .upper-shell.graph-rail-integrated .panel-resizer-left::before{background:#a6c8ec;}

/* Prawdziwe, stale widoczne pionowe separatory 01|szyna|02. */
.graph-rail-integrated .graph-rail-head, .graph-rail-integrated .graph-rail-scroll-spare, .upper-shell.graph-rail-integrated .graph-chapter-rail, .graph-rail-integrated .graph-chapter-banner-rail{
 border-left:1px solid #42546c;
 border-right:2px solid #58718e;
}
html[data-theme="light"] .graph-rail-integrated .graph-rail-head, html[data-theme="light"] .graph-rail-integrated .graph-rail-scroll-spare, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-chapter-rail, html[data-theme="light"] .graph-rail-integrated .graph-chapter-banner-rail{
 border-left-color:#b4c3d6;border-right-color:#8da1b9;
}
/* Ciągłe poziome obramowania rozdziałów, również przez szynę (ta ma
   wyższą warstwę, dlatego musi odtworzyć zakryte fragmenty linii). */
.graph-rail-integrated{--graph-chapter-separator:#647e9d;}
html[data-theme="light"] .graph-rail-integrated{--graph-chapter-separator:#849ab3;}

.graph-rail-integrated .graph-chapter-banner{
 border-top:1px solid var(--graph-chapter-separator);
 border-bottom:1px solid var(--graph-chapter-separator);
}
html[data-theme="dark"] .graph-rail-integrated .graph-chapter-banner{
 border-top-color:var(--graph-chapter-separator);
 border-bottom-color:var(--graph-chapter-separator);
}





/* Przyciski są symetrycznie POZA granicami rozdziału, w przerwach. */

/* spójny nagłówek rozdziału w grafie i poprawione nazwy paneli.
   Zasada: nagłówek rozdziału jest jeden i rozciąga się przez 01 + szynę + 02 + 03.
   Szyna nie rysuje własnej belki ani poziomych granic; pokazuje tylko przyciski i zaznaczenie. */
.graph-project .chapter-left, .graph-project .chapter-right{position:relative;z-index:1;}
.graph-chapter-overlays{z-index:8;}
.graph-chapter-banner{position:absolute;left:0;right:0;height:37px;display:grid;grid-template-columns:var(--left) var(--graph-rail-width,0px) minmax(0,1fr) var(--right);align-items:stretch;box-sizing:border-box;background:#26384d;color:#e6edf7;border-top:2px solid #4b6582;border-bottom:1px solid #4b6079;user-select:none;pointer-events:none;}
.graph-chapter-banner-left, .graph-chapter-banner-rail, .graph-chapter-banner-center, .graph-chapter-banner-right{min-width:0;display:flex;align-items:center;box-sizing:border-box;}
.graph-chapter-banner-left{padding:4px 10px;border-right:1px solid #42546c;}
.graph-chapter-banner-rail{display:flex;justify-content:center;background:transparent;border-left:1px solid #42546c;border-right:1px solid #58718e;}
.graph-chapter-banner-center{padding:4px 10px;gap:9px;}
.graph-chapter-banner-right{border-left:3px solid #42546c;}
.graph-chapter-banner-name{pointer-events:auto;}
html[data-theme="light"] .graph-chapter-banner{background:#dfe8f3;color:#26384b;border-top-color:#879eb7;border-bottom-color:#aebdd0;}
html[data-theme="light"] .graph-chapter-banner-left{border-right-color:#a9b8ca;}
html[data-theme="light"] .graph-chapter-banner-rail{border-left-color:#b4c3d6;border-right-color:#8da1b9;}
html[data-theme="light"] .graph-chapter-banner-right{border-left-color:#8da1b9;}

.upper-shell.graph-rail-integrated .graph-rail-head, .upper-shell.graph-rail-integrated .graph-rail-scroll-spare, .upper-shell.graph-rail-integrated .graph-chapter-rail{position:relative;background:transparent;border:0!important;overflow:visible;}






.upper-shell.graph-rail-integrated .graph-chapter-banner-rail{display:flex;}
.upper-shell.graph-rail-integrated .graph-chapter-banner-left{border-right:1px solid #42546c;}
.upper-shell.graph-rail-integrated .graph-chapter-banner-center{padding-left:10px;}



.upper-shell.graph-rail-integrated .graph-rail-selection{width:auto;border:0;border-right:2px solid #8ac0ee;border-radius:0;background:linear-gradient(90deg,transparent,rgba(95,161,216,.21));box-shadow:none;}
.upper-shell.graph-rail-integrated .graph-rail-selection button{position:sticky;left:auto;top:45px;bottom:45px;transform:none;background:transparent;border:0;box-shadow:none;border-radius:50%;color:#a7c9e9;}
.upper-shell.graph-rail-integrated .graph-rail-boundary-add{color:#a7c9e9;opacity:1;pointer-events:auto;}
.upper-shell.graph-rail-integrated .graph-rail-selection button svg, .upper-shell.graph-rail-integrated .graph-rail-boundary-add svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.15px;stroke-linecap:round;pointer-events:none;}
.upper-shell.graph-rail-integrated .graph-rail-selection button:hover, .upper-shell.graph-rail-integrated .graph-rail-selection button:focus-visible, .upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover, .upper-shell.graph-rail-integrated .graph-rail-boundary-add:focus-visible{background:#375775;color:#fff;outline:2px solid #8bbbee66;outline-offset:1px;}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add{color:#4579a9;}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button:hover, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover{background:#d9eafa;color:#215681;}

 content:"";

  linear-gradient(var(--graph-frame-inner),var(--graph-frame-inner)),
