  overflow:auto;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc{
  background:#f6f8fb;
  border:1px solid transparent;
}


/* czytelny podgląd fizycznego miejsca wstawienia rozdziału. */
.graph-project .graph-chapter-preview.is-empty{
  display:block;
  min-height:82px;
  border:1px solid #8bbce6;
  background:rgba(75,140,195,.13);
  box-shadow:0 0 0 1px rgba(75,140,195,.13);
}
.graph-project .graph-chapter-preview-row{
  display:grid;grid-template-columns:var(--left) var(--graph-rail-width) minmax(0,1fr) var(--right);
  height:37px;box-sizing:border-box;align-items:stretch;
  background:rgba(60,113,160,.45);
  border-bottom:1px solid #8bbce6;
}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty{background:rgba(89,157,205,.11);}
html[data-theme="light"] .graph-project .graph-chapter-preview-row{background:rgba(89,157,205,.27);}
.graph-project .graph-chapter-preview-shift{
  transform:translateY(110px)!important;
  transition:transform .16s ease-out!important;
}
.graph-project.graph-chapter-preview-insert .graph-wires{opacity:.13;transition:opacity .15s;}
@media(prefers-reduced-motion:reduce){.graph-project .graph-chapter-preview-shift{transition:none!important}}


/* przyciski przewijania są zawsze widoczne, a sam pasek
   ma dokładnie 15 px i używa tych samych kolorów co pionowy scrollbar 02. */
.h-rail-wrap .h-rail-arrow{
 position:absolute;top:0;z-index:2;display:grid;place-items:center;
 width:15px;height:15px;padding:0;margin:0;border:0;border-radius:0;
 background:#edf2f7;color:#7994b0;cursor:pointer;
}
.h-rail-arrow[data-h-rail-step="-1"]{left:0;}
.h-rail-arrow[data-h-rail-step="1"]{right:0;}
.h-rail-arrow svg{display:block;width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.h-rail-wrap .h-rail-arrow:hover:not(:disabled){background:#cfdeee;color:#4c6582;}
.h-rail-wrap .h-rail-arrow:disabled{color:#a9b8c9;cursor:default;}
.h-rail-wrap .h-rail-arrow:focus-visible{outline:1px solid #6ba4dd;outline-offset:-2px;}
html[data-theme="dark"] .h-rail-wrap .h-rail-arrow{background:#1b2a3b;color:#9aadc1;}
html[data-theme="dark"] .h-rail-wrap .h-rail-arrow:hover:not(:disabled){background:#314963;color:#e5eff9;}
html[data-theme="dark"] .h-rail-wrap .h-rail-arrow:disabled{color:#465c73;}

:root{--dm-graph-rail-width:var(--dm-rail-width);
 /* widoczny fokus dla klawiatury, bez zmian interakcji myszą. */
 --dm-focus-outline:#9cd1ff;--dm-focus-border:#162b4d;--dm-focus-editor:#9cd1ff;--dm-focus-app:#9ad6ff;}
html[data-theme="light"]{--dm-focus-outline:#1b65ac;--dm-focus-border:#fff;--dm-focus-app:#185da2;}
:where(button,[role="button"],[tabindex],input,textarea,.tile):focus-visible{outline:2px solid var(--dm-focus-outline)!important;outline-offset:2px!important;box-shadow:0 0 0 1px var(--dm-focus-border)!important;}
:where(.edit-input,[contenteditable="true"]):focus-visible{outline:2px solid var(--dm-focus-editor)!important;outline-offset:1px!important;}

/* Wstępne miejsce dla nowego pustego rozdziału ma tę samą grubość,
   co zwykła przerwa między kafelkami. */
.graph-project .graph-chapter-preview.is-empty.is-compact{
 display:flex;align-items:center;box-sizing:border-box;
 min-height:0;height:var(--chapter-insert-gap);
 border-left:0;border-right:0;
 box-shadow:none;
}
.graph-project .graph-chapter-preview.is-empty.is-compact .graph-chapter-preview-compact-label{
 display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
 margin-left:calc(var(--left) + var(--graph-rail-width) + 8px);
 margin-right:6px;font-size:10px;font-weight:600;line-height:1.1;color:#d1e9ff;
}
/* Przyleganie do rozdziału bez drugiej, nakładającej się linii. */
.graph-project .graph-chapter-preview.is-empty.is-compact.is-attached-after{border-top:0;}
.graph-project .graph-chapter-preview.is-empty.is-compact.is-attached-before{border-bottom:0;}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty.is-compact{
 border-color:#5d9cc8;
}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty.is-compact .graph-chapter-preview-compact-label{color:#315b7f;}

/* Lekki podgląd bez trzeciej, przerywanej granicy nad istniejącymi liniami. */
.graph-project .graph-chapter-preview.is-empty.is-compact{
 border:0;
 background:rgba(75,140,195,.11);
}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty.is-compact{
 background:rgba(89,157,205,.10);
}


/* podgląd pustego rozdziału: jednorodna płaszczyzna bez kreski
   przebijającej spodem ani obramowania (oba motywy). */
.graph-mode-active .graph-project .graph-chapter-preview.is-empty.is-compact{
 border:0!important;box-shadow:none!important;
 background:#253b52!important;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-preview.is-empty.is-compact{
 background:#dbeaf5!important;
}
/* Kosz jest w wierszu numeru rozdziału, ponad tytułem.
   Tytuł otrzymuje pełną szerokość kolumny OPIS. */
.graph-chapter-inspector-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px;margin-bottom:3px;}
.graph-mode-active .graph-project .graph-chapter-inspector-heading .graph-chapter-inspector-eyebrow{margin-bottom:0;}
.graph-chapter-delete{
 width:22px;height:22px;min-width:22px;flex:none;display:grid;place-items:center;
 background:transparent;border:1px solid transparent;border-radius:5px;
 color:#9cadbe;padding:3px;cursor:pointer;
}
.graph-chapter-delete svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;}
.graph-chapter-delete:hover{background:#ad4b4b26;color:#ffb2b2;border-color:#d57b7b55;}
html[data-theme="light"] .graph-chapter-delete{color:#647e99;}
html[data-theme="light"] .graph-chapter-delete:hover{background:#fbe2e2;color:#a93645;border-color:#df9b9b;}

/* minimalistyczne znaczniki rozdziałów i pojedynczy inspektor.
   Dane/relacje nie zmieniają się; widoczny opis zależy od wyboru użytkownika. */
.graph-mode-active .graph-project .graph-chapter-banner{
 height:31px;display:block;left:0;right:0;background:transparent!important;
 pointer-events:none!important;box-shadow:none!important;border:0!important;
 z-index:10;
}
/* numer i nazwa to zwykła typografia, bez wyglądu przycisku. */
.graph-mode-active .graph-project .graph-chapter-banner-chip{
 position:absolute;top:6px;
 left:calc(var(--left) + var(--graph-rail-width,0px) + 11px);
 min-height:21px;max-width:min(420px,calc(100% - var(--left) - var(--graph-rail-width,0px) - var(--right) - 24px));
 display:inline-flex;gap:6px;align-items:center;padding:0;
 box-sizing:border-box;border:0;border-radius:0;
 background:transparent;color:#a4b7ca;box-shadow:none;
 pointer-events:auto;cursor:pointer;font-size:10px;font-weight:650;letter-spacing:.65px;line-height:18px;text-transform:uppercase;
}
.graph-mode-active .graph-project .graph-chapter-banner-chip:hover{
 background:transparent;border-color:transparent;color:#dce9f6;
}
.graph-mode-active .graph-project .graph-chapter-banner-chip.is-active{
 background:transparent;border-color:transparent;color:#e6edf7;font-weight:700;
}
.graph-mode-active .graph-project .graph-chapter-banner-index{
 display:inline;flex:none;min-width:0;height:auto;
 padding:0;border:0;border-radius:0;background:transparent;
 color:inherit;font-size:10px;font-weight:650;letter-spacing:inherit;
}
.graph-mode-active .graph-project .graph-chapter-banner-chip.is-active .graph-chapter-banner-index{color:inherit;}
.graph-mode-active .graph-project .graph-chapter-banner-name{
 display:inline-block;min-width:0;max-width:100%;padding:0;
 font-size:inherit;font-weight:inherit;line-height:18px;letter-spacing:inherit;
 color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.graph-mode-active .graph-project .graph-chapter-banner-name[contenteditable="true"]{
 min-width:95px;cursor:text;user-select:text;outline:1px solid #9bd2ff!important;
}
.graph-mode-active .graph-project .graph-chapter-banner-chip:focus-visible{
 outline:2px solid #9bd2ff!important;outline-offset:2px!important;
}
/* Poziome granice rozdziałów widoczne WYŁĄCZNIE na bocznej
   szynie z +, bez kresek na planszy i panelach. Geometria (top) i obsługa
   wstawiania rozdziałów pozostają bez zmian. */
.graph-mode-active .graph-project .graph-chapter-geometry-line{
 left:var(--left);right:auto;width:var(--graph-rail-width,18px);
 height:1px;background:rgba(119,151,184,.75);box-shadow:none;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-chip{
 background:transparent;color:#566c85;border-color:transparent;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-chip:hover{
 background:transparent;color:#334f6a;border-color:transparent;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-chip.is-active{
 background:transparent;color:#304f6e;border-color:transparent;font-weight:700;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-index{color:inherit;}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-chip.is-active .graph-chapter-banner-index{color:inherit;}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-geometry-line{background:rgba(101,133,166,.67);}
.graph-mode-active .graph-project >.chapter-left,
.graph-mode-active .graph-project >.chapter-right{align-content:start;min-height:0;padding:10px 9px;}
.graph-mode-active .graph-project .graph-chapter-inspector{
 position:sticky;top:9px;width:100%;min-width:0;align-self:flex-start;
 max-height:calc(100dvh - 320px);overflow-y:auto;overflow-x:hidden;
 scrollbar-width:thin;box-sizing:border-box;
}
.graph-mode-active .graph-project .graph-chapter-inspector-eyebrow{
 text-transform:uppercase;letter-spacing:.6px;font-size:9px;font-weight:650;
 color:#92afce;margin-bottom:4px;
}
.graph-mode-active .graph-project .graph-chapter-inspector-title{
 font-weight:700;font-size:12px;line-height:1.4;color:#edf4ff;
 overflow-wrap:anywhere;margin-bottom:11px;
}
.graph-mode-active .graph-project .graph-chapter-inspector-field{
 display:block;color:#9eb5ce;font-size:10px;margin-bottom:5px;
}
.graph-mode-active .graph-project .graph-chapter-inspector .chapter-desc{
 display:block;min-height:132px;height:clamp(132px,26vh,330px);width:100%;
 padding:9px;resize:vertical;overflow:auto;border:1px solid #3d5065;border-radius:6px;
 background:#202d3d;color:#e1ebf6;line-height:1.45;font-size:12px;
}
.graph-mode-active .graph-project .graph-chapter-inspector .chapter-desc:focus-visible{outline:2px solid #8bc2f4!important;}
.graph-mode-active .graph-project .graph-chapter-inspector-count{
 font-size:10px;color:#aac0d7;margin:-4px 0 10px;
}
.graph-mode-active .graph-project .graph-chapter-inspector .stat{display:flex;min-width:0;}
.graph-mode-active .graph-project .graph-chapter-inspector .stat>span{min-width:0;overflow-wrap:anywhere;}
.graph-mode-active .graph-project .graph-chapter-inspector-empty{font-size:11px;color:#95a9bf;line-height:1.4;}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector-eyebrow,
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector-field{color:#607993;}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector-title{color:#243b56;}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector-count{color:#69819b;}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector .chapter-desc{
 background:#f4f7fb;color:#283d56;border-color:#c7d5e3;
}
.upper-shell.left-collapsed .graph-chapter-inspector-left,
.upper-shell.right-collapsed .graph-chapter-inspector-right{display:none!important;}

/* prowadnice pozostają na planszy, ale nie wystają obok nagłówków wątków. */
.graph-mode-active .head-shift .thread-guides{display:none;}
/* Panel OPIS: tekst wykorzystuje całą przestrzeń pomiędzy tytułem i dołem planszy.
   Jego wysokość jest aktualizowana na podstawie faktycznej wysokości .upper-scroll. */
.graph-mode-active .graph-project .graph-chapter-inspector-left{
 display:flex;flex-direction:column;
 height:var(--graph-inspector-height,300px);max-height:none;
 overflow:hidden;
}
.graph-mode-active .graph-project .graph-chapter-inspector-left > .graph-chapter-inspector-heading,
.graph-mode-active .graph-project .graph-chapter-inspector-left > .graph-chapter-inspector-title{
 flex:none;
}
.graph-mode-active .graph-project .graph-chapter-inspector-left .chapter-desc{
 flex:1 1 auto;min-height:0;height:auto;
 resize:none;overflow-y:auto;overflow-x:hidden;
 scrollbar-gutter:stable;
}

/* edycja nazwy rozdziału w panelu OPIS, wygląd nadal tekstowy. */
.graph-mode-active .graph-project .graph-chapter-inspector-title[data-graph-chapter-inspector-name]{cursor:text;}
.graph-mode-active .graph-project .graph-chapter-inspector-title[data-graph-chapter-inspector-name]:focus-visible{
 outline:1px solid #9bcdf5!important;outline-offset:2px;
}
.graph-mode-active .graph-project .graph-chapter-inspector-name-input{
 display:block;width:100%;min-width:0;box-sizing:border-box;
 margin:0;padding:0;color:inherit;background:transparent;
 font:inherit;font-size:inherit;font-weight:inherit;line-height:inherit;
 border:0;border-bottom:1px solid #9bcdf5;border-radius:0;
 box-shadow:none;outline:none!important;
}
.graph-mode-active .graph-project .graph-chapter-inspector-name-input:focus{
 box-shadow:0 1px 0 #9bcdf5!important;
}

/* schowaj sam symbol + przy najechaniu na obszar jego położenia.
   Przycisk pozostaje w DOM i zachowuje rozmiar, więc nadal można kliknąć. */
.upper-shell.graph-rail-integrated .graph-rail-selection{pointer-events:auto;}
.upper-shell.graph-rail-integrated .graph-rail-selection:hover button:not(:focus-visible) svg,
.upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover:not(:focus-visible) svg{
 opacity:0;
}
/* Dla obsługi klawiaturą zachowaj czytelny plus przy widocznym fokusie. */
.upper-shell.graph-rail-integrated .graph-rail-selection button:focus-visible svg,
.upper-shell.graph-rail-integrated .graph-rail-boundary-add:focus-visible svg{opacity:1;}
/* Najechanie nie tworzy dodatkowego tła ani obwódki przycisku. */
.upper-shell.graph-rail-integrated .graph-rail-selection button:hover:not(:focus-visible),
.upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover:not(:focus-visible){
 background:transparent;border-color:transparent;box-shadow:none;outline:none;
}

/* siatka korzysta z osobnej, nieruchomej szyny 18 px.
   Graf pozostaje nietknięty. Nie rysujemy linii osobno w każdym wierszu. */
.upper-shell.grid-rail-integrated{
 --grid-rail-width:var(--dm-graph-rail-width,18px);
 --grid-rail-edge:#58718e;
 --grid-rail-inner:#42546c;
 position:relative;
}
html[data-theme="light"] .upper-shell.grid-rail-integrated{
 --grid-rail-edge:#8da1b9;--grid-rail-inner:#b4c3d6;
}
.upper-shell.grid-rail-integrated .upper-head,
.upper-shell.grid-rail-integrated .h-rail-grid,
.upper-shell.grid-rail-integrated .chapter{
 grid-template-columns:var(--left) var(--grid-rail-width) minmax(0,1fr) var(--right);
}
.upper-shell.grid-rail-integrated .chapter>.chapter-left{grid-column:1;grid-row:2;border-right:0;}
.upper-shell.grid-rail-integrated .chapter>.grid-chapter-rail{grid-column:2;grid-row:2;}
.upper-shell.grid-rail-integrated .chapter>.chapter-middle{grid-column:3;grid-row:2;}
.upper-shell.grid-rail-integrated .chapter>.chapter-right{grid-column:4;grid-row:2;border-left:0;}
.upper-shell.grid-rail-integrated .chapter{position:relative;}
.upper-shell.grid-rail-integrated .chapter-bar{grid-column:1/-1;grid-row:1;}
.upper-shell.grid-rail-integrated .chapter-bar .chapter-seg.left{border-right:0;}
.upper-shell.grid-rail-integrated .chapter-bar .chapter-seg.right{border-left:0;}
.upper-shell.grid-rail-integrated .chapter-bar .chapter-seg.middle{padding-left:calc(var(--grid-rail-width) + 10px);}
.upper-shell.grid-rail-integrated .panel-cap.left,
.upper-shell.grid-rail-integrated .h-rail-grid>.spare:first-child{border-right:0;}
.upper-shell.grid-rail-integrated .panel-cap.right,
.upper-shell.grid-rail-integrated .h-rail-grid>.spare:last-child{border-left:0;}
.grid-rail-head,.grid-rail-scroll-spare{display:none;}
.upper-shell.grid-rail-integrated .grid-rail-head,
.upper-shell.grid-rail-integrated .grid-rail-scroll-spare{display:block;min-width:0;background:transparent;}
.upper-shell.grid-rail-integrated .grid-rail-head{background:transparent;}
.upper-shell.grid-rail-integrated .grid-rail-scroll-spare{background:transparent;}
.upper-shell.grid-rail-integrated::before{
 content:"";position:absolute;inset:0;z-index:28;pointer-events:none;
 background-image:
  linear-gradient(var(--grid-rail-inner),var(--grid-rail-inner)),
  linear-gradient(var(--grid-rail-edge),var(--grid-rail-edge)),
  linear-gradient(var(--grid-rail-edge),var(--grid-rail-edge));
 background-repeat:no-repeat;
 background-size:1px 100%,2px 100%,2px 100%;
 background-position:
  calc(var(--left) - 1px) 0,
  calc(var(--left) + var(--grid-rail-width) - 2px) 0,
  calc(100% - var(--right) - var(--scrollbar-space,0px)) 0;
}
/* W grafie uchwyt panelu działa na zewnętrznej krawędzi szyny; w siatce tak samo. */
.upper-shell.grid-rail-integrated .panel-resizer-left{left:calc(var(--left) + var(--grid-rail-width));}
.grid-chapter-rail{position:relative;align-self:stretch;min-height:100%;background:transparent;z-index:7;pointer-events:none;}
.upper-shell.grid-rail-integrated .chapter.is-collapsed>.grid-chapter-rail{display:none;}
.grid-rail-add{
 position:absolute;left:0;width:var(--dm-graph-rail-width,18px);height:var(--chapter-insert-gap,18px);
 padding:0;margin:0;appearance:none;box-sizing:border-box;
 display:grid;place-items:center;cursor:pointer;pointer-events:auto;
 border:0;border-radius:0;box-shadow:none;background:transparent;color:#a7c9e9;
 touch-action:manipulation;
}
.grid-rail-add svg{display:block;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.15px;stroke-linecap:round;pointer-events:none;}
.grid-rail-add:hover svg{opacity:0;}
.grid-rail-add:focus-visible{outline:2px solid #8bbbee!important;outline-offset:-2px;z-index:2;}
.grid-rail-add:focus-visible svg{opacity:1;}
html[data-theme="light"] .grid-rail-add{color:#4579a9;}
/* podgląd cięcia jest płaszczyzną całego rozdziału, podobnie
   jak podgląd w GRAFIE. Nie zaczyna się za szyną; sięga także na OPIS. */
.grid-rail-preview{
 display:none;position:absolute;left:0;right:0;
 height:var(--chapter-insert-gap,18px);background:rgba(138,148,161,.15);
 pointer-events:none;z-index:6;border:0;box-shadow:none;
}
html[data-theme="light"] .grid-rail-preview{background:rgba(141,150,160,.12);}
.grid-rail-preview.is-visible{display:block;}
/* Właścicielem szyny jest osobna kolumna. Dawne pseudo-paski i przyciski w rzędach są wyłączone. */
.upper-shell.grid-rail-integrated .gaprow .grid-rail-placeholder,
.upper-shell.grid-rail-integrated .moment .grid-rail-placeholder{width:0;min-width:0;height:100%;border:0;background:transparent;pointer-events:none;}


/* typ projektu jest jawny; ikona w pasku otwiera DRUGI niezależny projekt. */
@media(max-width:1080px){
 .toolbar{grid-template-columns:max-content minmax(0,1fr) max-content}
 .toolbar > .project-name{width:100%;max-width:100%;min-width:0}
}



/* przesuwalny minigraf, bez listy, nagłówka i opisów. */
.graph-navigator{
 position:absolute;left:16px;top:72px;box-sizing:border-box;
 max-width:calc(100% - 24px);max-height:min(62vh,580px);
 display:block;z-index:14;overflow:hidden;
 border:1px solid #738da9;
 background:rgba(22,36,56,.98);box-shadow:0 15px 36px #0006;
 cursor:grab;touch-action:none;user-select:none
;}
.graph-navigator[hidden]{display:none!important;}
.graph-navigator.is-dragging{cursor:grabbing;box-shadow:0 26px 60px #000a;}
.graph-nav-close{position:absolute;z-index:3;right:4px;top:4px;
 display:grid;place-items:center;padding:0;
 color:#bbd0e5;font:400 20px/1 Arial,sans-serif;
 background:rgba(39,57,79,.94);border:1px solid #57718c;
 cursor:pointer;}
.graph-nav-close:hover,.graph-nav-close:focus-visible{color:white;background:#4d6d90;outline:1px solid #afd5f5;}

.graph-nav-diagram{position:relative;margin-inline:auto;}
.graph-nav-lines{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}
.graph-nav-line{fill:none;stroke:#829bb7;stroke-linejoin:round;}
.graph-nav-line.local{stroke:#8198af;stroke-dasharray:3 2;}
.graph-nav-line.equal{stroke:#c7a0e7;}
.graph-nav-mini-node{position:absolute;box-sizing:border-box;
 appearance:none;padding:0;overflow:hidden;
 
 
 cursor:pointer;touch-action:manipulation;}
.graph-nav-mini-node::before{position:absolute;top:6px;left:7px;right:10px;height:2px;
 background:rgba(233,239,248,.55);box-shadow:0 5px 0 rgba(233,239,248,.27);pointer-events:none;}
.graph-nav-mini-node:hover,.graph-nav-mini-node:focus-visible{filter:brightness(1.28);outline:2px solid #c0d9f4;outline-offset:2px;}
.graph-nav-mini-node.is-primary{border-color:#d7e5f4;}

html[data-theme="light"] .graph-navigator{background:rgba(245,249,253,.98);border-color:#99abc2;box-shadow:0 14px 32px #25384a38;}
html[data-theme="light"] .graph-nav-close{background:#e5edf7;color:#47627e;border-color:#a5b8ce;}
html[data-theme="light"] .graph-nav-close:hover,html[data-theme="light"] .graph-nav-close:focus-visible{background:#d2e4f6;color:#193d63;}
html[data-theme="light"] .graph-nav-mini-node{border-color:#6e819a;}
html[data-theme="light"] .graph-nav-mini-node::before{background:rgba(34,53,74,.48);box-shadow:0 5px 0 rgba(34,53,74,.25);}

html[data-theme="light"] .graph-nav-mini-node.is-viewed:not(.is-primary){outline-color:#477cae;}
html[data-theme="light"] .graph-nav-line{stroke:#7088a3;}
html[data-theme="light"] .graph-nav-line.local{stroke:#7189a1;}
html[data-theme="light"] .graph-nav-line.equal{stroke:#9270c7;}
@media(max-width:520px){.graph-navigator{max-width:calc(100vw - 16px)}}

/* minimalny minigraf otwierany wyłącznie przyciskiem. */
.graph-navigator{width:max(112px,min(226px,calc(100vw - 28px)));padding:5px 5px 4px;border-radius:8px;}
.graph-nav-canvas{max-height:none;height:100%;width:100%;display:flex;align-items:center;justify-content:center;overflow:auto;scrollbar-width:thin;scrollbar-color:#637c98 transparent;overscroll-behavior:contain;}
.graph-nav-diagram{width:var(--dm-mini-graph-min-width);min-width:var(--dm-mini-graph-min-width);margin:auto;transform-origin:top left;}
.graph-nav-mini-node{width:var(--dm-mini-node-width);height:var(--dm-mini-node-height);border-radius:2px;background:#536275;border:1px solid #9db1c8;box-shadow:none;transition:background .12s,border-color .12s;}
.graph-nav-mini-node::before{display:none!important;content:none!important;}
.graph-nav-mini-node.is-primary{background:#7a90a8;border:1px solid #d3e7f9;outline:1px solid #d3e7f9;outline-offset:1px;}
.graph-nav-mini-node.is-viewed:not(.is-primary){outline:1px dashed #bbd8f1;outline-offset:1px;}
@keyframes graphNavTargetFlash{0%{box-shadow:0 0 0 0 rgba(191,220,247,.0);outline-color:transparent}20%{box-shadow:0 0 0 6px rgba(191,220,247,.18);outline-color:#d7ebfb}55%{box-shadow:0 0 0 12px rgba(191,220,247,.0);outline-color:#f0c9a6}100%{box-shadow:0 0 0 0 rgba(191,220,247,.0);outline-color:transparent}}
.graph-node.graph-nav-target-flash .graph-card,.graph-card.graph-nav-target-flash{animation:graphNavTargetFlash 1.2s ease-out 1;}
.graph-nav-line{stroke-width:1.1;opacity:.83;}
.graph-nav-line.equal{stroke-width:1.4;}
.graph-nav-empty-diagram{height:var(--dm-mini-graph-min-height);}
.graph-nav-placeholder{position:absolute;left:93px;top:45px;width:var(--dm-mini-node-width);height:var(--dm-mini-node-height);border:1px solid #8298ae;border-radius:2px;background:#475a6e;}
html[data-theme="light"] .graph-nav-mini-node{background:#bdcbd9;border:1px solid #8198ae;}
html[data-theme="light"] .graph-nav-mini-node.is-primary{background:#a0bad2;border-color:#477ba9;outline-color:#477ba9;}
.graph-nav-close{width:19px;height:19px;border-radius:4px;font-size:18px;}

/* minimapa jest samodzielnym oknem w warstwie nad całym interfejsem.
   Nakładka zostaje przeniesiona poza .upper-shell, aby poziome i pionowe linie
   planszy oraz pseudo-elementy rozdziałów nie mogły być rysowane nad nią. */
#plot-app > .graph-navigator{
 position:fixed;z-index:200000;left:50%;top:50%;right:auto;bottom:auto;
 transform:translate(-50%,-50%);display:flex;isolation:isolate;
 width:190px;height:108px;min-width:138px;min-height:82px;
 max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);
 box-sizing:border-box;border:1px solid #829bb5;border-radius:8px;
 background:#162438;box-shadow:0 20px 55px rgba(0,0,0,.75);
 opacity:1;backdrop-filter:none;overflow:hidden;resize:none;
 pointer-events:auto;touch-action:none;
}
html[data-theme="light"] #plot-app > .graph-navigator{
 background:#f0f5fa;border-color:#8299b1;
 box-shadow:0 20px 55px rgba(21,39,60,.44);
}
#plot-app > .graph-navigator[hidden]{display:none!important;}


/* rzeczywisty cel skoku minimapy pozostaje wskazany NA głównej planszy,
   niezależnie od zaznaczenia źródłowego wydarzenia minigrafu. */
.graph-board .graph-node.graph-nav-arrival{z-index:19!important;}
.graph-board .graph-node.graph-nav-arrival > .tile{
 outline:3px solid #f8df8b!important;outline-offset:5px!important;
 box-shadow:0 0 0 9px rgba(251,208,109,.19),0 0 26px rgba(255,218,121,.68)!important;
}
.graph-board .graph-node.graph-nav-arrival::before{
 content:"CEL NAWIGACJI";position:absolute;left:50%;bottom:calc(100% + 12px);
 transform:translateX(-50%);display:block;white-space:nowrap;pointer-events:none;
 background:#f7d990;color:#263043;font:800 10px/1.2 system-ui,sans-serif;
 letter-spacing:.07em;padding:5px 8px;border:1px solid #fff3c9;
 border-radius:5px;box-shadow:0 2px 11px #0008;z-index:22;
}
@keyframes graphNavArrivePulse{
 0%{box-shadow:0 0 0 2px rgba(251,208,109,.65),0 0 0 16px rgba(251,208,109,.30)}
 45%{box-shadow:0 0 0 8px rgba(251,208,109,.30),0 0 0 30px rgba(251,208,109,.03)}
 100%{box-shadow:0 0 0 9px rgba(251,208,109,.19),0 0 26px rgba(255,218,121,.68)}
}
.graph-board .graph-node.graph-nav-arrival.is-graph-nav-arriving > .tile{
 animation:graphNavArrivePulse 1.15s ease-out 1!important;
}
html[data-theme="light"] .graph-board .graph-node.graph-nav-arrival > .tile{
 outline-color:#b26d09!important;box-shadow:0 0 0 9px rgba(210,135,26,.15),0 0 22px rgba(210,135,26,.44)!important;
}
@media(prefers-reduced-motion:reduce){
 .graph-board .graph-node.graph-nav-arrival.is-graph-nav-arriving > .tile{animation:none!important}
}

/* pełna SIATKA: między wątkami dokładnie 24 px, jak w GRAFIE.
   Jeden odstęp dla nagłówków, pól, przerw, pustych wątków i prowadnic.
   Widok kompaktowy i jego własna geometria pozostają bez zmian. */
.app:not(.graph-mode-active) .head-shift .track-strip{gap:var(--dm-track-gap);}
.app:not(.graph-mode-active) .chapter-middle .board-shift:not(.compact-board) > .moment,
.app:not(.graph-mode-active) .chapter-middle .board-shift:not(.compact-board) > .gaprow{gap:var(--dm-track-gap);}

/* prowadnice pełnej SIATKI jak w GRAFIE.
   Poprzednio poziomy odstęp był poprawny, ale pionowe kreski stawały
   2px od krawędzi następnego wątku zamiast w połowie 24-pikselowej przerwy. */
.app:not(.graph-mode-active) .chapter-middle .board-shift:not(.compact-board) .thread-guide{
 background:repeating-linear-gradient(to bottom,var(--dm-guide-color) 0 1px,transparent 1px var(--graph-node-gap));
}
/* Tak jak GRAF: nad nagłówkami wątków nie pokazujemy pionowych prowadnic. */
.app:not(.graph-mode-active) .head-shift .thread-guides{display:none;}

/* minisiatka: lokalny wycinek chronologii, bez linii relacji. */
#plot-app > .graph-navigator.grid-navigator .graph-nav-lines{display:none!important;}
#plot-app > .graph-navigator.grid-navigator .graph-nav-mini-node{border-radius:2px;}
#plot-app > .graph-navigator.grid-navigator .graph-nav-mini-node.is-primary{outline:1px solid #f0d6aa;outline-offset:1px;border-color:#f0d6aa;}
#plot-app > .graph-navigator.grid-navigator .graph-nav-mini-node.is-viewed:not(.is-primary){outline:1px dashed #c0dafa;outline-offset:1px;}
.tile.grid-nav-arrival{outline:2px solid #f6d69c!important;outline-offset:2px;box-shadow:0 0 0 4px rgba(240,190,114,.16),0 2px 9px #0004!important;}
@keyframes gridMiniArrival{0%{box-shadow:0 0 0 0 rgba(253,203,123,.5)}65%{box-shadow:0 0 0 12px rgba(253,203,123,0)}100%{box-shadow:0 0 0 4px rgba(240,190,114,.16)}}
.tile.grid-nav-arrival.is-grid-nav-arriving{animation:gridMiniArrival 1.1s ease-out 1;}

/* kolor tła każdego pasa rozdziału musi dochodzić do obu
   krawędzi widocznego obszaru GRAFU, także po przewinięciu poza wątki.
   Pas nadal jest przypisany do swojego rozdziału; dodatkowa szerokość
   to wyłącznie tło, nie fikcyjne kolumny ani nowe miejsca upuszczania. */
.graph-mode-active .graph-board .graph-chapter-layers > .graph-chapter-band{
 left:-100vw;
 right:-100vw;
}

/* wyszukiwarka notatek i encyklopedii jest zawsze widocznym paskiem. */
.notes-widget .notes-searchbar{display:flex;flex-wrap:nowrap;min-height:48px;align-items:center;gap:5px;padding:7px 10px;}
.notes-widget .notes-search-input{flex:1 1 auto;flex-basis:auto;min-width:75px;}
.notes-widget .notes-search-count{font-variant-numeric:tabular-nums;}
.notes-widget .notes-search-nav{width:28px;min-width:28px;height:28px;min-height:28px;flex:0 0 28px;}
@media(max-width:600px){.notes-widget .notes-searchbar{flex-wrap:nowrap}.notes-widget .notes-search-input{flex-basis:auto}}

/* naprawianie sprzeczności bez zapisywania niedozwolonego ruchu. */
.graph-conflict-overlay{position:fixed;inset:0;z-index:900000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,11,21,.46);backdrop-filter:blur(1px)}
.graph-conflict-dialog{width:min(510px,calc(100vw - 32px));max-height:calc(100dvh - 32px);display:flex;flex-direction:column;gap:12px;overflow:auto;background:#1d2e43;border:1px solid #da7583;border-radius:12px;padding:18px 20px;color:#eef4fc;box-shadow:0 20px 70px #030812b8;font-size:12px;line-height:1.5}
.graph-conflict-dialog h2{margin:0;color:#ffbdc6;font-size:16px;font-weight:800}
.graph-conflict-dialog p{margin:0}
.graph-conflict-target{border-left:3px solid #ed777d;background:rgba(208,76,87,.10);padding:8px 10px;color:#f7d3d9;border-radius:3px}
.graph-conflict-list{display:flex;flex-direction:column;gap:7px;max-height:37vh;overflow:auto;padding:2px}
.graph-conflict-choice{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid #567086;border-radius:6px;background:#273a50;cursor:pointer}
.graph-conflict-choice:hover{border-color:#e68b99;background:#33455c}
.graph-conflict-choice input{accent-color:#e57581;flex:none;width:16px;height:16px}
.graph-conflict-status{color:#f3c7ce;min-height:20px}
.graph-conflict-status.is-valid{color:#a3e1c2}
.graph-conflict-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.graph-conflict-actions button{min-height:34px;border-radius:7px;border:1px solid #7189a3;background:#30465e;color:#f1f7fd;padding:7px 12px;font-size:12px;font-weight:700}
.graph-conflict-actions .graph-conflict-confirm{background:#9e3946;border-color:#c36c78;color:#fff}
.graph-conflict-actions button:disabled{opacity:.40;cursor:not-allowed}
.graph-conflict-actions button:focus-visible,.graph-conflict-choice:focus-within{outline:2px solid #dba2ad;outline-offset:1px}
.app.graph-mode-active .graph-node.graph-conflict-node .tile{outline:3px solid #fa5468!important;outline-offset:3px!important;border-color:#f86679!important;box-shadow:0 0 0 6px rgba(234,68,93,.20)!important}
html[data-theme="light"] .graph-conflict-dialog{background:#f7f9fc;border-color:#ba5160;color:#253950;box-shadow:0 18px 65px #15283f66}
html[data-theme="light"] .graph-conflict-dialog h2{color:#a12c45}
html[data-theme="light"] .graph-conflict-target{color:#8d3040;background:#fdebf0}
html[data-theme="light"] .graph-conflict-choice{background:#eef2f8;color:#263b53;border-color:#b1bdcb}
html[data-theme="light"] .graph-conflict-choice:hover{background:#f8e9ed}
html[data-theme="light"] .graph-conflict-status{color:#ad3650}
html[data-theme="light"] .graph-conflict-status.is-valid{color:#2b7855}

/* podgląd kolejności rozdziałów w SIATCE. Linia wskazuje
   rzeczywiste miejsce wstawienia, nie miejsce puszczenia kursora. */
.app:not(.graph-mode-active) .chapter[data-chapter].chapter-reorder-before,
.app:not(.graph-mode-active) .chapter[data-chapter].chapter-reorder-after{position:relative}
.app:not(.graph-mode-active) .chapter[data-chapter].chapter-reorder-before::before,
.app:not(.graph-mode-active) .chapter[data-chapter].chapter-reorder-after::after{
 content:"";position:absolute;left:0;right:0;height:3px;pointer-events:none;
 z-index:56;background:#8fd1fb;box-shadow:0 0 0 1px rgba(18,49,81,.85),0 0 9px rgba(95,176,247,.38);
}
.app:not(.graph-mode-active) .chapter[data-chapter].chapter-reorder-before::before{top:0}
.app:not(.graph-mode-active) .chapter[data-chapter].chapter-reorder-after::after{bottom:0}
html[data-theme="light"] .app:not(.graph-mode-active) .chapter[data-chapter].chapter-reorder-before::before,
html[data-theme="light"] .app:not(.graph-mode-active) .chapter[data-chapter].chapter-reorder-after::after{background:#236ea6;box-shadow:0 0 0 1px #e8f1fb,0 0 8px #7daed2}
.app:not(.graph-mode-active) .chapter-bar[draggable="true"]{cursor:grab}
.app:not(.graph-mode-active) .chapter-bar[draggable="true"]:active{cursor:grabbing}
.app:not(.graph-mode-active) .chapter-bar [data-edit],
.app:not(.graph-mode-active) .chapter-bar input,
.app:not(.graph-mode-active) .chapter-bar button{cursor:pointer}


/* Natychmiastowy, własny drag SIATKI, niezależny od natywnego HTML5 drag.
   Dzięki temu kółko myszy działa podczas trzymania elementu. */
.dm-grid-drag-ghost{position:fixed;top:0;left:0;z-index:999998;pointer-events:none;
 max-width:230px;min-width:95px;padding:9px 12px;background:#31485f;color:#f3f8ff;
 border:1px solid #91b6db;border-radius:7px;box-shadow:0 12px 28px #0008;
 font:600 12px/1.35 system-ui,sans-serif;user-select:none;opacity:.92;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[data-theme="light"] .dm-grid-drag-ghost{background:#e1edf7;color:#203a54;border-color:#668eb5}
.app:not(.graph-mode-active) .chapter-bar[data-ch-drag]{cursor:grab}
.app:not(.graph-mode-active) .chapter-bar[data-ch-drag]:active{cursor:grabbing}


/* Gdy granica wysokiego rozdziału jest poza ekranem, podgląd trafia
   na widoczną krawędź i podaje faktyczne miejsce wstawienia. */
.dm-chapter-drop-guide{position:fixed;z-index:999990;pointer-events:none;height:3px;
 background:#8fd1fb;box-shadow:0 0 0 1px #173753,0 0 8px rgba(143,209,251,.45)}
.dm-chapter-drop-guide::after{content:attr(data-drop-label);position:absolute;right:18px;
 bottom:5px;white-space:nowrap;color:#e9f5ff;background:#2a4966;border:1px solid #759dc5;
 border-radius:5px;padding:4px 8px;font:700 10px/1.3 system-ui,sans-serif;letter-spacing:.2px}
html[data-theme="light"] .dm-chapter-drop-guide{background:#236ea6;box-shadow:0 0 0 1px white}
html[data-theme="light"] .dm-chapter-drop-guide::after{color:#29405b;background:#e2f0fc;border-color:#82add0}


/* lżejszy pasek główny: narzędzia planszy przy jej tytule. */
.center-head{overflow:visible;}
.center-head .head-clip{overflow:hidden;}
.center-cap .thread-filter-btn,.center-cap .view-mode-btn{width:25px;min-width:25px;height:25px;min-height:25px;padding:0;border:1px solid transparent;border-radius:5px;background:transparent;color:#9fb7d0;}
.center-cap .thread-filter-btn:hover,.center-cap .view-mode-btn:hover{background:#425c7740;border-color:#7893b260;}
.center-cap .view-mode-btn[aria-pressed="true"],.center-cap .thread-filter-btn[aria-pressed="true"]{background:#48698c;color:#f8fbff;border-color:#7297be;}
html[data-theme="light"] .center-cap .thread-filter-btn,html[data-theme="light"] .center-cap .view-mode-btn{color:#53728e;}
.center-cap .thread-filter-panel{top:calc(100% + 8px);right:0;z-index:150;}
.toolbar-menu-heading{padding:8px 12px 2px;font-size:10px;font-weight:700;letter-spacing:.8px;color:#647d98;}
html[data-theme="dark"] .toolbar-menu-heading{color:#a9bdd4;}
.toolbar-menu .qa-identifiers-menu-icon{display:grid;place-items:center;font:700 11px/1 "Segoe UI",Arial,sans-serif;border:1px solid currentColor;border-radius:3px;height:17px;}
.toolbar-menu .menu-theme-icon{display:grid;place-items:center;font-size:17px;line-height:17px;}
.toolbar-menu .menu-fullscreen-icon svg{width:17px;height:17px;display:block;}
.toolbar-menu-control{padding:6px 12px 8px;display:flex;flex-direction:column;gap:6px;}
.toolbar-menu-control-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;color:#516a85;}
.toolbar-menu-control-value{font-variant-numeric:tabular-nums;opacity:.82;}
.toolbar-menu-control input[type="range"]{width:100%;margin:0;accent-color:#5d86b4;cursor:pointer;}
html[data-theme="dark"] .toolbar-menu-control-label{color:#c5d4e5;}
/* Przycisk notatnika jest zawsze dostępny na prawej krawędzi. */
.notes-tab{z-index:2;}

/* czytelna różnica obszaru rozdziału i obszaru poza nim.
   Zamiast linii na planszy korzystamy wyłącznie z dwóch stałych kolorów tła.
   Oddzielna reguła is-drop-target zachowuje priorytet (background: !important). */
html[data-theme="dark"] .graph-mode-active .graph-project{
  --dm-graph-chapter-fill:#213349;
  --dm-graph-between-fill:#121d2c;
}
html[data-theme="light"] .graph-mode-active .graph-project{
  --dm-graph-chapter-fill:#e6eef8;
  --dm-graph-between-fill:#f9fbfe;
}
.graph-mode-active .graph-board .graph-chapter-layers > .graph-chapter-band:not(.graph-chapter-gap){
  background:var(--dm-graph-chapter-fill);
}
.graph-mode-active .graph-board .graph-chapter-layers > .graph-chapter-band.graph-chapter-gap{
  background:var(--dm-graph-between-fill);
}

/* widoczne zaznaczenie nie zmienia informacyjnej ramki 1 px.
   Osobny zewnętrzny pierścień jest wspólny dla SIATKI i GRAFU,
   także dla numerowanych wyborów podczas łączenia wydarzeń. */
:root{
 --dm-tile-selection-ring:#246a9c;
 --dm-tile-selection-glow:rgba(36,106,156,.24);
}
html[data-theme="dark"]{
 --dm-tile-selection-ring:#d7f2ff;
 --dm-tile-selection-glow:rgba(102,193,242,.27);
}
.app .tile.selected,
.app .graph-node:not(.graph-nav-arrival):not(.graph-conflict-node):is(.graph-choice-one,.graph-choice-two,.graph-choice-more) .tile{
 outline:3px solid var(--dm-tile-selection-ring)!important;
 outline-offset:2px;
 box-shadow:0 0 0 6px var(--dm-tile-selection-glow)!important;
}

/* Edytowany kafelek jest kotwicą kamery. Zapobiega podwójnej korekcie scrolla
   przez natywne CSS scroll anchoring oraz przez nasz własny mechanizm. */
.graph-mode-active .upper-scroll:has(.graph-node .edit-textarea){overflow-anchor:none;}

/* Wspólny kontrakt focus: dotyczy nawigacji klawiaturą, nie kliknięć myszą.
   Umieszczony jako ostatnia warstwa, bo historyczne klasy zerują outline. */
html .app :is(button,input,textarea,select,[tabindex]):focus-visible{
 outline:2px solid var(--dm-focus-app)!important;
 outline-offset:2px!important;
}


/* Granica podsumowania pozostaje widoczna również bez podziału na rozdziały. */
.graph-mode-active .upper-shell:not(.graph-rail-integrated)::before{
 content:"";position:absolute;inset:0;z-index:28;pointer-events:none;
 background:linear-gradient(#58718e,#58718e) calc(100% - var(--right) - var(--scrollbar-space)) 0 / 2px 100% no-repeat;
}
html[data-theme="light"] .graph-mode-active .upper-shell:not(.graph-rail-integrated)::before{
 background-image:linear-gradient(#8da1b9,#8da1b9);
}
/* Pełne tło pustego wątku pozostaje pod połączeniami. Osobna warstwa
   podpisu jest nad nimi; maska dotyczy wyłącznie dodatkowej podkładki. */
.graph-board .empty-lane-label-layer{
 position:absolute;top:0;bottom:0;z-index:4;display:flex;flex-direction:column;
 align-items:center;pointer-events:none;
 --empty-label-color:color-mix(in srgb,var(--track-color) 30%,#f6f9ff);
}
html[data-theme="dark"] .graph-board .empty-lane-label-layer{
 --empty-label-color:color-mix(in srgb,var(--track-color) 18%,#263141);
}
.graph-board .empty-lane-label-layer .empty-lane-name{
 width:100%;align-content:center;background:transparent;
}
.graph-board .empty-lane-label-layer .empty-lane-name::before,
html[data-theme="dark"] .graph-board .empty-lane-label-layer .empty-lane-name::before{
 content:"";inset:0;border-radius:0;box-shadow:none;background:var(--empty-label-color);
 mask-image:linear-gradient(to right,transparent 0%,#000 35%,#000 65%,transparent 100%),
            linear-gradient(to bottom,transparent 0%,#000 9%,#000 91%,transparent 100%);
 mask-composite:intersect;
}
/* Szyna jest także selektorem strefy; przyciski tworzenia zachowują priorytet. */
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-rail{pointer-events:auto;cursor:pointer;}

/* Wąski ekran: pionowe panele startują zwinięte, ale zachowują własne sterowanie.
   Szeroka plansza ma oddzielną szynę przewijania, zamiast wymuszać min-width na całej aplikacji. */
@media(max-width:629px){
 .app{min-width:0;min-height:0;height:100dvh;}

 .toolbar-actions{gap:3px;}

 .toolbar-menu{max-width:calc(100vw - 12px);max-height:calc(100dvh - 70px);overflow-y:auto;}
 .upper-shell{min-width:0;}
 .search-panel{right:6px;width:calc(100vw - 12px);}
}

/* Wyłącznie przy zablokowanym zapisie: trwały sygnał w nagłówku. */

YGNAŁY","desc":"Równoległa akcja; przeplatanie pustych i zajętych komórek. Test: przesuwanie i podział wierszy."},{"id":"qa-chapter-03","name":"Rozdział 03 - AWARIA","desc":"Jeden bardzo długi kafelek, pusty tekst oraz układ z wieloma wysokościami."},{"id":"qa-chapter-04","name":"Rozdział 04 - KORELACJA","desc":"Przecięcie wątków, komunikaty wielowierszowe, ruch między kolumnami."},{"id":"qa-chapter-05","name":"Rozdział 05 - NAPRAWA","desc":"Zdarzenia „przed” i „równocześnie”; przenoszenie oraz podświetlanie etykiet."},{"id":"qa-chapter-06","name":"Rozdział 06 - DOMKNIĘCIE","desc":"Etap przed finałem, w którym można testować kopiowanie i cofanie."},{"id":"qa-chapter-07","name":"Rozdział 07 - PUSTY [EDGE]","desc":"Rozdział bez wydarzeń; test dodawania, usuwania oraz łączenia."},{"id":"qa-chapter-08","name":"BEZ NAZWY [EDGE]","desc":"Celowo pusta nazwa rozdziału; test edycji tytułu i panelu opisu."},{"id":"qa-chapter-09","name":"Rozdział 08 - EPILOG","desc":"Zamykanie wątków; pozostawione do eksperymentów w ramach QA."},{"id":"qa-reg-chapter-01","name":"QA 01 - WYSOKI KONIEC / ODSTĘP OD LINII","desc":"A = F („równocześnie”), ale F jest bardzo wysoki. B i C są niezależne; mają być ustawione wspólnie, minimalnie 18 px od POZIOMEJ LINII A–F, a nie od dolnego brzegu F. Zmiana wysokości F nie może zwiększać odstępu B/C od linii."},{"id":"qa-reg-chapter-02","name":"QA 02 - RÓWNE KOŃCE, NIEPEWNY ŚRODEK","desc":"A1=B1 oraz A3=B3. A2 i B2 nadal mogą być przed, po lub równocześnie; obramowania środkowych kafelków mają pozostać przerywane."},{"id":"qa-reg-chapter-03","name":"QA 03 - TYLKO ŚRODKI RÓWNOCZESNE","desc":"A2=B2, ale A1/B1 i A3/B3 pozostają nieokreślone. Graf nie może wywnioskować równości lub kolejności skrajnych kafelków."},{"id":"qa-reg-chapter-04","name":"QA 04 - SAMOTNY KAFELEK","desc":"Jeden kafelek w rozdziale: pełna lokalna jednoznaczność (solid) niezależnie od grafu poza strefą."},{"id":"qa-reg-chapter-05","name":"QA 05 - DWA NIEZALEŻNE WĄTKI","desc":"G i H mają nieokreśloną relację (dashed); mogą być wizualnie wyrównane, co NIE oznacza równoczesności."},{"id":"qa-reg-chapter-06","name":"QA 06 - JEDEN WĄTEK, TRZY KAFELKI","desc":"Trzy kolejne kafelki jednego wątku mają zawsze relację przed/po. Odstępy między nimi równe minimum 18 px (jeśli nie ma innych ograniczeń)."},{"id":"qa-reg-chapter-07","name":"QA 07 - PUSTY, TEST PRZERWY","desc":"Celowo pusty rozdział, po nim są dwa wydarzenia bez rozdziału. Przerwa jest niezależną strefą dla rozkładu i walidatora."},{"id":"qa-reg-chapter-08","name":"QA 08 - DWA KONTRA DWADZIEŚCIA","desc":"A1=B1 i A2=B20. Tylko dwa kafelki A obejmują wszystkie 20 B; względna chronologia jest określona przez krańce."},{"id":"qa-reg-chapter-09","name":"QA 09 - TRZY KONTRA DWADZIEŚCIA","desc":"A1=B1 oraz A3=B20. A2 należy do wnętrza przedziału, ale ma nieustaloną kolejność względem B2…B19. Nie wolno uznać go za jednoznaczny."},{"id":"qa-reg-chapter-10","name":"QA 10 - DWIE LINIE / WYSOKI F / CENTROWANIE","desc":"Scenariusz z EPILOGU: A–F równocześnie, C–G równocześnie, B niezależny. Wysoki F, dwa poziome połączenia, kontrola odstępów oraz centrowania całego układu w rozdziale. Nie wolno wywnioskować relacji B do innych."}],"graphChaptersVisible":true,"graphChapterAssignments":{"qa-event-alpha-01":"qa-chapter-01","qa-event-beta-01":"qa-chapter-01","qa-event-atlas-01":"qa-chapter-01","qa-event-public-01":"qa-chapter-01","qa-event-alpha-02":"qa-chapter-01","qa-event-beta-02":"qa-chapter-01","qa-event-sabotage-01":"qa-chapter-01","qa-event-logistic-01":"qa-chapter-01","qa-event-alpha-03":"qa-chapter-02","qa-event-atlas-02":"qa-chapter-02","qa-event-sabotage-02":"qa-chapter-02","qa-event-audit-01":"qa-chapter-02","qa-event-beta-03":"qa-chapter-02","qa-event-atlas-03":"qa-chapter-02","qa-event-public-02":"qa-chapter-02","qa-event-logistic-02":"qa-chapter-02","qa-event-alpha-04":"qa-chapter-03","qa-event-beta-04":"qa-chapter-03","qa-event-sabotage-03":"qa-chapter-03","qa-event-audit-02":"qa-chapter-03","qa ,"before":"qa-chapter-06"},"qa-event-audit-04":{"after":"qa-chapter-05","before":"qa-chapter-06"},"qa-reg-gap-B":{"after":"qa-reg-chapter-07","before":"qa-reg-chapter-08"},"qa-reg-gap-C":{"after":"qa-reg-chapter-07","before":"qa-reg-chapter-08"}},"selected":"qa-chapter-01","checks":[],"activeTimeMs":0,"lastJsonExportAt":null,"noteSections":[{"id":"qa-note-01","title":"START - plan testów","html":"\u003ch1>PROJEKT TESTOWY • FENIKS\u003c/h1>\u003cp>\u003cstrong>To fikcyjny zestaw danych QA\u003c/strong>, nie opowieść ani realny projekt. W SIATCE i w GRAFIE jest ta sama historia, ale \u003cem>każdy widok ma osobny zapis i historię zmian\u003c/em>.\u003c/p>\u003ch2>Scenariusze startowe\u003c/h2>\u003col>\u003cli>Sprawdź widoki SIATKA ↔ GRAF.\u003c/li>\u003cli>Przesuń wydarzenie w inną kolumnę, użyj Ctrl+Z / Ctrl+Y.\u003c/li>\u003cli>Przefiltruj wątki i wyszukaj etykietę EDGE CASE.\u003c/li>\u003cli>Otwórz Encyklopedię i wpis osoby ATLAS.\u003c/li>\u003cli>Sprawdź eksport/import JSON oraz PDF.\u003c/li>\u003c/ol>\u003cblockquote>Projekt jest odtwarzalny z menu: „Wczytaj projekt testowy”.\u003c/blockquote>","text":""},{"id":"qa-note-02","title":"GRAF - połączenia i luki","html":"\u003ch2>Relacje chronologiczne\u003c/h2>\u003cp>W danych istnieje \u003cstrong>23 relacje równocześnie\u003c/strong> (equal) i \u003cstrong>15 relacji przed\u003c/strong> (before). Wszystkie są acykliczne, a kolejność wewnątrz wątków jest zachowana.\u003c/p>\u003cul>\u003cli>Nieprzypisane zdarzenia z etapów 5 i 9, umieszczone w lukach między rozdziałami.\u003c/li>\u003cli>Celowo pusty wątek w środku planszy, do testów drag &amp; drop.\u003c/li>\u003cli>Spróbuj stworzyć sprzeczną relację wsteczną i sprawdź komunikat walidacyjny.\u003c/li>\u003c/ul>","text":""},{"id":"qa-note-03","title":"SIATKA - edycja i krawędzie","html":"\u003ch2>Komórki i rozdziały\u003c/h2>\u003cp>Znajdziesz tu rozdziały puste, rozdział bez nazwy, pusty wiersz pośrodku, dwa wydarzenia w jednej komórce, pusty wątek i dwa wątki o nazwie „Łączność”.\u003c/p>\u003cp>Wydarzenie ATLAS w rozdziale AWARIA ma celowo przesadnie długi tekst. Wątek Łączność zawiera wydarzenie o pustym tekście.\u003c/p>","text":""},{"id":"qa-note-04","title":"FORMATOWANIE / OBRAZ","html":"\u003ch2>Nagłówki i formatowanie\u003c/h2>\u003cp>\u003cstrong>Wytłuszczenie\u003c/strong>, \u003cem>kursywa\u003c/em>, \u003cu>podkreślenie\u003c/u>, lista:\u003c/p>\u003cul>\u003cli>Pozycja A\u003c/li>\u003cli>Pozycja B\u003c/li>\u003c/ul>\u003cblockquote>Cytat służący do testowania formatowania.\u003c/blockquote>\u003cp>Wbudowany obraz PNG o małej wadze:\u003c/p>\u003cp>\u003cimg src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPoAAABaCAIAAAAektyEAAAHM0lEQVR42u2ce0xTZxiH37aHTG7ZxYm3TbCCl0zndBCuE4e7GBUVBZmAwxs6x4hB8RJFjQZvE8VgEI0YhxqYgTkNbpBoWHQbIAhys4IiiLpN3Zy6omJoYX8c19S2sNOefm2B3/MXPef9vvOdk6cvb5v3q8TFw4cA6B1I8QgAdAcAugMA3QGA7gBAdwCgOwDQHQDoDoDxcF2fTkw/jmcEugtJy6KQ3QEQlt0FvmkAsC4CyxBkd4CPqgBAdwB6fu3OExI8OSIspE3VxnHc0azcMwXn+OOhM6Ymrl4+KTj8wd8PNcFhIdNCZ0xVqdVKZcumbbvv3f+TiMp/zq+5UieRSBwd7Hem7C+rqNIfzsdQRwfHcTtS0moV9SWFeT5BwZqZdV6+iCciop8uFGVm5fAB/j5ec2YFL1+9kYjc5W5bN67JOJodOSeEiMa/N6aisoaIsnJObVmfoJlNM7P+OvWvAnV6su7+Pl6zp09ZGLtSqWxxdnZK37Pt7r37ly5XE9HED3yPnzg5wd/7+7wCPtjP+/2PJgZELo5TqVSLPp+btGFVTNxqImprU83/Ip6IhrvLd25ZFxKxWH+4dkzShlVzopd1vTBNvA6/lpRFhod4jnv30uXqNfGx25L3VdUqzhZe4LXWDNmyPqGLOTXr7OwqoGcWMwvnhSenHlAqW4hIqWxJ3ndwcXQEEfXp84q9fZ/vTv8wMcBXE7wgKnzfwSMqlYqIvs093dr6XCZ96ULXbzT1d+nX2XCeaw2NgwcNFHNvu/amr4hb8nHQhN/v3q2qVZgwg2adoHdld7mb69X6Bs3Lq3XX3eVuRBTg4/VLcWlT8+1BAwfY2XFtbSoiGiZ3u9bQyEc+efo0btUGndn8vD0vllV0NpzHx2t83bUGMffW1Hy7uvbq2vgvZ0ctMW0GzTpBr6vdtZFIJA4O9kQUFOg/crj7J0GBLv36eo0fW3SxnIg4mYwPi44I+3CC35t935gWFk1EdnbcNwdS7DhuqNuQ6eELDA7nYyQSSUvLk41JyZpRmkvb2b20Zu2zm7fvaWq+rX3WydFRpVY7ONg/evyP8LvTX6f2VfamHaqsUUCdnqx7Q+PNUSM9Kquv8C9HjfS40XhTJpW6Dnl7VmQMX9wHBvjyujffujPcXV6rqM/MyjmZl38+P1enJl4077OZ0z49cuyE/nD9KlnnSElhnpDanYjGjR3t7OS4efuedSvjvkpINBjT0dEuk0rV7e0ymUytVhtcZ0ZmNmr33lW7Hz6anRC31NnJkYicnZ1WxMZkZGaPGzu6/vqNF9+QVFb \u003cli>Odtwórz dane z menu, świadomie potwierdzając nadpisanie.\u003c/li>\u003c/ol>","text":""},{"id":"qa-note-regressions-1258","title":"REGRESJA GRAFU - przypadki QA 01–10","html":"\u003ch2>Regresja GRAFU - zestaw QA 01–10\u003c/h2>\n\u003cp>\u003cstrong>Nie usuwaj tych scenariuszy z projektu testowego.\u003c/strong> Nie oznaczają wydarzeń fabularnych FENIKSA, lecz kontrolowane układy do wykrywania regresji.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>QA 01:\u003c/strong> wysoki koniec relacji równoczesności; B i C 18 px od linii, niezależnie od wysokości F; nie od brzegu najwyższego kafelka.\u003c/li>\n\u003cli>\u003cstrong>QA 02:\u003c/strong> dwa wątki po trzy kafelki, wspólne początki i końce, niepewna para środkowa.\u003c/li>\n\u003cli>\u003cstrong>QA 03:\u003c/strong> wspólne tylko środki; początki i końce nadal nieokreślone.\u003c/li>\n\u003cli>\u003cstrong>QA 04:\u003c/strong> samotny kafelek - ciągła ramka w swojej strefie.\u003c/li>\n\u003cli>\u003cstrong>QA 05:\u003c/strong> dwa niezależne wątki - przerywane ramki; wyrównanie wizualne nie dodaje relacji.\u003c/li>\n\u003cli>\u003cstrong>QA 06:\u003c/strong> jeden wątek, trzy kafelki - pewna kolejność, minimalne odstępy.\u003c/li>\n\u003cli>\u003cstrong>QA 07:\u003c/strong> pusta strefa rozdziału i dwa wydarzenia w przerwie za rozdziałem; geometria niezależna od sąsiednich stref.\u003c/li>\n\u003cli>\u003cstrong>QA 08:\u003c/strong> dwa kafelki A i 20 B; wspólne skrajne punkty wyznaczają wszystkie relacje A/B.\u003c/li>\n\u003cli>\u003cstrong>QA 09:\u003c/strong> trzy kafelki A i 20 B; środkowy A pozostaje niejednoznaczny wobec środkowych B.\u003c/li>\n\u003cli>\u003cstrong>QA 10:\u003c/strong> dwa poziome połączenia A–F i C–G, wysokie F oraz niezależne B. Kontrola centrowania całego układu w strefie i odstępów; wysokość F nie jest lokalnym ograniczeniem dla B/C.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>Weryfikuj dodatkowo:\u003c/strong> lokalne centrowanie w rozdziałach i przerwach; brak przecięć po
