.tri-grid{display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);width:100%;min-width:0}
.upper-head{flex:none;z-index:12;background:#edf1f7;border-bottom:2px solid #a7b7c9;align-items:stretch;box-shadow:0 2px 5px #172c4210}
.panel-cap{display:flex;align-items:center;padding:11px 12px 6px;color:#566c85;font-size:10px;font-weight:800;letter-spacing:1.2px;min-width:0}
.panel-cap.left{border-right:3px solid #7389a2}.panel-cap.right{border-left:3px solid #7389a2}
/* Nagłówki paneli bocznych wyrównane z nagłówkiem planszy (bez skracania pionowych separatorów). */
.upper-head > .panel-cap.left, .upper-head > .panel-cap.right{align-items:flex-start;padding-top:7px;padding-bottom:3px}.center-head{min-width:0;overflow:hidden;position:relative}.center-head .panel-cap{position:relative;height:27px;padding-top:7px;padding-bottom:3px}.head-clip{width:100%;height:53px;overflow:hidden;position:relative}.center-head.compact-mode .head-clip{width:100%}.head-shift, .board-shift{position:relative;will-change:transform}
.track-strip{display:grid;gap:3px;align-items:stretch;padding:0 3px;min-height:50px}.timeline-axis{font-weight:700;font-size:11px;color:#8ba0b8;align-self:center;justify-self:center}.timeline-gutter{border-right:1px dashed #c4d0dd}

.track-options:hover{color:#45637b}.track-head.is-empty .track-options{pointer-events:none;cursor:default;user-select:none}
.track-options:focus, .track-options:focus-visible{outline:none!important;box-shadow:none!important}
.empty-lane{position:absolute;top:0;bottom:0;z-index:1;pointer-events:auto;border-left:1px solid color-mix(in srgb,var(--track-color) 80%,#74849a);border-right:1px solid color-mix(in srgb,var(--track-color) 60%,#9aa8b9);background:color-mix(in srgb,var(--track-color) 30%,#f6f9ff);border-radius:2px}
.empty-lane.drop{background:color-mix(in srgb,var(--track-color) 36%,#f6f9ff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--track-color) 85%,#7f8ba0)}
/* Podgląd upuszczenia zawsze mieści się WEWNĄTRZ wąskiej, pustej kolumny. */
.lane-drop-preview{position:absolute;z-index:8;pointer-events:none;width:var(--lane-preview-width,42px);max-width:var(--lane-preview-width,42px);padding:5px 3px;min-height:60px;max-height:134px;box-sizing:border-box;border:2px dashed color-mix(in srgb,var(--preview-color) 68%,#596d81);border-radius:5px;background:color-mix(in srgb,var(--preview-color) 38%,white);color:#223148;opacity:.9;display:flex;align-items:center;justify-content:center;overflow:hidden}

.empty-lane-name{ -webkit-user-select:none;user-select:none }
.empty-lane-name[contenteditable]{-webkit-user-select:text;user-select:text}
/* Zwykle pola puste pozostaja interaktywne nad podkladem kolumny. */
.board-shift > .moment, .board-shift > .gaprow{position:relative;z-index:0}
.board-shift .empty-lane{z-index:1}

.header-horizontal{padding-left:7px;font-size:11px;color:#657a91;height:49px;display:flex;align-items:center}
.upper-scroll{min-height:0;flex:1;display:flex;flex-direction:column;overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable;overscroll-behavior:contain;background:#fafbfd;scrollbar-color:#9aafc8 #edf2f7}
.chapter{display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);grid-template-rows:auto minmax(max-content,1fr);min-width:0;flex-shrink:0}.chapter:last-child{flex-grow:1}
.chapter-bar{grid-column:1 / -1;min-height:37px;display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);align-items:stretch;border-top:2px solid #879eb7;border-bottom:1px solid #aebdd0;background:#dfe8f3;user-select:none;position:relative;z-index:2}
.chapter:first-child .chapter-bar{border-top:0}.chapter-bar.active{background:#d4e4fb}.chapter-seg{min-width:0;display:flex;align-items:center;padding:4px 10px}.chapter-seg.left{gap:7px;border-right:3px solid #8da1b9}.chapter-seg.middle{justify-content:flex-start}.chapter-seg.right{border-left:3px solid #8da1b9}.chapter-bar .handle{cursor:grab;color:#6f849c;font-weight:900;font-size:18px;line-height:1}.chapter-bar input{margin:0 4px 0 0;accent-color:#416fae}.chapter-bar .chapter-index{font-weight:850;font-size:12px;white-space:nowrap}.chapter-bar .chapter-title{font-weight:850;font-size:12px;cursor:text;min-width:100px;min-height:21px;display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chapter-bar .chapter-title .edit-input{min-width:100px;width:100%;padding:1px 2px}.chapter-bar .chapter-title:hover{text-decoration:underline;text-decoration-style:dotted}.chapter-bar .chapter-title.is-empty{opacity:.55;font-style:italic}
.chapter-left, .chapter-right{min-width:0;padding:10px 10px 13px;background:#fff}.chapter-left{border-right:3px solid #8da1b9;display:flex}.chapter-right{border-left:3px solid #8da1b9}.chapter-left .chapter-desc{width:100%;height:100%;min-height:100%;resize:none;overflow:auto;border:1px solid transparent;background:#f6f8fb;padding:8px;border-radius:5px;line-height:1.43;font-size:12px;color:#41526a}.chapter-left .chapter-desc:hover, .chapter-left .chapter-desc:focus{border-color:#d0d2d7;background:white;outline:none;box-shadow:none}
.chapter-middle{min-width:0;overflow:hidden;background:#fbfcfe;padding:8px 0 13px;position:relative}
:root{--graph-node-gap:18px;--chapter-insert-gap:var(--graph-node-gap)}.board-shift{padding:0 3px;min-height:100%}.moment, .gaprow{display:grid;gap:3px}.moment{min-height:61px;align-items:stretch}.moment + .gaprow{margin-top:0}.gaprow{height:var(--chapter-insert-gap);position:relative}.gaprow:hover{background:#eef5fd}.gap-split{width:21px;height:var(--chapter-insert-gap);min-width:0;padding:0;display:grid;place-items:center;border:0;border-radius:3px;background:transparent;color:#819bb9;font-size:14px;font-weight:700;opacity:.57;cursor:pointer}.gaprow:hover .gap-split, .gap-split:hover, .gap-split:focus-visible{opacity:1;color:#265c9c;background:#cfe5ff}.upper-shell{position:relative}.split-highlight{position:absolute;left:0;right:0;height:var(--chapter-insert-gap);background:rgba(194,219,250,.72);border-top:1px solid #80a9df;border-bottom:1px solid #80a9df;pointer-events:none;z-index:7;display:none}.gap-split{position:relative;z-index:8}.gap-place{height:var(--chapter-insert-gap);min-width:0;cursor:crosshair;border-radius:3px;position:relative}.gap-place:hover{background:#e6f0fc}.gap-place:hover:after{content:"";position:absolute;top:calc((var(--chapter-insert-gap) - 2px)/2);left:3px;right:3px;border-top:2px solid #8eabda}.cell{min-width:0;min-height:57px;display:flex;flex-direction:column;gap:4px;padding:1px 2px;cursor:crosshair;border-radius:5px}.cell.drop, .gap-place.drop{background:#f5eddb!important;outline:2px dashed #b19b77;outline-offset:-2px}.cell:hover{background:#f0f6fe}.cell:not(:has(.tile)){background:transparent}.cell:not(:has(.tile)):hover{background:#f0f6fe}.cell:not(:has(.tile)):hover::after{content:"＋";font-size:15px;color:#93b0ce;display:grid;place-items:center;flex:1;pointer-events:none}
.tile{position:relative;min-width:0;padding:8px 9px;border-radius:7px;border:1px solid color-mix(in srgb,var(--tile-accent) 62%,#72849b);background:color-mix(in srgb,var(--tile-accent) 57%,white);box-shadow:0 1px 3px #2231480e;cursor:grab;outline-offset:1px}
.tile:hover{filter:saturate(1.09);box-shadow:0 2px 6px #22314820}.tile.selected{outline:none;border-color:color-mix(in srgb,var(--tile-accent) 82%,#52657d)}.tile.dragging, .tag-pill.dragging{opacity:.45}.tile-text{font-size:12px;line-height:1.34;white-space:pre-wrap;overflow-wrap:anywhere;min-height:19px;cursor:text}.tile-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}.attached-tag{padding:2px 5px;border-radius:5px;background:#ffffffac;border:1px solid #8d9eae42;font-size:9px;color:#435267;cursor:default;line-height:1.15}
.summary-title{font-weight:750;font-size:11px;margin-bottom:9px;color:#69798b}.stat{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;padding:5px 0;border-bottom:1px solid #e7ebf2}.stat .dot{display:inline-block;background:var(--dot);width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px}.stat strong{font-size:10px;color:#6b8297}.summary-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.summary-tags span{font-size:10px;color:#60748c;background:#eef2f6;border-radius:4px;padding:3px 5px}.empty-summary{font-size:11px;color:#9ba9b6;line-height:1.45}
.h-rail-grid{display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);height:16px;min-height:16px;max-height:16px;background:#e7edf4;border-top:1px solid #cbd7e5}.h-rail-grid .spare:first-child{border-right:3px solid #8da1b9}.h-rail-grid .spare:last-child{border-left:3px solid #8da1b9}.h-rail-wrap{position:relative;min-width:0;height:15px;overflow:hidden}.h-rail{width:100%;height:15px;min-height:15px;overflow-x:scroll;overflow-y:hidden;scrollbar-gutter:auto;scrollbar-width:auto;scrollbar-color:#9aafc8 #edf2f7}.h-rail-content{height:1px}
.dock{height:126px;min-height:76px;flex:none;display:flex;flex-direction:column;background:#f2ebc6;border-top:1px solid #c3b47b}.dock-scroll{overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable;flex:1;padding:7px 12px}
/* Jedna kategoria = jeden zwarty, zawijany ciąg etykiet; nazwa kategorii i + są pierwszą, dzieloną pigułką. */
.category{margin:0 0 4px;padding:0;min-height:27px}.tag-zone{display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:5px;padding:0;min-height:27px;cursor:crosshair;border-radius:5px}.tag-zone:hover{background:#fffdf026}.add-section-row{display:flex;align-items:center;min-height:27px;margin-top:5px}.add-section-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:1px dashed #bda969;background:#fff8d6;border-radius:999px;line-height:1;color:#66552c;font-weight:700}.add-section-btn svg{display:block;width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.add-section-btn:hover{background:#ffefad}
.category-pill{display:inline-flex;align-items:center;gap:4px;flex:none;min-height:27px;max-width:100%;padding-right:4px;border:1px solid color-mix(in srgb,var(--tag-color) 45%,#9ba4ad);border-radius:18px;background:color-mix(in srgb,var(--tag-color) 75%,#f8f0d1);color:#263750;overflow:hidden;user-select:none;height:27px}.category-pill.is-draft{min-width:117px}.category-title{display:inline-flex;align-items:center;flex:1;min-width:0;padding:3px 9px 3px 10px;height:25px;font-size:11px;font-weight:850;letter-spacing:.35px;white-space:nowrap;cursor:text}.cat-add{display:inline-grid;place-items:center;flex:none;width:22px;min-width:22px;height:22px;margin:0 1px 0 0;padding:0;border:1px solid #74849a66;border-radius:999px;background:#ffffff7a;color:#35465b;line-height:1;box-shadow:inset 0 0 0 1px #ffffff22}.cat-add:hover{background:#fff9e4;border-color:#6884a3}.cat-add svg{display:block;width:12px;height:12px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.category-title .edit-input{width:100%;max-width:100%;min-width:0!important;height:19px;margin:0;padding:0 2px;line-height:18px;font-size:11px;font-weight:850;outline:none!important}
.tag-pill{display:inline-flex;align-items:center;flex:none;max-width:240px;height:27px;min-height:27px;max-height:27px;padding:3px 9px;border-radius:18px;border:1px solid color-mix(in srgb,var(--tag-color) 45%,#9ba4ad);background:var(--tag-color);color:#293750;font-size:12px;font-weight:680;white-space:nowrap;cursor:grab;user-select:none}.tag-pill.is-draft{width:120px}.tag-pill .edit-input{width:100%;min-width:0!important;max-width:100%;height:19px;padding:0 2px;line-height:18px;font-size:12px;font-weight:680;outline:none!important}.tag-pill.selected, .category-title.selected, .track-head.selected{outline:none}.tag-pill .editable{display:block;min-width:0;line-height:18px;overflow:hidden;text-overflow:ellipsis;cursor:text}.tag-pill:active{cursor:grabbing}

/* Wszystkie etykiety mają ten sam rozmiar i stylistykę; sekcje są jedynie nieco mocniej zaakcentowane. */
.category-pill, .tag-pill{box-sizing:border-box;height:28px;min-height:28px;max-height:28px;border-radius:15px;border:1px solid #adc6dd;background:#deebf8;color:#273850;font-size:12px;line-height:18px;font-weight:700;box-shadow:none}
.category-pill{background:#cddff3;border-color:#97b7d6}
.category-title{font-size:12px;line-height:18px;font-weight:800;letter-spacing:0;padding:4px 9px;height:26px}
.category-title .edit-input, .tag-pill .edit-input{font-size:12px;line-height:18px;font-weight:700}
.cat-add{background:transparent}
.tag-pill{padding:4px 9px;font-weight:700}
/* Odstęp pomiędzy grupami etykiet, bez dodatkowych nagłówków czy separatorów. */
.category{margin-bottom:14px}
.context-menu{position:fixed;z-index:9999;min-width:158px;padding:4px;border:1px solid #9eafc3;border-radius:8px;box-shadow:0 8px 26px #18283d44;background:white}.context-menu button{border:0;background:transparent;border-radius:5px;color:#263b52;width:100%;text-align:left;padding:8px 10px;font-size:12px;display:block}.context-menu button:hover{background:#e9f2ff}.context-menu button.danger{color:#a13c3c}
.edit-input{font:inherit;background:transparent!important;outline:none!important;border:0;border-radius:0;box-shadow:none!important;min-width:30px;width:100%;padding:3px;color:#21334d}.edit-textarea{display:block;width:100%;min-height:19px;max-height:none;height:auto;resize:none;overflow:hidden;line-height:1.34;font-size:12px;padding:0;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:none}
.edit-textarea::-webkit-scrollbar{display:none}
.toast{position:fixed;bottom:137px;left:50%;transform:translateX(-50%);background:#253950;color:white;padding:9px 13px;border-radius:7px;box-shadow:0 5px 12px #1f293733;font-size:12px;z-index:10000}
.flip-track{display:grid;grid-template-columns:135px max-content;gap:3px;margin:5px 0;min-height:66px;align-items:stretch}.flip-title{border-radius:5px;background:color-mix(in srgb,var(--track-color) 35%,white);border-left:4px solid var(--track-color);padding:10px 7px;font-size:12px;font-weight:800;cursor:grab;word-break:break-word}.flip-cells{display:grid;gap:3px}.flip-cell{width:177px;min-height:64px}.flip-gap{width:17px;min-height:64px;cursor:crosshair}.flip-gap:hover{background:#dfedfc}
@media (max-width:1000px){.upper-shell{--left:145px;--right:155px}.toolbar{gap:4px;padding:0 6px}.btn{padding:6px 7px;font-size:11px}.brand{font-size:15px}.chapter-left, .chapter-right{padding:8px}}
@media (max-width:720px){.upper-shell{--left:120px;--right:120px}.toolbar .btn.silent{display:none}.panel-cap{font-size:9px}.dock{height:126px}}

/* Jednolity, dyskretny tryb edycji wszystkich etykiet.
   Fokus jest sygnalizowany wyłącznie na zewnętrznej pastylce,
   zamiast na osobnym białym polu wewnątrz niej. */
.tag-pill:focus-within{border-color:#adc6dd;box-shadow:none}
.category-pill:focus-within{border-color:#97b7d6;box-shadow:none}
.tag-pill .edit-input, .category-pill .edit-input, .tag-pill .edit-input:focus, .category-pill .edit-input:focus{
  background:transparent!important;
  outline:none!important;
  border:0!important;
  box-shadow:none!important;
  border-radius:0;
  padding:0!important;
  margin:0;
  height:18px;
  min-height:18px;
  line-height:18px;
  color:inherit;
  caret-color:#66513c;
}
.tag-pill.selected:focus-within, .category-title.selected:focus-within{
  outline:none!important;
}

/* Spójna zasada w całej aplikacji: żadnych niebieskich ramek przy edycji,
   zaznaczaniu myszą lub przechodzeniu klawiszem Tab. */
:where(*):focus, :where(*):focus-visible{outline:none!important}
:where(input, textarea, button):focus, :where(input, textarea, button):focus-visible{box-shadow:none!important}
.edit-input, .edit-input:focus, .edit-input:focus-visible{
  outline:none!important;box-shadow:none!important;border:0!important;
}
.project-name .edit-input{color:#f8fbff;background:transparent!important}
.tile:focus-within, .tag-pill:focus-within, .category-pill:focus-within, .category-title:focus-within, .track-head:focus-within, .empty-lane-name:focus-within{
  outline:none!important;box-shadow:none!important;
}
.tag-pill.selected, .category-title.selected, .track-head.selected, .empty-lane-name.selected{
  outline:none!important;box-shadow:none!important;
}
.tag-pill.selected{border-color:#a9906b}
.category-title.selected{background:rgba(115,94,63,.08)}
:where(input, textarea)::selection{background:#dfccaa;color:#24334a}

/* Stałe miejsca na paski przewijania: nie przesuwają siatki przy pojawieniu się treści. */
.upper-shell{--scrollbar-space:0px}
.upper-head, .h-rail-grid{padding-right:var(--scrollbar-space)}

/* Ciemna paleta tylko przy data-theme="dark"; poprzednia jasna paleta pozostaje dostępna. */
html[data-theme="dark"]{color-scheme:dark;color:#e3eaf4;background:#101722}
html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] .app{background:#101722;color:#e3eaf4}
html[data-theme="dark"] .toolbar{background:#151f2d;border-bottom-color:#354255;color:#ecf2fb}
html[data-theme="dark"] .brand-separator{color:#8d9eb3}
html[data-theme="dark"] .project-name{color:#e6edf7;border-bottom-color:#63758c80}
html[data-theme="dark"] .btn{background:#28364a;border-color:#42536b;color:#eef3fa}
html[data-theme="dark"] .btn:hover, html[data-theme="dark"] .btn.silent:hover{background:#34445b}
html[data-theme="dark"] .btn.accent{background:#465f7e;color:#fff;border-color:#607c9e}
html[data-theme="dark"] .upper-shell{border-bottom-color:#4d617b}
html[data-theme="dark"] .upper-head{background:#1a2635;border-bottom-color:#354962;box-shadow:0 2px 6px #0003}
html[data-theme="dark"] .panel-cap{color:#a4b7ca}
html[data-theme="dark"] .panel-cap.left, html[data-theme="dark"] .h-rail-grid .spare:first-child{border-right-color:#42546c}
html[data-theme="dark"] .panel-cap.right, html[data-theme="dark"] .h-rail-grid .spare:last-child{border-left-color:#42546c}
html[data-theme="dark"] .timeline-axis, html[data-theme="dark"] .header-horizontal{color:#9fb0c4}
html[data-theme="dark"] .timeline-gutter{border-right-color:#415269}
html[data-theme="dark"] .track-head{background:color-mix(in srgb,var(--track-color) 20%,#293749);color:#eef2f9}

html[data-theme="dark"] .track-head .editable, html[data-theme="dark"] .track-options{color:#ecf1f8}
html[data-theme="dark"] .track-options:hover{color:#ecf1f8}
html[data-theme="dark"] .empty-lane{background:color-mix(in srgb,var(--track-color) 18%,#263141);border-left-color:color-mix(in srgb,var(--track-color) 40%,#4c5b70);border-right-color:color-mix(in srgb,var(--track-color) 40%,#4c5b70)}
html[data-theme="dark"] .empty-lane.drop{background:color-mix(in srgb,var(--track-color) 25%,#273446)}
html[data-theme="dark"] .empty-lane-name, html[data-theme="dark"] .empty-lane-name:hover, html[data-theme="dark"] .empty-lane-name.selected{color:#e8eef8}
html[data-theme="dark"] .empty-lane-name[contenteditable]{caret-color:#f2dfb0}
html[data-theme="dark"] .lane-drop-preview{background:color-mix(in srgb,var(--preview-color) 24%,#223143);color:#e5edf7;border-color:color-mix(in srgb,var(--preview-color) 58%,#73849b)}
html[data-theme="dark"] .track-new{background:#1c2a3a;border-color:#536984;color:#abc1d8}
html[data-theme="dark"] .track-new:hover{background:#293b51;border-color:#85a9ce;color:#d9edff}
html[data-theme="dark"] .upper-scroll{background:#111b29;scrollbar-color:#61748d #1b2a3b}
html[data-theme="dark"] .chapter-bar{background:#26384d;border-top-color:#4b6582;border-bottom-color:#4b6079;color:#e6edf7}
html[data-theme="dark"] .chapter-bar.active{background:#30465f}
html[data-theme="dark"] .chapter-seg.left, html[data-theme="dark"] .chapter-left{border-right-color:#42546c}
html[data-theme="dark"] .chapter-seg.right, html[data-theme="dark"] .chapter-right{border-left-color:#42546c}
html[data-theme="dark"] .chapter-bar .handle{color:#a1b3c8}
html[data-theme="dark"] .chapter-bar input{accent-color:#a4c4ee}
html[data-theme="dark"] .chapter-left, html[data-theme="dark"] .chapter-right{background:#151f2d;color:#e0e9f5}
html[data-theme="dark"] .chapter-left .chapter-desc{background:#202d3d;color:#e2ebf7;border-color:transparent;scrollbar-color:#647b97 #202d3d}
html[data-theme="dark"] .chapter-left .chapter-desc:hover, html[data-theme="dark"] .chapter-left .chapter-desc:focus{background:#27364a;border-color:#50637e}
html[data-theme="dark"] .chapter-middle{background:#121c2a}
/* v1.1.93 — siatka pionowa: odstęp wyznacza wiersz o rzeczywistej
   wysokości kafelka + jeden wspólny odstęp 18px między wierszami.
   Puste wiersze pozostają dostępne do wstawiania wydarzeń. */
.app:not(.graph-mode-active) .chapter-middle .board-shift:not(.compact-board) > .moment{min-height:0}
.app:not(.graph-mode-active) .chapter-middle .board-shift:not(.compact-board) > .moment:not(:has(.tile)){min-height:37px}
.app:not(.graph-mode-active) .chapter-middle .board-shift:not(.compact-board) > .moment > .cell{
 min-height:0;padding-top:0;padding-bottom:0;
}
/* Zajęta komórka nie oferuje ponownego dodawania w jej pustym marginesie. */
.app:not(.graph-mode-active) .chapter-middle .board-shift:not(.compact-board) > .moment > .cell.is-occupied{cursor:default}
.app:not(.graph-mode-active) .chapter-middle .board-shift:not(.compact-board) > .moment > .cell.is-occupied:hover{background:transparent}

html[data-theme="dark"] .gaprow:hover, html[data-theme="dark"] .gap-place:hover{background:#233449}
html[data-theme="dark"] .gap-split{color:#8195ad}
html[data-theme="dark"] .gaprow:hover .gap-split, html[data-theme="dark"] .gap-split:hover, html[data-theme="dark"] .gap-split:focus-visible{color:#d8e8ff;background:#3a536f}
html[data-theme="dark"] .split-highlight{background:#405b7ab0;border-top-color:#7294b5;border-bottom-color:#7294b5}
html[data-theme="dark"] .gap-place:hover:after{border-top-color:#7896b9}
html[data-theme="dark"] .cell:hover, html[data-theme="dark"] .cell:not(:has(.tile)):hover{background:#1d3042}
html[data-theme="dark"] .cell:not(:has(.tile)):hover::after{color:#86a8c9}
html[data-theme="dark"] .cell.drop, html[data-theme="dark"] .gap-place.drop{background:#413b30!important;outline-color:#b69c71}
html[data-theme="dark"] .tile{background:color-mix(in srgb,var(--tile-accent) 25%,#1d2a3a);color:#ecf2f9;border-color:color-mix(in srgb,var(--tile-accent) 48%,#455b73);box-shadow:0 1px 4px #0003}
html[data-theme="dark"] .tile:hover{box-shadow:0 2px 8px #0005;filter:brightness(1.09)}
html[data-theme="dark"] .tile.selected{border-color:color-mix(in srgb,var(--tile-accent) 86%,#ecf4ff)}
html[data-theme="dark"] .tile-text{color:inherit}
html[data-theme="dark"] .attached-tag{background:#172331c9;border-color:#53657b;color:#cbd9ea}
html[data-theme="dark"] .summary-title, html[data-theme="dark"] .stat strong{color:#b5c8df}
html[data-theme="dark"] .stat{border-bottom-color:#334155;color:#d4dfed}
html[data-theme="dark"] .summary-tags span{background:#29394d;color:#bdcce0}
html[data-theme="dark"] .empty-summary{color:#8fa2b8}
html[data-theme="dark"] .h-rail-grid{background:#1d2b3c;border-top-color:#455b75}
html[data-theme="dark"] .h-rail{scrollbar-color:#61748d #1b2a3b}
html[data-theme="dark"] .dock{background:#202637;border-top-color:#53617a}
html[data-theme="dark"] .dock-scroll{scrollbar-color:#667f9c #202637}
html[data-theme="dark"] .tag-zone:hover{background:#ffffff08}
html[data-theme="dark"] .category-pill, html[data-theme="dark"] .tag-pill{color:#e8eff9;background:color-mix(in srgb,var(--tag-color) 18%,#273649);border-color:color-mix(in srgb,var(--tag-color) 33%,#53647a)}
html[data-theme="dark"] .category-pill{background:color-mix(in srgb,var(--tag-color) 26%,#293b50);border-color:color-mix(in srgb,var(--tag-color) 43%,#667994)}
html[data-theme="dark"] .cat-add{color:#e8edf6;border-color:#6d8196;background:#ffffff12}
html[data-theme="dark"] .cat-add:hover{background:#ffffff22;border-color:#90aac4}
html[data-theme="dark"] .add-section-btn{background:#2b384c;border-color:#71839c;color:#e5edf7}
html[data-theme="dark"] .add-section-btn:hover{background:#3c4c64}
html[data-theme="dark"] .context-menu{background:#253348;border-color:#536781;box-shadow:0 9px 28px #0008}
html[data-theme="dark"] .context-menu button{color:#e6edf8}
html[data-theme="dark"] .context-menu button:hover{background:#374b65}
html[data-theme="dark"] .context-menu button.danger{color:#ffa6a6}
html[data-theme="dark"] .edit-input{color:inherit}
html[data-theme="dark"] .project-name .edit-input{color:#edf3fb}
html[data-theme="dark"] .toast{background:#34465d;color:#fff;box-shadow:0 5px 16px #0006}
html[data-theme="dark"] .flip-title{background:color-mix(in srgb,var(--track-color) 22%,#28364a);color:#e6edf7}
html[data-theme="dark"] .flip-gap:hover{background:#294056}
html[data-theme="dark"] .tag-pill:focus-within{border-color:#62758c}
html[data-theme="dark"] .category-pill:focus-within{border-color:#71849a}
html[data-theme="dark"] .tag-pill.selected{border-color:#bba578}
html[data-theme="dark"] .category-title.selected{background:rgba(240,213,161,.08)}
html[data-theme="dark"] :where(input, textarea)::selection{background:#786b53;color:#fff3d6}
html[data-theme="dark"] :where(input, textarea){caret-color:#e9d49f}

/* Typografia Drabinka Master — jednolita, lżejsza i bardziej czytelna w Dark Mode.
   Systemowe kroje: aplikacja działa również offline i nie ładuje zewnętrznych fontów. */
:root, html, body, button, input, textarea{
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  font-synthesis:none;
}
:root{font-size:13px}
.brand-fixed{font-weight:750;letter-spacing:.2px}
.panel-cap{font-weight:650;letter-spacing:.65px}
.track-head .editable, .empty-lane-name{font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0;line-height:1.3}
.chapter-bar .chapter-index, .chapter-bar .chapter-title{font-weight:650;letter-spacing:0}
.chapter-left .chapter-desc, .tile-text, .edit-textarea{font-weight:400;line-height:1.45}
.category-title{font-weight:650;letter-spacing:0}
.tag-pill, .tag-pill .editable{font-weight:500}
.stat, .summary-title{font-weight:500}
.track-options{font-weight:600}

/* Samodzielne podpowiedzi (opóźnienie jest w jednej stałej JS: TOOLTIP_DELAY_MS). */
.dm-tooltip{position:fixed;pointer-events:none;z-index:9998;max-width:min(310px,calc(100vw - 20px));padding:7px 10px;border-radius:7px;border:1px solid #b5c5d9;background:#fdfefe;color:#23344c;box-shadow:0 5px 20px #111d3333;font:500 11px/1.4 "Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}
html[data-theme="dark"] .dm-tooltip{background:#29384c;color:#ecf1f9;border-color:#657891;box-shadow:0 5px 22px #0009}
/* Pasek: kompaktowe ikony i menu działa identycznie w obu motywach. */
.toolbar{position:relative;z-index:45}
.btn.theme-btn, .btn.menu-toggle, .btn.view-mode-btn, .btn.fullscreen-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;min-height:34px;padding:0;border-radius:7px;font-size:18px;font-weight:500;line-height:1}
.toolbar-options{position:relative;display:flex;align-items:center;flex:none}
.toolbar-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:90;min-width:184px;display:flex;flex-direction:column;gap:3px;padding:6px;border:1px solid #bac8d8;border-radius:9px;background:#fff;box-shadow:0 10px 28px #15263e30}
.toolbar-menu[hidden]{display:none}
.toolbar-menu button{border:0;border-radius:5px;padding:10px 12px;text-align:left;background:transparent;color:#263b54;font-size:12px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:10px}
.toolbar-menu .menu-icon{width:17px;height:17px;flex:0 0 17px;display:block}
.toolbar-menu button:hover{background:#e7effa}
.toolbar-menu button.danger{color:#ad3d48}
.toolbar-menu .toolbar-menu-separator{height:1px;background:#d9e1eb;margin:3px 4px}
.app-version{font:500 10px/1.1 "Segoe UI",Arial,sans-serif;letter-spacing:.2px;color:#a5b8cf;white-space:nowrap;user-select:none;padding:0 1px 0 6px}
.app-version-date{display:inline-block;margin-left:7px;font:inherit;color:inherit;letter-spacing:inherit;white-space:nowrap}
/* Formatowanie czasu projektu w panelu podsumowania. */
.project-timer{display:inline-flex;align-items:center;gap:11px;margin-left:10px;color:#a9bdd6;font:500 10px/1.2 "Segoe UI",Arial,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums;user-select:none}
.project-timer svg{display:block;flex:none;opacity:.8}
.project-timer-part{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.project-timer-label{font-size:9px;opacity:.8}
.project-timer-value{font-weight:650}
html[data-theme="light"] .project-timer{color:#657c98}
@media(max-width:1160px){.project-timer{gap:6px;margin-left:3px}.project-timer-label{font-size:8px}}
@media(max-width:930px){.project-timer{flex-wrap:wrap;row-gap:2px}.project-timer-part{gap:3px}.project-timer svg{display:none}}
@media(max-width:720px){.project-timer{font-size:9px}}


html[data-theme="dark"] .toolbar-menu{background:#253246;border-color:#45576f;box-shadow:0 14px 32px #0008}
html[data-theme="dark"] .toolbar-menu button{color:#e9f1fb}
html[data-theme="dark"] .toolbar-menu button:hover{background:#35475e}
html[data-theme="dark"] .toolbar-menu button.danger{color:#ff9da3}
html[data-theme="dark"] .toolbar-menu .toolbar-menu-separator{background:#46576e}
@media(max-width:720px){.app-version{padding-left:2px}.btn.theme-btn, .btn.menu-toggle, .btn.view-mode-btn, .btn.fullscreen-btn{width:32px;height:32px;min-width:32px;min-height:32px}}

/* Nagłówek: wersja tuż za nazwą aplikacji, nazwa projektu w osi strony. */
.toolbar{
 display:grid;
 grid-template-columns:minmax(0,1fr) minmax(90px,auto) minmax(0,1fr);
 align-items:center;
 column-gap:10px;
}
.toolbar .brand{margin-right:0;min-width:0;justify-self:start;gap:8px}
.toolbar .app-version{padding:0;font-size:10px;color:#9db0c9;flex:none;position:relative;top:3px}
.toolbar > .project-name{
 justify-self:center;
 text-align:center;
 max-width:min(36vw,340px);
 min-width:0;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.toolbar-actions{display:flex;align-items:center;justify-self:end;gap:7px;min-width:0}
.toolbar > input[type=file]{display:none}
@media(max-width:720px){
 .toolbar{column-gap:5px}
 .toolbar .brand{gap:4px;font-size:12px}
 .toolbar .app-version{font-size:9px}
 .toolbar > .project-name{max-width:30vw}
 .toolbar-actions{gap:4px}
}

/* Wysuwany notatnik: overlay po prawej, bez modala i bez zmiany wymiarów planszy. */
.notes-widget{--notes-width:min(390px,calc(100vw - 58px));position:fixed;top:65px;bottom:14px;right:0;z-index:44;width:0;pointer-events:none;font-family:inherit}
.notes-panel{position:absolute;top:0;bottom:0;right:0;width:var(--notes-width);display:flex;flex-direction:column;min-width:0;pointer-events:none;visibility:hidden;transform:translateX(103%);transition:transform .2s ease,visibility 0s linear .2s;background:#fcfdff;color:#24364d;border:1px solid #a6b8cf;border-right:0;border-radius:10px 0 0 10px;box-shadow:-10px 5px 28px #16243b30;overflow:hidden}
.notes-widget.is-open .notes-panel{visibility:visible;transform:translateX(0);pointer-events:auto;transition:transform .2s ease}
.notes-tab{position:absolute;top:32%;right:0;min-width:30px;width:30px;min-height:118px;padding:10px 5px;background:#d8e7f7;border:1px solid #91a9c5;border-right:0;border-radius:8px 0 0 8px;color:#314b68;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.8px;font-size:11px;font-weight:700;box-shadow:-3px 2px 10px #16243b25;pointer-events:auto;transition:right .2s ease;cursor:pointer}
.notes-widget.is-open .notes-tab{right:var(--notes-width)}
.notes-tab:hover{background:#bfd5f0}
.notes-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid #c8d4e4}
.notes-heading{font-size:12px;font-weight:700;letter-spacing:.6px;margin:0}
.notes-actions{display:flex;align-items:center;gap:6px}
.notes-copy, .notes-close{border:1px solid #c2d0df;background:#ecf3fa;color:#405c79;padding:4px 9px;border-radius:6px;font-size:12px;line-height:18px}
.notes-close{min-width:29px;font-size:17px}
.notes-copy:hover, .notes-close:hover{background:#dbe8f6} .notes-copy.notes-icon-copy{display:inline-flex;align-items:center;justify-content:center;width:29px;height:28px;min-width:29px;padding:4px} .notes-copy.notes-icon-copy svg, .notes-format-btn svg{display:block;width:17px;height:17px;flex:none} .notes-format-btn:has(svg){display:inline-flex;align-items:center;justify-content:center;min-width:29px;min-height:29px;padding:5px}
.notes-editor{display:block;flex:1;min-height:0;width:100%;margin:0;border:0;border-radius:0;outline:0;box-shadow:none!important;padding:16px;background:transparent;color:inherit;font:400 13px/1.65 "Segoe UI",Arial,sans-serif;resize:none;overflow:auto;scrollbar-gutter:stable;white-space:pre-wrap;overflow-wrap:break-word;tab-size:4}
.notes-editor:focus{outline:none!important;border:0;box-shadow:none!important}
.notes-editor::placeholder{color:#8295aa}
.notes-foot{flex:none;padding:8px 14px;border-top:1px solid #d3deea;font-size:10px;color:#7689a0}
/* Sekcje notatnika: każda z własną nazwą i niezależnym polem treści. */
.notes-add{min-width:28px;width:28px;height:28px;display:inline-grid;place-items:center;font-size:19px;line-height:1;padding:0;font-weight:500}
.notes-list{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;padding:12px;display:flex;flex-direction:column;gap:12px}
.notes-section{display:flex;flex-direction:column;flex:none;min-width:0;border:1px solid #c5d1df;border-radius:8px;background:#f5f8fc;overflow:hidden}
.notes-section-top{min-height:35px;display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #dce5ee;background:#eaf1fa}
.notes-section-name{display:block;min-width:0;max-width:100%;font-weight:650;font-size:12px;line-height:20px;cursor:text;overflow-wrap:anywhere;outline:none;box-shadow:none}
.notes-section-name:empty::before{content:"Nazwa sekcji";font-weight:400;color:#7d8ba0;font-style:italic}
.notes-title-input{width:100%;min-width:0;background:transparent;border:0;outline:0!important;box-shadow:none!important;color:inherit;font-weight:650;font-size:12px;line-height:20px;padding:0;margin:0}
.notes-section .notes-editor{display:block;flex:none;min-height:92px;height:92px;width:100%;padding:10px 11px;line-height:1.6;overflow:hidden;resize:none;background:transparent}
.notes-editor::placeholder{font-style:normal}
.notes-empty{font-size:12px;color:#75889c;padding:12px 8px;text-align:center}
html[data-theme="dark"] .notes-list{scrollbar-color:#657b95 #213248}
html[data-theme="dark"] .notes-section{background:#1e2f44;border-color:#415871}
html[data-theme="dark"] .notes-section-top{background:#27394f;border-bottom-color:#40556d}
html[data-theme="dark"] .notes-section-name:empty::before{color:#91a4b8}
html[data-theme="dark"] .notes-title-input{color:#e5eefa;caret-color:#e5eefa}
html[data-theme="dark"] .notes-panel{background:#172435;color:#ecf2fa;border-color:#486079;box-shadow:-10px 4px 28px #0008}
html[data-theme="dark"] .notes-tab{background:#30455e;color:#d9e8fc;border-color:#617d9d;box-shadow:-4px 3px 12px #0005}
html[data-theme="dark"] .notes-tab:hover{background:#425c7a}
html[data-theme="dark"] .notes-top{border-bottom-color:#42566e}
html[data-theme="dark"] .notes-copy, html[data-theme="dark"] .notes-close{background:#273c54;color:#e2edfa;border-color:#4e647d}
html[data-theme="dark"] .notes-copy:hover, html[data-theme="dark"] .notes-close:hover{background:#3c5570}
html[data-theme="dark"] .notes-editor{background:transparent;color:#e5eefa;caret-color:#d4e1f2;scrollbar-color:#657b95 #213248}
html[data-theme="dark"] .notes-editor::placeholder{color:#8295ad}
html[data-theme="dark"] .notes-foot{border-top-color:#42566e;color:#9aacbf}
@media(max-width:720px){.notes-widget{top:57px;bottom:10px;--notes-width:min(365px,calc(100vw - 44px))}.notes-tab{width:28px;min-width:28px}}
@media(prefers-reduced-motion:reduce){.notes-panel, .notes-tab{transition:none!important}}

/* Ujednolicenie nazwy aplikacji i projektu w górnym pasku. */
.toolbar .brand{font-size:14px;font-weight:700}
.toolbar .brand-fixed{font-weight:700}
.toolbar > .project-name{font-size:14px;font-weight:700}
.toolbar > .project-name .edit-input{font-size:14px;font-weight:700}
@media(max-width:720px){
  .toolbar .brand, .toolbar > .project-name{font-size:12px}
  .toolbar > .project-name .edit-input{font-size:12px}
}

/* Nazwa projektu nie może przemieszczać się po wejściu w tryb edycji.
   Ta sama szerokość i środkowe wyrównanie w obu stanach. */
.toolbar > .project-name{
  width:min(36vw,340px);
  max-width:min(36vw,340px);
  min-width:0;
  text-align:center;
  border-bottom-color:transparent;
  text-decoration:underline dotted #7da5d099;
  text-underline-offset:4px;
}
.toolbar > .project-name:has(.edit-input){text-decoration:none}
.toolbar > .project-name:hover{text-decoration-color:#ffffffc9}
.toolbar > .project-name .edit-input{
  display:block;

/* Delikatne przejścia hover na planszy (jedno miejsce do zmiany szybkości). */
:root{
  --hover-transition-duration: 260ms;
  --hover-transition-ease: cubic-bezier(.22, .61, .36, 1);
}
.gaprow, .gap-place, .cell, .chapter-bar, .chapter-left .chapter-desc, .track-new, .tag-zone, .view-switch, .tile, .empty-lane, .tag-pill, .category-pill, .add-section-btn, .btn, .notes-tab, .context-menu button{
  transition:
    background-color var(--hover-transition-duration) var(--hover-transition-ease),
    border-color var(--hover-transition-duration) var(--hover-transition-ease),
    box-shadow var(--hover-transition-duration) var(--hover-transition-ease),
    filter var(--hover-transition-duration) var(--hover-transition-ease),
    opacity var(--hover-transition-duration) var(--hover-transition-ease);
}
/* Plus w pustej komórce nie powinien pojawiać się skokowo. */
.cell:not(:has(.tile))::after{
  content: "＋";
  font-size: 15px;
  color: #93b0ce;
  display: grid;
  place-items: center;
  flex: 1;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--hover-transition-duration) var(--hover-transition-ease);
}
.cell:not(:has(.tile)):hover::after{ opacity: 1; }
/* Podświetlenie linii wstawiania także łagodnie narasta i wygasa. */
.gap-place::after{
  content: "";
  position: absolute;
  top: 7px;
  left: 3px;
  right: 3px;
  border-top: 2px solid #8eabda;
  opacity: 0;
  transition: opacity var(--hover-transition-duration) var(--hover-transition-ease), border-color var(--hover-transition-duration) var(--hover-transition-ease);
}
.gap-place:hover::after{ opacity: 1; }
.gap-split{
  transition:
    background-color var(--hover-transition-duration) var(--hover-transition-ease),
    color var(--hover-transition-duration) var(--hover-transition-ease),
    opacity var(--hover-transition-duration) var(--hover-transition-ease);
}
/* Pionowy pas łączący trzy panele jest nakładką — bez skoku display:none. */
.split-highlight{
  display: block;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--hover-transition-duration) var(--hover-transition-ease), visibility 0s linear var(--hover-transition-duration);
}
.split-highlight.is-visible{
  opacity: 1;
  visibility: visible;
  transition: opacity var(--hover-transition-duration) var(--hover-transition-ease), visibility 0s linear 0s;
}
/* Podczas drag-and-drop informacja o celu ma pozostać natychmiastowa. */
.cell.drop, .gap-place.drop, .empty-lane.drop, .tile.dragging, .tag-pill.dragging{ transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .gaprow, .gap-place, .cell, .chapter-bar, .chapter-left .chapter-desc, .track-new, .tag-zone, .tile, .empty-lane, .tag-pill, .category-pill, .add-section-btn, .btn, .notes-tab, .context-menu button, .cell:not(:has(.tile))::after, .gap-place::after, .gap-split, .split-highlight{
    transition: none !important;
  }
}

.panel-resizer:hover::before, .dm-resizing .panel-resizer::before{background:#89a5c9}
.panel-resizer-left{left:var(--left)}
.panel-resizer-right{left:calc(100% - var(--right) - var(--scrollbar-space,0px))}

.dock{position:relative;height:var(--dock-height,126px)!important;min-height:0!important;max-height:calc(100dvh - 230px)}
.dock-scroll{padding-right:47px!important}
.dock-resizer{position:absolute;top:-4px;left:0;right:0;height:8px;z-index:25;cursor:row-resize;touch-action:none;background:transparent}
.dock-resizer:hover::after, .dm-resizing .dock-resizer::after{content:"";position:absolute;top:3px;left:0;right:0;height:1px;background:#91b2d8}
.dock-toggle{position:absolute;top:5px;right:8px;width:23px;height:23px;display:grid;place-items:center;padding:0;border:1px solid #8799b063;background:#53698124;color:#8198b2;border-radius:5px;z-index:5}
.dock-toggle:hover{background:#a5bcd044;color:#d9eaff}
.dock-mini-title{display:none;position:absolute;top:6px;left:12px;font-size:10px;letter-spacing:1px;font-weight:750;color:#94aac4}
.dock.is-collapsed .dock-scroll{display:none}
.dock.is-collapsed .dock-mini-title{display:block}
.dock.is-collapsed .dock-toggle{top:2px;height:23px}
.toolbar-notes-btn{height:34px;width:34px;min-width:34px;display:grid;place-items:center;padding:0;border-radius:7px}
.toolbar-notes-btn svg{display:block}
.toolbar-notes-btn[aria-pressed="true"]{background:#476788;border-color:#7f9fc1}
/* Poziomy pasek: natywny scrollbar-color zgodny z górnym pionowym przewijaniem. */
/* Nowy przełącznik ukrywa jedynie metki na kartach, nie ich dane ani etykiety w bibliotece. */

.tile-labels-hidden .tile-tags{display:none!important}
.tile-labels-toggle[aria-pressed="false"]{color:#6c829a;opacity:.82}

/* Filtr wątków: lista wyboru jest niezależna od wyszukiwarki wydarzeń. */
.thread-filter-wrap{position:relative;flex:none}
.btn.thread-filter-btn{width:34px;height:34px;min-width:34px;display:grid;place-items:center;padding:0;border-radius:7px}
.thread-filter-btn[aria-pressed="true"]{background:#476788;border-color:#91b1d7;color:#fff}
.thread-filter-panel{position:absolute;right:0;top:calc(100% + 9px);z-index:120;width:320px;max-width:calc(100vw - 24px);max-height:min(580px,calc(100vh - 77px));display:flex;flex-direction:column;overflow:hidden;padding:0;border:1px solid #a6b9cd;border-radius:9px;background:#f9fbff;color:#243750;box-shadow:0 14px 34px #0c192d77}
.thread-filter-panel[hidden]{display:none!important}
.thread-filter-top{padding:11px 12px 7px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}
.thread-filter-close{border:0;background:transparent;color:inherit;padding:0 4px;font-size:21px;line-height:1.1}
.thread-filter-input{display:block;width:calc(100% - 24px);margin:0 12px 9px;padding:9px 10px;border-radius:6px;border:1px solid #a8bad0;background:#fff;color:#243750;font-size:12px}
.thread-filter-counter{padding:0 12px 7px;font-size:11px;color:#657991}
.thread-filter-list{min-height:38px;overflow-y:auto;overscroll-behavior:contain;padding:5px 7px;border-top:1px solid #d6e0ec;border-bottom:1px solid #d6e0ec}
.thread-filter-item{display:flex;align-items:center;gap:9px;min-height:35px;padding:6px 8px;border-radius:5px;font-size:12px;cursor:pointer;overflow-wrap:anywhere}
.thread-filter-item:hover{background:#e6effa}
.thread-filter-item input{width:15px;height:15px;margin:0;flex:none;accent-color:#416eaa;cursor:pointer}
.thread-filter-item span{min-width:0;flex:1}
.thread-filter-empty{padding:12px 7px;font-size:12px;color:#687e99}
.thread-filter-actions{display:flex;gap:7px;padding:10px 12px}
.thread-filter-actions button{flex:1;min-width:0;padding:9px 6px;border-radius:6px;font-size:11px;font-weight:650;white-space:nowrap;border:1px solid #9aadc4;background:#e7eef8;color:#263d5b}

.thread-filter-actions .thread-filter-apply{background:#456b92;color:#fff;border-color:#456b92}
.thread-filter-actions .thread-filter-apply:hover:not(:disabled){background:#35577d}

html[data-theme="dark"] .thread-filter-panel{background:#253348;color:#e9f0fa;border-color:#526881;box-shadow:0 13px 34px #0009}

html[data-theme="dark"] .thread-filter-counter, html[data-theme="dark"] .thread-filter-empty{color:#acbdd3}
html[data-theme="dark"] .thread-filter-list{border-color:#41536a}
html[data-theme="dark"] .thread-filter-item:hover{background:#344961}
html[data-theme="dark"] .thread-filter-actions button{background:#30445b;color:#eaf0fa;border-color:#60758e}
html[data-theme="dark"] .thread-filter-actions button:hover:not(:disabled){background:#3e5570}
html[data-theme="dark"] .thread-filter-actions .thread-filter-apply{background:#5479a2;border-color:#7193b7}
html[data-theme="dark"] .thread-filter-actions .thread-filter-apply:hover:not(:disabled){background:#6489b3}

/* Potwierdzenia podmiany projektu — Anuluj jako podstawowy, początkowo aktywny wybór. */

.project-switch-actions .project-switch-confirm:hover{background:#663a40;color:#fff}

html[data-theme="light"] .project-switch-warning{background:#fff7e9;border-left-color:#bc8355}
html[data-theme="light"] .project-switch-actions .project-switch-cancel{background:#315b89;color:#fff;border-color:#315b89}
html[data-theme="light"] .project-switch-actions .project-switch-confirm{background:#fff;color:#a13d40;border-color:#bd9999}
html[data-theme="light"] .project-switch-actions .project-switch-confirm:hover{background:#f9e8e8}

.btn.graph-mode-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;min-height:34px;padding:0;border-radius:7px}
@media(max-width:720px){.btn.graph-mode-btn{width:32px;height:32px;min-width:32px;min-height:32px}}
.graph-mode-btn[aria-pressed="true"]{border-color:#95aec9!important;background:#384f68!important}
.graph-tool{display:grid;place-items:center;width:25px;height:25px;min-width:25px;padding:0;border-radius:5px}
.graph-tool-active{background:#48698c!important;color:#f8fbff!important}
.graph-mode-active .track-strip{gap:24px}
.graph-board{position:relative;overflow:visible;min-height:182px}
.graph-wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0;color:#8598ae}
.graph-wire-local{fill:none;stroke:currentColor;stroke-width:1.5;opacity:.72}
.graph-wire-before{fill:none;stroke:color-mix(in srgb,var(--graph-source-color,#7da5d0) 84%,#e5f0ff);stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;marker-start:none;marker-mid:none;marker-end:none}
html[data-theme="light"] .graph-wire-before{stroke:color-mix(in srgb,var(--graph-source-color,#7da5d0) 78%,#273c54)}
.graph-wire-equal{fill:none;stroke:#be9bf0;stroke-width:2.5;marker-start:none;marker-mid:none;marker-end:none}
/* v1.2.09: kierunkowe linie grafu to zamknięte, wypełnione wstęgi,
   których szerokość płynnie zmniejsza się z 5 px do 1 px.
   Relacje equal i minimapa zachowują zwykłe linie. */
.graph-wires .graph-wire-before{fill:color-mix(in srgb,var(--graph-source-color,#7da5d0) 84%,#e5f0ff);stroke:none;stroke-width:0;marker-start:none;marker-mid:none;marker-end:none}
html[data-theme="light"] .graph-wires .graph-wire-before{fill:color-mix(in srgb,var(--graph-source-color,#7da5d0) 78%,#273c54);stroke:none}
.graph-wires .graph-wire-local{fill:currentColor;stroke:none;stroke-width:0;marker-start:none;marker-mid:none;marker-end:none}

.graph-node{position:absolute;z-index:1;min-width:0;box-sizing:border-box}
.graph-node .tile{width:100%;height:auto;min-height:54px}
.graph-node.graph-free .tile{border:2px dashed color-mix(in srgb,var(--tile-accent) 65%,#42566f)}
html[data-theme="dark"] .graph-node.graph-free .tile{border-color:color-mix(in srgb,var(--tile-accent) 82%,#dce7f5)}
.graph-node.graph-bound .tile{border-style:solid}
/* Dyskretne oznaczenia kolejności kliknięć (nie kolejności kolumn). */
.graph-node.graph-choice-one .tile, .graph-node.graph-choice-two .tile{outline:2px solid color-mix(in srgb,var(--tile-accent) 80%,#e5efff);outline-offset:2px}
.graph-node.graph-choice-one .tile:focus-within, .graph-node.graph-choice-two .tile:focus-within, .graph-node.graph-choice-more .tile:focus-within{outline:2px solid color-mix(in srgb,var(--tile-accent) 80%,#e5efff)!important;outline-offset:2px}
html[data-theme="light"] .graph-node.graph-choice-one .tile:focus-within, html[data-theme="light"] .graph-node.graph-choice-two .tile:focus-within, html[data-theme="light"] .graph-node.graph-choice-more .tile:focus-within{outline-color:color-mix(in srgb,var(--tile-accent) 78%,#435a72)!important}
html[data-theme="light"] .graph-node.graph-choice-one .tile, html[data-theme="light"] .graph-node.graph-choice-two .tile{outline-color:color-mix(in srgb,var(--tile-accent) 78%,#435a72)}
.graph-node[data-graph-choice].graph-choice-one::after, .graph-node[data-graph-choice].graph-choice-two::after{content:attr(data-graph-choice);position:absolute;right:-7px;top:-9px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:#203047;font:bold 11px/1 system-ui;z-index:5;pointer-events:none;box-shadow:0 1px 4px #0004}
.graph-node.graph-choice-one::after{background:var(--tile-accent)}
.graph-node.graph-choice-two::after{background:var(--tile-accent)}
.graph-tool:disabled{opacity:.56;cursor:default}
/* Lokalny wybór jednej z trzech relacji; poza przepływem grafu. */
.graph-link-popover{position:fixed;z-index:11000;box-sizing:border-box;width:min(356px,calc(100vw - 16px));padding:12px;border-radius:11px;background:var(--panel,#243448);color:var(--text,#e5eaf0);border:1px solid var(--line,#71849b);box-shadow:0 14px 40px #0006;font:12px/1.45 system-ui,sans-serif}
.graph-link-popover-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px}
.graph-link-close{background:transparent;border:0;color:inherit;font-size:19px;line-height:1;cursor:pointer;padding:0 5px;border-radius:4px}
.graph-link-close:hover{background:#9caac133}
.graph-link-pair{display:flex;gap:7px;align-items:center;margin-bottom:10px;min-width:0}
.graph-link-name{min-width:0;max-width:48%;padding:4px 7px;border-radius:5px;border:1px solid color-mix(in srgb,var(--link-color,#8ea2b7) 58%,#ffffff26);background:color-mix(in srgb,var(--link-color,#8ea2b7) 18%,#ffffff0d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.graph-link-name b{display:inline-grid;place-items:center;width:16px;height:16px;margin-right:4px;border-radius:50%;color:var(--link-ink,#26313f);background:var(--link-color,#f2b775);font-size:10px;font-weight:800}
.graph-link-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.graph-link-option{min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px 3px 8px;border:1px solid #94a6ba55;border-radius:8px;color:inherit;background:#8b9aac13;cursor:pointer;font:600 11px/1.25 system-ui,sans-serif}
.graph-link-option:hover, .graph-link-option:focus-visible{background:#7194b82e;border-color:#8bb2da;outline:none}
.graph-link-option.is-current{background:#5b80a54a;border-color:#9bbcdc}
.graph-link-mini{position:relative;width:84px;height:74px;max-width:100%;border-radius:5px}
.graph-link-mini-node{position:absolute;width:32px;height:21px;display:grid;place-items:center;border-radius:4px;color:#25313e;font-weight:800;font-size:12px;box-shadow:0 1px 2px #0002}
.graph-link-mini-node.one{left:5px;background:#f2b775;border:1px solid #d19965}
.graph-link-mini-node.two{right:5px;background:#81cfe1;border:1px solid #65b0c1}
.graph-link-mini-line{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#9bbcdc;stroke-width:2;stroke-linecap:round;pointer-events:none}
.graph-link-error{margin:9px 0 0;color:#f0adab;font-size:11px;line-height:1.4}
.graph-link-remove-wrap{margin-top:12px;padding-top:12px;border-top:1px solid #91a2b74d}
.graph-link-remove{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;min-height:48px;margin:0;padding:9px 12px;border:1px solid #d77a7e;border-radius:8px;background:#c9556025;color:#ffc6cb;cursor:pointer;text-align:left;font:700 12px/1.25 system-ui,sans-serif;transition:background .14s,border-color .14s}
.graph-link-remove svg{width:19px;height:19px;flex:none}
.graph-link-remove:hover, .graph-link-remove:focus-visible{background:#c9556040;border-color:#f3a2a5;outline:none}
.graph-link-remove:active{background:#c9556050}
.graph-link-remove small{display:block;margin-top:2px;font-size:10px;font-weight:500;color:inherit;opacity:.82}
html[data-theme="light"] .graph-link-remove-wrap{border-top-color:#cad5e0}
html[data-theme="light"] .graph-link-remove{background:#fff2f2;border-color:#ce757e;color:#9d2735}
html[data-theme="light"] .graph-link-remove:hover, html[data-theme="light"] .graph-link-remove:focus-visible{background:#ffe0e3;border-color:#ad3642}
.graph-tool.graph-tool-active{background:#48698c!important;color:#f8fbff!important}
.graph-node.graph-choice-more .tile{outline:2px solid color-mix(in srgb,var(--tile-accent) 80%,#e5efff);outline-offset:2px}
html[data-theme="light"] .graph-node.graph-choice-more .tile{outline-color:color-mix(in srgb,var(--tile-accent) 78%,#435a72)}
.graph-node[data-graph-choice].graph-choice-more::after{content:attr(data-graph-choice);position:absolute;right:-7px;top:-9px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--tile-accent);color:#203047;font:bold 11px/1 system-ui;z-index:5;pointer-events:none}
html[data-theme="light"] .graph-link-popover{background:#fff;color:#273950;border-color:#b6c5d6;box-shadow:0 12px 32px #21344c3b}
html[data-theme="light"] .graph-link-name{background:color-mix(in srgb,var(--link-color,#8ea2b7) 20%,white);border-color:color-mix(in srgb,var(--link-color,#8ea2b7) 55%,#cfd8e4)}
html[data-theme="light"] .graph-link-option{background:#f5f7fa;border-color:#cbd5e1}
html[data-theme="light"] .graph-link-option:hover, html[data-theme="light"] .graph-link-option:focus-visible{background:#e3edfa;border-color:#6b98c7}
html[data-theme="light"] .graph-link-option.is-current{background:#d9e9fb;border-color:#6b98c7}
html[data-theme="light"] .graph-link-error{color:#a43b38}


.graph-node.drop{outline:2px dashed #99b8d4;outline-offset:2px;border-radius:7px}

.graph-project{grid-template-rows:minmax(0,1fr);min-height:100%}
.graph-project .chapter-middle{min-height:100%;padding:0;overflow:hidden}
.graph-project .chapter-left, .graph-project .chapter-right{min-height:100%}
.graph-project .graph-board{min-height:100%;cursor:crosshair}
.graph-lane{position:absolute;top:0;bottom:0;z-index:0;box-sizing:border-box;--lane-dot:color-mix(in srgb,var(--track-color) 22%,transparent);background-color:transparent;background-image:linear-gradient(to bottom,var(--lane-dot) 0 1px,transparent 1px 6px),linear-gradient(to bottom,var(--lane-dot) 0 1px,transparent 1px 6px);background-position:left top,right top;background-size:1px 6px,1px 6px;background-repeat:repeat-y;border:0;cursor:crosshair}
