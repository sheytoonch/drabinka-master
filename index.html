.btn{border:1px solid #4b6382;background:#293f5d;color:#f3f8fd;padding:7px 10px;border-radius:6px;font-size:12px;white-space:nowrap;font-weight:650}.btn:hover{background:#395774}.btn.accent{background:#d9efff;color:#173c5f;border-color:#d9efff}.btn.silent{border-color:transparent;background:transparent}.btn.silent:hover{background:#395774}

/* Podgląd upuszczenia zawsze mieści się WEWNĄTRZ wąskiej, pustej kolumny. */

.empty-lane-name[contenteditable]::-webkit-scrollbar{display:none}
.empty-lane-name::selection{background:transparent;color:inherit}
.empty-lane-name{ -webkit-user-select:none;user-select:none }
.empty-lane-name[contenteditable]{-webkit-user-select:text;user-select:text}
/* Zwykle pola puste pozostaja interaktywne nad podkladem kolumny. */
.board-shift > .moment,.board-shift > .gaprow{position:relative;z-index:0}
.board-shift .empty-lane{z-index:1}

.track-new{border:1px dashed #93a9c0;background:#f9fbfe;color:#58728e;border-radius:6px;padding:0;width:50px;height:50px;min-width:50px;min-height:50px;aspect-ratio:1 / 1;align-self:start;justify-self:center;display:grid;place-items:center;font-size:18px;font-weight:600;line-height:1;cursor:pointer}.track-new:hover{background:#dfedff}
.header-horizontal{padding-left:7px;font-size:11px;color:#657a91;height:49px;display:flex;align-items:center}
.upper-scroll{min-height:0;flex:1;display:flex;flex-direction:column;overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable;overscroll-behavior:contain;background:#fafbfd;scrollbar-color:#9aafc8 #edf2f7}
.chapter{display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);grid-template-rows:auto minmax(max-content,1fr);min-width:0;flex-shrink:0}.chapter:last-child{flex-grow:1}
.chapter-bar{grid-column:1 / -1;min-height:37px;display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);align-items:stretch;border-top:2px solid #879eb7;border-bottom:1px solid #aebdd0;background:#dfe8f3;user-select:none;position:relative;z-index:2}
.chapter:first-child .chapter-bar{border-top:0}.chapter-bar.active{background:#d4e4fb}.chapter-seg{min-width:0;display:flex;align-items:center;padding:4px 10px}.chapter-seg.left{gap:7px;border-right:3px solid #8da1b9}.chapter-seg.middle{justify-content:flex-start}.chapter-seg.right{border-left:3px solid #8da1b9}.chapter-bar .handle{cursor:grab;color:#6f849c;font-weight:900;font-size:18px;line-height:1}.chapter-bar input{margin:0 4px 0 0;accent-color:#416fae}.chapter-bar .chapter-index{font-weight:850;font-size:12px;white-space:nowrap}.chapter-bar .chapter-title{font-weight:850;font-size:12px;cursor:text;min-width:100px;min-height:21px;display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chapter-bar .chapter-title .edit-input{min-width:100px;width:100%;padding:1px 2px}.chapter-bar .chapter-title:hover{text-decoration:underline;text-decoration-style:dotted}.chapter-bar .chapter-title.is-empty{opacity:.55;font-style:italic}
.chapter-left,.chapter-right{min-width:0;padding:10px 10px 13px;background:#fff}.chapter-left{border-right:3px solid #8da1b9;display:flex}.chapter-right{border-left:3px solid #8da1b9}.chapter-left .chapter-desc{width:100%;height:100%;min-height:100%;resize:none;overflow:auto;border:1px solid transparent;background:#f6f8fb;padding:8px;border-radius:5px;line-height:1.43;font-size:12px;color:#41526a}.chapter-left .chapter-desc:hover,.chapter-left .chapter-desc:focus{border-color:#d0d2d7;background:white;outline:none;box-shadow:none}
.chapter-middle{min-width:0;overflow:hidden;background:#fbfcfe;padding:8px 0 13px;position:relative}
.board-shift{padding:0 3px;min-height:100%}.moment,.gaprow{display:grid;gap:3px}.moment{min-height:61px;align-items:stretch}.moment + .gaprow{margin-top:0}.gaprow{height:19px;position:relative}.gaprow:hover{background:#eef5fd}.gap-split{width:21px;height:19px;min-width:0;padding:0;display:grid;place-items:center;border:0;border-radius:3px;background:transparent;color:#819bb9;font-size:14px;font-weight:700;opacity:.57;cursor:pointer}.gaprow:hover .gap-split,.gap-split:hover,.gap-split:focus-visible{opacity:1;color:#265c9c;background:#cfe5ff}.upper-shell{position:relative}.split-highlight{position:absolute;left:0;right:0;height:19px;background:rgba(194,219,250,.72);border-top:1px solid #80a9df;border-bottom:1px solid #80a9df;pointer-events:none;z-index:7;display:none}.gap-split{position:relative;z-index:8}.gap-place{height:15px;min-width:0;cursor:crosshair;border-radius:3px;position:relative}.gap-place:hover{background:#e6f0fc}.gap-place:hover:after{content:'';position:absolute;top:7px;left:3px;right:3px;border-top:2px solid #8eabda}.cell{min-width:0;min-height:57px;display:flex;flex-direction:column;gap:4px;padding:1px 2px;cursor:crosshair;border-radius:5px}.cell.drop,.gap-place.drop{background:#f5eddb!important;outline:2px dashed #b19b77;outline-offset:-2px}.cell:hover{background:#f0f6fe}.cell:not(:has(.tile)){background:transparent}.cell:not(:has(.tile)):hover{background:#f0f6fe}.cell:not(:has(.tile)):hover::after{content:'＋';font-size:15px;color:#93b0ce;display:grid;place-items:center;flex:1;pointer-events:none}
.tile{position:relative;min-width:0;padding:8px 9px;border-radius:7px;border:1px solid color-mix(in srgb,var(--tile-accent) 62%,#72849b);background:color-mix(in srgb,var(--tile-accent) 57%,white);box-shadow:0 1px 3px #2231480e;cursor:grab;outline-offset:1px}
.tile:hover{filter:saturate(1.09);box-shadow:0 2px 6px #22314820}.tile.selected{outline:none;border-color:#9b8060}.tile.dragging,.tag-pill.dragging{opacity:.45}.tile-text{font-size:12px;line-height:1.34;white-space:pre-wrap;overflow-wrap:anywhere;min-height:19px;cursor:text}.tile-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}.attached-tag{padding:2px 5px;border-radius:5px;background:#ffffffac;border:1px solid #8d9eae42;font-size:9px;color:#435267;cursor:default;line-height:1.15}
.summary-title{font-weight:750;font-size:11px;margin-bottom:9px;color:#69798b}.stat{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;padding:5px 0;border-bottom:1px solid #e7ebf2}.stat .dot{display:inline-block;background:var(--dot);width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px}.stat strong{font-size:10px;color:#6b8297}.summary-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.summary-tags span{font-size:10px;color:#60748c;background:#eef2f6;border-radius:4px;padding:3px 5px}.empty-summary{font-size:11px;color:#9ba9b6;line-height:1.45}
.h-rail-grid{display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);height:11px;min-height:11px;max-height:11px;background:#e7edf4;border-top:1px solid #cbd7e5}.h-rail-grid .spare:first-child{border-right:3px solid #8da1b9}.h-rail-grid .spare:last-child{border-left:3px solid #8da1b9}.h-rail{height:10px;min-height:10px;overflow-x:scroll;overflow-y:hidden;scrollbar-gutter:stable;scrollbar-color:#7994b0 #e3eaf3}.h-rail::-webkit-scrollbar{height:9px}.h-rail::-webkit-scrollbar-track{background:#e3eaf3}.h-rail::-webkit-scrollbar-thumb{background:#7994b0;border-radius:6px}.h-rail-content{height:1px}
.dock{height:126px;min-height:76px;flex:none;display:flex;flex-direction:column;background:#f2ebc6;border-top:1px solid #c3b47b}.dock-scroll{overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable;flex:1;padding:7px 12px}
/* Jedna kategoria = jeden zwarty, zawijany ciąg etykiet; nazwa kategorii i + są pierwszą, dzieloną pigułką. */
.category{margin:0 0 4px;padding:0;min-height:27px}.tag-zone{display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:5px;padding:0;min-height:27px;cursor:crosshair;border-radius:5px}.tag-zone:hover{background:#fffdf026}.add-section-row{display:flex;align-items:center;min-height:27px;margin-top:5px}.add-section-btn{display:inline-grid;place-items:center;width:36px;height:27px;border:1px dashed #bda969;background:#fff8d6;border-radius:18px;font-size:18px;line-height:1;color:#66552c;font-weight:700}.add-section-btn:hover{background:#ffefad}
.category-pill{display:inline-flex;align-items:center;flex:none;min-height:27px;max-width:100%;border:1px solid color-mix(in srgb,var(--tag-color) 45%,#9ba4ad);border-radius:18px;background:color-mix(in srgb,var(--tag-color) 75%,#f8f0d1);color:#263750;overflow:hidden;user-select:none;height:27px}.category-pill.is-draft{min-width:117px}.category-title{display:inline-flex;align-items:center;flex:1;min-width:0;padding:3px 9px 3px 10px;height:25px;font-size:11px;font-weight:850;letter-spacing:.35px;white-space:nowrap;cursor:text}.cat-add{display:inline-grid;place-items:center;align-self:stretch;min-width:29px;padding:0 7px;border:0;border-left:1px solid #74849a55;background:#ffffff3c;color:#35465b;font-size:15px;font-weight:800;line-height:1}.cat-add:hover{background:#fff9e4}.category-title .edit-input{width:100%;max-width:100%;min-width:0!important;height:19px;margin:0;padding:0 2px;line-height:18px;font-size:11px;font-weight:850;outline:none!important}
.tag-pill{display:inline-flex;align-items:center;flex:none;max-width:240px;height:27px;min-height:27px;max-height:27px;padding:3px 9px;border-radius:18px;border:1px solid color-mix(in srgb,var(--tag-color) 45%,#9ba4ad);background:var(--tag-color);color:#293750;font-size:12px;font-weight:680;white-space:nowrap;cursor:grab;user-select:none}.tag-pill.is-draft{width:120px}.tag-pill .edit-input{width:100%;min-width:0!important;max-width:100%;height:19px;padding:0 2px;line-height:18px;font-size:12px;font-weight:680;outline:none!important}.tag-pill.selected,.category-title.selected,.track-head.selected{outline:none}.tag-pill .editable{display:block;min-width:0;line-height:18px;overflow:hidden;text-overflow:ellipsis;cursor:text}.tag-pill:active{cursor:grabbing}

/* Wszystkie etykiety mają ten sam rozmiar i stylistykę; sekcje są jedynie nieco mocniej zaakcentowane. */
.category-pill,.tag-pill{box-sizing:border-box;height:28px;min-height:28px;max-height:28px;border-radius:15px;border:1px solid #adc6dd;background:#deebf8;color:#273850;font-size:12px;line-height:18px;font-weight:700;box-shadow:none}
.category-pill{background:#cddff3;border-color:#97b7d6}
.category-title{font-size:12px;line-height:18px;font-weight:800;letter-spacing:0;padding:4px 9px;height:26px}
.category-title .edit-input,.tag-pill .edit-input{font-size:12px;line-height:18px;font-weight:700}
.cat-add{font-size:15px;min-width:29px;background:transparent}
.tag-pill{padding:4px 9px;font-weight:700}
/* Odstęp pomiędzy grupami etykiet, bez dodatkowych nagłówków czy separatorów. */
.category{margin-bottom:14px}
.context-menu{position:fixed;z-index:9999;min-width:158px;padding:4px;border:1px solid #9eafc3;border-radius:8px;box-shadow:0 8px 26px #18283d44;background:white}.context-menu button{border:0;background:transparent;border-radius:5px;color:#263b52;width:100%;text-align:left;padding:8px 10px;font-size:12px;display:block}.context-menu button:hover{background:#e9f2ff}.context-menu button.danger{color:#a13c3c}
.edit-input{font:inherit;background:transparent!important;outline:none!important;border:0;border-radius:0;box-shadow:none!important;min-width:30px;width:100%;padding:3px;color:#21334d}.edit-textarea{display:block;width:100%;min-height:19px;max-height:none;height:auto;resize:none;overflow:hidden;line-height:1.34;font-size:12px;padding:0;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:none}
.edit-textarea::-webkit-scrollbar{display:none}
.toast{position:fixed;bottom:137px;left:50%;transform:translateX(-50%);background:#253950;color:white;padding:9px 13px;border-radius:7px;box-shadow:0 5px 12px #1f293733;font-size:12px;z-index:10000}
.flip-track{display:grid;grid-template-columns:135px max-content;gap:3px;margin:5px 0;min-height:66px;align-items:stretch}.flip-title{border-radius:5px;background:color-mix(in srgb,var(--track-color) 35%,white);border-left:4px solid var(--track-color);padding:10px 7px;font-size:12px;font-weight:800;cursor:grab;word-break:break-word}.flip-cells{display:grid;gap:3px}.flip-cell{width:177px;min-height:64px}.flip-gap{width:17px;min-height:64px;cursor:crosshair}.flip-gap:hover{background:#dfedfc}
@media (max-width:1000px){.upper-shell{--left:145px;--right:155px}.toolbar{gap:4px;padding:0 6px}.btn{padding:6px 7px;font-size:11px}.brand{font-size:15px}.chapter-left,.chapter-right{padding:8px}}
@media (max-width:720px){.upper-shell{--left:120px;--right:120px}.toolbar .btn.silent{display:none}.panel-cap{font-size:9px}.dock{height:126px}}

/* Jednolity, dyskretny tryb edycji wszystkich etykiet.
   Fokus jest sygnalizowany wyłącznie na zewnętrznej pastylce,
   zamiast na osobnym białym polu wewnątrz niej. */
.tag-pill:focus-within{border-color:#adc6dd;box-shadow:none}
.category-pill:focus-within{border-color:#97b7d6;box-shadow:none}
.tag-pill .edit-input,.category-pill .edit-input,
.tag-pill .edit-input:focus,.category-pill .edit-input:focus{
  background:transparent!important;
  outline:none!important;
  border:0!important;
  box-shadow:none!important;
  border-radius:0;
  padding:0!important;
  margin:0;
  height:18px;
  min-height:18px;
  line-height:18px;
  color:inherit;
  caret-color:#66513c;
}
.tag-pill.selected:focus-within,.category-title.selected:focus-within{
  outline:none!important;
}

/* Spójna zasada w całej aplikacji: żadnych niebieskich ramek przy edycji,
   zaznaczaniu myszą lub przechodzeniu klawiszem Tab. */
:where(*):focus,:where(*):focus-visible{outline:none!important}
:where(input,textarea,button):focus,:where(input,textarea,button):focus-visible{box-shadow:none!important}
.edit-input,.edit-input:focus,.edit-input:focus-visible{
  outline:none!important;box-shadow:none!important;border:0!important;
}
.project-name .edit-input{color:#f8fbff;background:transparent!important}
.tile:focus-within,.tag-pill:focus-within,.category-pill:focus-within,
.category-title:focus-within,.track-head:focus-within,.empty-lane-name:focus-within{
  outline:none!important;box-shadow:none!important;
}
.tag-pill.selected,.category-title.selected,.track-head.selected,.empty-lane-name.selected{
  outline:none!important;box-shadow:none!important;
}
.tag-pill.selected{border-color:#a9906b}
.category-title.selected{background:rgba(115,94,63,.08)}
:where(input,textarea)::selection{background:#dfccaa;color:#24334a}

/* Stałe miejsca na paski przewijania: nie przesuwają siatki przy pojawieniu się treści. */
.upper-shell{--scrollbar-space:0px}
.upper-head,.h-rail-grid{padding-right:var(--scrollbar-space)}

/* Ciemna paleta tylko przy data-theme="dark"; poprzednia jasna paleta pozostaje dostępna. */
html[data-theme="dark"]{color-scheme:dark;color:#e3eaf4;background:#101722}
html[data-theme="dark"],html[data-theme="dark"] body,html[data-theme="dark"] .app{background:#101722;color:#e3eaf4}
html[data-theme="dark"] .toolbar{background:#151f2d;border-bottom-color:#354255;color:#ecf2fb}
html[data-theme="dark"] .brand-separator{color:#8d9eb3}

/* Typografia Drabinka Master — jednolita, lżejsza i bardziej czytelna w Dark Mode.
   Systemowe kroje: aplikacja działa również offline i nie ładuje zewnętrznych fontów. */
:root,html,body,button,input,textarea{
  font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  font-synthesis:none;
}
:root{font-size:13px}
.brand-fixed{font-weight:750;letter-spacing:.2px}
.panel-cap{font-weight:650;letter-spacing:.65px}
.track-head .editable,.empty-lane-name{font-family:inherit;font-size:12px;font-weight:600;letter-spacing:0;line-height:1.3}
.chapter-bar .chapter-index,.chapter-bar .chapter-title{font-weight:650;letter-spacing:0}
.chapter-left .chapter-desc,.tile-text,.edit-textarea{font-weight:400;line-height:1.45}
.category-title{font-weight:650;letter-spacing:0}
.tag-pill,.tag-pill .editable{font-weight:500}
.stat,.summary-title{font-weight:500}
.track-options{font-weight:600}

/* Samodzielne podpowiedzi (opóźnienie jest w jednej stałej JS: TOOLTIP_DELAY_MS). */
.dm-tooltip{position:fixed;pointer-events:none;z-index:9998;max-width:min(310px,calc(100vw - 20px));padding:7px 10px;border-radius:7px;border:1px solid #b5c5d9;background:#fdfefe;color:#23344c;box-shadow:0 5px 20px #111d3333;font:500 11px/1.4 "Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}
html[data-theme="dark"] .dm-tooltip{background:#29384c;color:#ecf1f9;border-color:#657891;box-shadow:0 5px 22px #0009}
/* Pasek: kompaktowe ikony i menu działa identycznie w obu motywach. */
.toolbar{position:relative;z-index:45}
.btn.theme-btn,.btn.menu-toggle,.btn.view-mode-btn,.btn.fullscreen-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;min-height:34px;padding:0;border-radius:7px;font-size:18px;font-weight:500;line-height:1}
.toolbar-options{position:relative;display:flex;align-items:center;flex:none}
.toolbar-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:90;min-width:184px;display:flex;flex-direction:column;gap:3px;padding:6px;border:1px solid #bac8d8;border-radius:9px;background:#fff;box-shadow:0 10px 28px #15263e30}
.toolbar-menu[hidden]{display:none}
.toolbar-menu button{border:0;border-radius:5px;padding:10px 12px;text-align:left;background:transparent;color:#263b54;font-size:12px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:10px}
.toolbar-menu .menu-icon{width:17px;height:17px;flex:0 0 17px;display:block}
.toolbar-menu button:hover{background:#e7effa}
.toolbar-menu button.danger{color:#ad3d48}
.toolbar-menu .toolbar-menu-separator{height:1px;background:#d9e1eb;margin:3px 4px}
.app-version{font:500 10px/1.1 "Segoe UI",Arial,sans-serif;letter-spacing:.2px;color:#a5b8cf;white-space:nowrap;user-select:none;padding:0 1px 0 6px}
.app-version-date{display:inline-block;margin-left:7px;font:inherit;color:inherit;letter-spacing:inherit;white-space:nowrap}
/* Formatowanie czasu projektu w panelu podsumowania. */
.project-timer{display:inline-flex;align-items:center;gap:11px;margin-left:10px;color:#a9bdd6;font:500 10px/1.2 "Segoe UI",Arial,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums;user-select:none}
.project-timer svg{display:block;flex:none;opacity:.8}
.project-timer-part{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.project-timer-label{font-size:9px;opacity:.8}
.project-timer-value{font-weight:650}
html[data-theme="light"] .project-timer{color:#657c98}
@media(max-width:1160px){.project-timer{gap:6px;margin-left:3px}.project-timer-label{font-size:8px}}
@media(max-width:930px){.project-timer{flex-wrap:wrap;row-gap:2px}.project-timer-part{gap:3px}.project-timer svg{display:none}}
@media(max-width:720px){.project-timer{font-size:9px}}


html[data-theme="dark"] .toolbar-menu{background:#253246;border-color:#45576f;box-shadow:0 14px 32px #0008}
html[data-theme="dark"] .toolbar-menu button{color:#e9f1fb}
html[data-theme="dark"] .toolbar-menu button:hover{background:#35475e}
html[data-theme="dark"] .toolbar-menu button.danger{color:#ff9da3}
html[data-theme="dark"] .toolbar-menu .toolbar-menu-separator{background:#46576e}
@media(max-width:720px){.app-version{padding-left:2px}.btn.theme-btn,.btn.menu-toggle,.btn.view-mode-btn,.btn.fullscreen-btn{width:32px;height:32px;min-width:32px;min-height:32px}}

/* Nagłówek: wersja tuż za nazwą aplikacji, nazwa projektu w osi strony. */
.toolbar{
 display:grid;
 grid-template-columns:minmax(0,1fr) minmax(90px,auto) minmax(0,1fr);
 align-items:center;
 column-gap:10px;
}
.toolbar .brand{margin-right:0;min-width:0;justify-self:start;gap:8px}
.toolbar .app-version{padding:0;font-size:10px;color:#9db0c9;flex:none;position:relative;top:3px}
.toolbar > .project-name{
 justify-self:center;
 text-align:center;
 max-width:min(36vw,340px);
 min-width:0;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.toolbar-actions{display:flex;align-items:center;justify-self:end;gap:7px;min-width:0}
.toolbar > input[type=file]{display:none}
@media(max-width:720px){
 .toolbar{column-gap:5px}
 .toolbar .brand{gap:4px;font-size:12px}
 .toolbar .app-version{font-size:9px}
 .toolbar > .project-name{max-width:30vw}
 .toolbar-actions{gap:4px}
}

/* Wysuwany notatnik: overlay po prawej, bez modala i bez zmiany wymiarów planszy. */
.notes-widget{--notes-width:min(390px,calc(100vw - 58px));position:fixed;top:65px;bottom:14px;right:0;z-index:44;width:0;pointer-events:none;font-family:inherit}
.notes-panel{position:absolute;top:0;bottom:0;right:0;width:var(--notes-width);display:flex;flex-direction:column;min-width:0;pointer-events:none;visibility:hidden;transform:translateX(103%);transition:transform .2s ease,visibility 0s linear .2s;background:#fcfdff;color:#24364d;border:1px solid #a6b8cf;border-right:0;border-radius:10px 0 0 10px;box-shadow:-10px 5px 28px #16243b30;overflow:hidden}
.notes-widget.is-open .notes-panel{visibility:visible;transform:translateX(0);pointer-events:auto;transition:transform .2s ease}
.notes-tab{position:absolute;top:32%;right:0;min-width:30px;width:30px;min-height:118px;padding:10px 5px;background:#d8e7f7;border:1px solid #91a9c5;border-right:0;border-radius:8px 0 0 8px;color:#314b68;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.8px;font-size:11px;font-weight:700;box-shadow:-3px 2px 10px #16243b25;pointer-events:auto;transition:right .2s ease;cursor:pointer}
.notes-widget.is-open .notes-tab{right:var(--notes-width)}
.notes-tab:hover{background:#bfd5f0}
.notes-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid #c8d4e4}
.notes-heading{font-size:12px;font-weight:700;letter-spacing:.6px;margin:0}
.notes-actions{display:flex;align-items:center;gap:6px}
.notes-copy,.notes-close{border:1px solid #c2d0df;background:#ecf3fa;color:#405c79;padding:4px 9px;border-radius:6px;font-size:12px;line-height:18px}
.notes-close{min-width:29px;font-size:17px}
.notes-copy:hover,.notes-close:hover{background:#dbe8f6} .notes-copy.notes-icon-copy{display:inline-flex;align-items:center;justify-content:center;width:29px;height:28px;min-width:29px;padding:4px} .notes-copy.notes-icon-copy svg,.notes-format-btn svg{display:block;width:17px;height:17px;flex:none} .notes-format-btn:has(svg){display:inline-flex;align-items:center;justify-content:center;min-width:29px;min-height:29px;padding:5px}
.notes-editor{display:block;flex:1;min-height:0;width:100%;margin:0;border:0;border-radius:0;outline:0;box-shadow:none!important;padding:16px;background:transparent;color:inherit;font:400 13px/1.65 'Segoe UI',Arial,sans-serif;resize:none;overflow:auto;scrollbar-gutter:stable;white-space:pre-wrap;overflow-wrap:break-word;tab-size:4}
.notes-editor:focus{outline:none!important;border:0;box-shadow:none!important}
.notes-editor::placeholder{color:#8295aa}
.notes-foot{flex:none;padding:8px 14px;border-top:1px solid #d3deea;font-size:10px;color:#7689a0}
/* Sekcje notatnika: każda z własną nazwą i niezależnym polem treści. */
.notes-add{min-width:28px;width:28px;height:28px;display:inline-grid;place-items:center;font-size:19px;line-height:1;padding:0;font-weight:500}
.notes-list{min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;padding:12px;display:flex;flex-direction:column;gap:12px}
.notes-section{display:flex;flex-direction:column;flex:none;min-width:0;border:1px solid #c5d1df;border-radius:8px;background:#f5f8fc;overflow:hidden}
.notes-section-top{min-height:35px;display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #dce5ee;background:#eaf1fa}
.notes-section-name{display:block;min-width:0;max-width:100%;font-weight:650;font-size:12px;line-height:20px;cursor:text;overflow-wrap:anywhere;outline:none;box-shadow:none}
.notes-section-name:empty::before{content:'Nazwa sekcji';font-weight:400;color:#7d8ba0;font-style:italic}
.notes-title-input{width:100%;min-width:0;background:transparent;border:0;outline:0!important;box-shadow:none!important;color:inherit;font-weight:650;font-size:12px;line-height:20px;padding:0;margin:0}
.notes-section .notes-editor{display:block;flex:none;min-height:92px;height:92px;width:100%;padding:10px 11px;line-height:1.6;overflow:hidden;resize:none;background:transparent}
.notes-editor::placeholder{font-style:normal}
.notes-empty{font-size:12px;color:#75889c;padding:12px 8px;text-align:center}
html[data-theme="dark"] .notes-list{scrollbar-color:#657b95 #213248}
html[data-theme="dark"] .notes-section{background:#1e2f44;border-color:#415871}
html[data-theme="dark"] .notes-section-top{background:#27394f;border-bottom-color:#40556d}
html[data-theme="dark"] .notes-section-name:empty::before{color:#91a4b8}
html[data-theme="dark"] .notes-title-input{color:#e5eefa;caret-color:#e5eefa}
html[data-theme="dark"] .notes-panel{background:#172435;color:#ecf2fa;border-color:#486079;box-shadow:-10px 4px 28px #0008}
html[data-theme="dark"] .notes-tab{background:#30455e;color:#d9e8fc;border-color:#617d9d;box-shadow:-4px 3px 12px #0005}
html[data-theme="dark"] .notes-tab:hover{background:#425c7a}
html[data-theme="dark"] .notes-top{border-bottom-color:#42566e}
html[data-theme="dark"] .notes-copy,html[data-theme="dark"] .notes-close{background:#273c54;color:#e2edfa;border-color:#4e647d}
html[data-theme="dark"] .notes-copy:hover,html[data-theme="dark"] .notes-close:hover{background:#3c5570}
html[data-theme="dark"] .notes-editor{background:transparent;color:#e5eefa;caret-color:#d4e1f2;scrollbar-color:#657b95 #213248}
html[data-theme="dark"] .notes-editor::placeholder{color:#8295ad}
html[data-theme="dark"] .notes-foot{border-top-color:#42566e;color:#9aacbf}
@media(max-width:720px){.notes-widget{top:57px;bottom:10px;--notes-width:min(365px,calc(100vw - 44px))}.notes-tab{width:28px;min-width:28px}}
@media(prefers-reduced-motion:reduce){.notes-panel,.notes-tab{transition:none!important}}

/* Ujednolicenie nazwy aplikacji i projektu w górnym pasku. */
.toolbar .brand{font-size:14px;font-weight:700}
.toolbar .brand-fixed{font-weight:700}
.toolbar > .project-name{font-size:14px;font-weight:700}
.toolbar > .project-name .edit-input{font-size:14px;font-weight:700}
@media(max-width:720px){
  .toolbar .brand,.toolbar > .project-name{font-size:12px}
  .toolbar > .project-name .edit-input{font-size:12px}
}

/* Nazwa projektu nie może przemieszczać się po wejściu w tryb edycji.
   Ta sama szerokość i środkowe wyrównanie w obu stanach. */
.toolbar > .project-name {
  width:min(36vw,340px);
  max-width:min(36vw,340px);
  min-width:0;
  text-align:center;
  border-bottom-color:transparent;
  text-decoration:underline dotted #7da5d099;
  text-underline-offset:4px;
}
.toolbar > .project-name:has(.edit-input){text-decoration:none}
.toolbar > .project-name:hover{text-decoration-color:#ffffffc9}
.toolbar > .project-name .edit-input {
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  padding:0;
  margin:0;
  text-align:center;
  line-height:22px;
}
@media(max-width:720px){
  .toolbar > .project-name {width:30vw;max-width:30vw}
}

/* Edytor notatek: nagłówki i akapity w jednym płynnym dokumencie. */
.notes-formatbar{flex:none;display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:7px 11px;border-bottom:1px solid #c8d4e4;background:#f2f6fb}
.notes-format-btn{border:1px solid transparent;background:transparent;color:#38546f;padding:4px 7px;min-width:27px;min-height:27px;border-radius:5px;font:600 12px/17px 'Segoe UI',Arial,sans-serif;cursor:pointer}
.notes-format-btn:hover{background:#e1ebf7;border-color:#c6d7e9}
.notes-format-btn:focus-visible{outline:none!important;box-shadow:none!important}
.notes-format-divider{width:1px;height:19px;background:#c8d4e4;margin:0 4px}
.notes-section .notes-editor[contenteditable]{display:block;flex:none;width:100%;height:auto;min-height:102px;overflow:visible;resize:none;padding:12px 13px 17px;background:transparent;border:0;outline:none!important;box-shadow:none!important;white-space:normal;overflow-wrap:anywhere;font:400 13px/1.65 'Segoe UI',Arial,sans-serif;cursor:text}
.notes-section .notes-editor[contenteditable]:empty:before{content:attr(data-placeholder);color:#8295aa;pointer-events:none}

/* Delikatne przejścia hover na planszy (jedno miejsce do zmiany szybkości). */
:root {
  --hover-transition-duration: 260ms;
  --hover-transition-ease: cubic-bezier(.22, .61, .36, 1);
}
.gaprow,
.gap-place,
.cell,
.chapter-bar,
.chapter-left .chapter-desc,
.track-new,
.tag-zone,
.view-switch,
.tile,
.empty-lane,
.tag-pill,
.category-pill,
.add-section-btn,
.btn,
.notes-tab,
.context-menu button {
  transition:
    background-color var(--hover-transition-duration) var(--hover-transition-ease),
    border-color var(--hover-transition-duration) var(--hover-transition-ease),
    box-shadow var(--hover-transition-duration) var(--hover-transition-ease),
    filter var(--hover-transition-duration) var(--hover-transition-ease),
    opacity var(--hover-transition-duration) var(--hover-transition-ease);
}
/* Plus w pustej komórce nie powinien pojawiać się skokowo. */
.cell:not(:has(.tile))::after {
  content: '＋';
  font-size: 15px;
  color: #93b0ce;
  display: grid;
  place-items: center;
  flex: 1;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--hover-transition-duration) var(--hover-transition-ease);
}
.cell:not(:has(.tile)):hover::after { opacity: 1; }
/* Podświetlenie linii wstawiania także łagodnie narasta i wygasa. */
.gap-place::after {
  content: '';
  position: absolute;
  top: 7px;
  left: 3px;
  right: 3px;
  border-top: 2px solid #8eabda;
  opacity: 0;
  transition: opacity var(--hover-transition-duration) var(--hover-transition-ease), border-color var(--hover-transition-duration) var(--hover-transition-ease);
}
.gap-place:hover::after { opacity: 1; }
.gap-split {
  transition:
    background-color var(--hover-transition-duration) var(--hover-transition-ease),
    color var(--hover-transition-duration) var(--hover-transition-ease),
    opacity var(--hover-transition-duration) var(--hover-transition-ease);
}
/* Pionowy pas łączący trzy panele jest nakładką — bez skoku display:none. */
.split-highlight {
  display: block;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--hover-transition-duration) var(--hover-transition-ease), visibility 0s linear var(--hover-transition-duration);
}
.split-highlight.is-visible {
  opacity: 1;
  visibility: visible;
  transition: opacity var(--hover-transition-duration) var(--hover-transition-ease), visibility 0s linear 0s;
}
/* Podczas drag-and-drop informacja o celu ma pozostać natychmiastowa. */
.cell.drop,
.gap-place.drop,
.empty-lane.drop,
.tile.dragging,
.tag-pill.dragging { transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .gaprow,.gap-place,.cell,.chapter-bar,.chapter-left .chapter-desc,
  .track-new,.tag-zone,.tile,.empty-lane,.tag-pill,
  .category-pill,.add-section-btn,.btn,.notes-tab,.context-menu button,
  .cell:not(:has(.tile))::after,.gap-place::after,.gap-split,.split-highlight {
    transition: none !important;
  }
}

/* v1.0.1 — czytelne wątki i zwijane, regulowane panele. */
.thread-guides{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}

.upper-shell{position:relative}
.panel-cap.left,.panel-cap.right{flex-direction:row!important;align-items:flex-start!important;justify-content:space-between;gap:3px;padding:5px 6px 3px 9px!important;white-space:nowrap}

.upper-shell.left-collapsed .panel-cap.left,.upper-shell.right-collapsed .panel-cap.right{padding:4px 5px!important;justify-content:center}
.upper-shell.left-collapsed .panel-cap.left .panel-cap-label,.upper-shell.right-collapsed .panel-cap.right .panel-cap-label{display:none}

.upper-shell.right-collapsed .chapter-seg.right{padding:0}

.panel-resizer-right{left:calc(100% - var(--right) - var(--scrollbar-space,0px))}
.dock{position:relative;height:var(--dock-height,126px)!important;min-height:0!important;max-height:calc(100dvh - 230px)}
.dock-scroll{padding-right:47px!important}

// Historia obejmuje dane fabuły, ale nie zaznaczenia, tryb wyświetlania ani pozycję kursora.
const HISTORY_LIMIT=120;
let history=[],historyIndex=-1,historyRestoring=false,lastHistoryKind='',lastHistoryAt=0;
function historySnapshot(){const copy=JSON.parse(JSON.stringify(state));delete copy.selected;delete copy.checks;delete copy.activeTimeMs;delete copy.lastJsonExportAt;return JSON.stringify(copy)}
function recordHistory(kind='mutation'){
 if(historyRestoring)return;
 const data=historySnapshot();if(history[historyIndex]===data)return;
 const now=Date.now();
 if(kind.startsWith('typing:')&&kind===lastHistoryKind&&now-lastHistoryAt<1100&&historyIndex>0){history[historyIndex]=data}
 else{history=history.slice(0,historyIndex+1);history.push(data);if(history.length>HISTORY_LIMIT)history.shift();historyIndex=history.length-1}
 lastHistoryKind=kind;lastHistoryAt=now;
}
function restoreHistory(direction){
 const index=historyIndex+direction;if(index<0||index>=history.length){toast(direction<0?'Brak zmian do cofnięcia':'Brak zmian do ponowienia');return}
 historyRestoring=true;try{
  historyIndex=index;const source=JSON.parse(history[index]);
  state={...state,...source,selected:state.selected,checks:[]};normalizeNoteSections(state);
  if(selected?.type==='event'&&!state.events[selected.id])selected=null;
  if(selected?.type==='track'&&!getTrack(selected.id))selected=null;
  if(selected?.type==='chapter'&&!getCh(selected.id))selected=null;
  collapsedChapters=new Set([...collapsedChapters].filter(id=>getCh(id)));
  activeNoteRange=null;render();
 }finally{historyRestoring=false;lastHistoryKind=''}
}
// Projekty przechowujemy w IndexedDB: localStorage służy tylko do migracji i jako awaryjny fallback.
const PROJECT_DB_NAME='drabinka-master-storage';
const PROJECT_DB_STORE='projects';
const PROJECT_DB_KEY='current';
const PROJECT_DB_TIMER_KEY='active-time'; // lekki punkt kontrolny, nie kopia całego projektu
const PROJECT_DB_WRITE_DELAY_MS=350;
let projectDB=null,dbInitialized=false,dbIsWorking=false,dbTouchedBeforeLoad=false,bootFinished=false;
let renderingStartupProject=false; // pierwszy render nie jest edycją i nie zapisuje projektu
let dbWriteTimer=null,dbPending=null,dbWriteSequence=Promise.resolve(),dbLastSavedAt=0;
function projectSnapshot(){
 const copy=JSON.parse(JSON.stringify(state));
 copy.categories=(copy.categories||[]).filter(c=>c.name?.trim()).map(c=>({...c,labels:(c.labels||[]).filter(l=>l.name?.trim())}));
 copy.activeTimeMs=Math.round(Math.max(0,Number(copy.activeTimeMs)||0));
 copy.lastJsonExportAt=normalizeJsonExportDate(copy.lastJsonExportAt);
 copy.projectId=copy.projectId||uid();
 return copy;
}
function validProject(x){return x&&Array.isArray(x.tracks)&&Array.isArray(x.chapters)&&Array.isArray(x.categories)&&x.events&&typeof x.events==='object'}
function openProjectDatabase(){
 if(!('indexedDB' in window))return Promise.resolve(null);
 return new Promise(resolve=>{
  let request;try{request=indexedDB.open(PROJECT_DB_NAME,1)}catch{return resolve(null)}
  request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(PROJECT_DB_STORE))db.createObjectStore(PROJECT_DB_STORE,{keyPath:'id'})};
  request.onsuccess=()=>{const db=request.result;db.onversionchange=()=>db.close();resolve(db)};
  request.onerror=()=>resolve(null);
  request.onblocked=()=>resolve(null);
 });
}
function readDatabaseProject(db){return new Promise(resolve=>{
 try{const tx=db.transaction(PROJECT_DB_STORE,'readonly');const req=tx.objectStore(PROJECT_DB_STORE).get(PROJECT_DB_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)}catch{resolve(null)}
})}
function readDatabaseTimer(db){return new Promise(resolve=>{
 try{const tx=db.transaction(PROJECT_DB_STORE,'readonly');const req=tx.objectStore(PROJECT_DB_STORE).get(PROJECT_DB_TIMER_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)}catch{resolve(null)}
})}
// Co 5 s zapisujemy tylko kilkadziesiąt bajtów, a nie całą planszę i zdjęcia.
function writeDatabaseTimer(){
 if(!projectDB)return;
 const record={id:PROJECT_DB_TIMER_KEY,projectId:state.projectId,activeTimeMs:Math.round(Math.max(0,Number(state.activeTimeMs)||0)),updatedAt:Date.now()};
 try{const tx=projectDB.transaction(PROJECT_DB_STORE,'readwrite');tx.objectStore(PROJECT_DB_STORE).put(record);
  tx.onerror=()=>{if(!storageWarningShown){storageWarningShown=true;toast('Nie udało się zapisać czasu pracy — wyeksportuj kopię JSON')}};
 }catch{if(!storageWarningShown){storageWarningShown=true;toast('Nie udało się zapisać czasu pracy — wyeksportuj kopię JSON')}}
}
function writeDatabaseSnapshot(snapshot){
 if(!projectDB)return Promise.reject(Error('IndexedDB jest niedostępna'));
 return new Promise((resolve,reject)=>{
  try{const tx=projectDB.transaction(PROJECT_DB_STORE,'readwrite');
   tx.objectStore(PROJECT_DB_STORE).put({id:PROJECT_DB_KEY,updatedAt:Date.now(),project:snapshot});
   tx.oncomplete=()=>{dbLastSavedAt=Date.now();resolve()};tx.onerror=()=>reject(tx.error||Error('Błąd zapisu IndexedDB'));
   tx.onabort=()=>reject(tx.error||Error('Przerwany zapis IndexedDB'));
  }catch(err){reject(err)}
 });
}
function saveFallback(snapshot){
 try{localStorage.setItem(KEY,JSON.stringify(snapshot));return true}catch{return false}
}
function queueProjectDatabaseSave(snapshot=projectSnapshot(),immediate=false){
 if(!dbInitialized){if(bootFinished)dbTouchedBeforeLoad=true;return}
 if(!dbIsWorking){if(!saveFallback(snapshot)&&!storageWarningShown){storageWarningShown=true;toast('Nie można zapisać projektu — wyeksportuj JSON')};return}
 dbPending=snapshot;
 clearTimeout(dbWriteTimer);
 if(immediate){flushProjectDatabaseSave();return}
 dbWriteTimer=setTimeout(flushProjectDatabaseSave,PROJECT_DB_WRITE_DELAY_MS);
}
function flushProjectDatabaseSave(){
 clearTimeout(dbWriteTimer);dbWriteTimer=null;
 const snapshot=dbPending;if(!snapshot||!dbIsWorking)return;
 dbPending=null;
 dbWriteSequence=dbWriteSequence.catch(()=>{}).then(()=>writeDatabaseSnapshot(snapshot)).catch(err=>{
  if(!storageWarningShown){storageWarningShown=true;toast('Nie udało się zapisać w pamięci przeglądarki — wyeksportuj kopię JSON')}
  // Dla awarii IndexedDB utrzymujemy awaryjną kopię, jeśli mieści się w localStorage.
  saveFallback(snapshot);
 });
}
// Kolejność: najnowszy projekt z IndexedDB → starsza kopia localStorage → pusty projekt.
// Demo NIE jest projektem domyślnym: otwiera się tylko z menu, zawsze jako świeża kopia.
async function initializeProjectDatabase(){
 let readyProject=savedLocalProject;
 let timeRecord=null;
 try{
  const db=await openProjectDatabase();projectDB=db;dbIsWorking=!!db;
  if(db){
   const [result,timer]=await Promise.all([readDatabaseProject(db),readDatabaseTimer(db)]);
   timeRecord=timer;
   if(result&&validProject(result.project)&&!dbTouchedBeforeLoad)readyProject=result.project;
  }
  if(!readyProject)readyProject=createEmptyProject();
  state=prepareLoadedProject(readyProject);
  if(timeRecord?.projectId===state.projectId&&Number.isFinite(+timeRecord.activeTimeMs))
   state.activeTimeMs=Math.max(state.activeTimeMs,+timeRecord.activeTimeMs);
  selected=null;hOffset=0;history=[];historyIndex=-1;lastHistoryKind='';
  renderingStartupProject=true;try{render()}finally{renderingStartupProject=false}
 }catch(err){
  console.error('Błąd uruchamiania projektu:',err);
  readyProject=validProject(readyProject)?readyProject:createEmptyProject();
  state=prepareLoadedProject(readyProject);
  selected=null;hOffset=0;history=[];historyIndex=-1;lastHistoryKind='';
  renderingStartupProject=true;try{render()}finally{renderingStartupProject=false}
  toast('Nie udało się w pełni wczytać zapisu — sprawdź konsolę');
 }finally{
  dbInitialized=true;
  if(validProject(state)){
   queueProjectDatabaseSave(projectSnapshot(),true);
   startActiveProjectTimer();
  }
 }
}
let storageWarningShown=false;
function save(kind='mutation'){
 if(renderingStartupProject)return; // nie utrwalaj pustego projektu tylko przez start aplikacji
 // Nie dodawaj tyknięć licznika do historii Ctrl+Z.
 if(kind!=='timer')recordHistory(kind);
 if(!dbInitialized){
  if(bootFinished)dbTouchedBeforeLoad=true;
  // Zachowujemy projekt nawet jeśli użytkownik zacznie pracę przed otwarciem bazy.
  saveFallback(projectSnapshot());
 }else queueProjectDatabaseSave(projectSnapshot(),kind==='timer-flush');
}

// Licznik czasu aktywnej pracy; bezczynność po 15 sekundach wstrzymuje naliczanie.
const PROJECT_IDLE_MS=15_000;
const PROJECT_TIMER_INTERVAL_MS=1000;
const PROJECT_TIMER_SAVE_INTERVAL_MS=5000; // można zmienić na 15000 bez zmian w logice
let timeCounterStarted=false,timeCounterVisible=false,lastTimeTick=0,lastActivityAt=0,lastTimePersistedAt=0;
let sessionActiveMs=0; // nie jest eksportowany ani zapisywany: zeruje się przy otwarciu projektu
function restartSessionClock(){
 sessionActiveMs=0;
 lastTimeTick=performance.now();lastActivityAt=lastTimeTick;
 lastTimePersistedAt=state.activeTimeMs;
 timeCounterVisible=!document.hidden&&document.hasFocus();
 updateProjectTimerDisplay();
}
function formatActiveTime(ms){
 const sec=Math.floor(Math.max(0,ms)/1000),hours=Math.floor(sec/3600),minutes=Math.floor(sec%3600/60),seconds=sec%60;
 return [hours,minutes,seconds].map(n=>String(n).padStart(2,'0')).join(':');
}
function formatJsonExportDate(value){
 const stamp=normalizeJsonExportDate(value);
 if(!stamp)return 'brak';
 const date=new Date(stamp);
 return `${String(date.getDate()).padStart(2,'0')}.${String(date.getMonth()+1).padStart(2,'0')}.${date.getFullYear()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
}
function updateJsonExportDisplay(){
 const field=root.querySelector('[data-last-json-export]');if(!field)return;
 field.textContent=formatJsonExportDate(state.lastJsonExportAt);
 if(state.lastJsonExportAt)field.setAttribute('datetime',state.lastJsonExportAt);
 else field.removeAttribute('datetime');
}
function updateProjectTimerDisplay(){
 const total=root.querySelector('[data-active-clock]');if(total)total.textContent=formatActiveTime(state.activeTimeMs);
 const session=root.querySelector('[data-session-clock]');if(session)session.textContent=formatActiveTime(sessionActiveMs);
}
function tickActiveProjectTime(){
 if(!timeCounterStarted)return;
 const now=performance.now();
 if(timeCounterVisible){
  // Zlicz tylko rzeczywisty czas do 15 sekund od ostatniej aktywności.
  const activeUntil=Math.min(now,lastActivityAt+PROJECT_IDLE_MS);
  const delta=Math.max(0,activeUntil-lastTimeTick);
  state.activeTimeMs+=delta;sessionActiveMs+=delta;
 }
 lastTimeTick=now;
 updateProjectTimerDisplay();
 if(state.activeTimeMs-lastTimePersistedAt>=PROJECT_TIMER_SAVE_INTERVAL_MS){
  lastTimePersistedAt=state.activeTimeMs;
  if(dbIsWorking)writeDatabaseTimer();else queueProjectDatabaseSave(projectSnapshot());
 }
}
function projectActivity(){
 if(!timeCounterStarted||document.hidden)return;
 tickActiveProjectTime();
 lastActivityAt=performance.now();
 timeCounterVisible=true;
}
function projectVisibilityChanged(){
 tickActiveProjectTime();
 timeCounterVisible=!document.hidden&&document.hasFocus();
 const now=performance.now();lastTimeTick=now;
 if(timeCounterVisible)lastActivityAt=now;
 queueProjectDatabaseSave(projectSnapshot(),true);
 if(dbIsWorking)writeDatabaseTimer();
}
function flushOnPageHide(){
 tickActiveProjectTime();
 // Uruchom transakcję przed zamknięciem strony, nie czekając na debounce.
 if(dbIsWorking&&projectDB){
  try{const tx=projectDB.transaction(PROJECT_DB_STORE,'readwrite');const store=tx.objectStore(PROJECT_DB_STORE);
   store.put({id:PROJECT_DB_KEY,updatedAt:Date.now(),project:projectSnapshot()});
   store.put({id:PROJECT_DB_TIMER_KEY,projectId:state.projectId,activeTimeMs:state.activeTimeMs,updatedAt:Date.now()});
  }catch{}
 }else saveFallback(projectSnapshot());
}
function startActiveProjectTimer(){
 if(timeCounterStarted)return;
 timeCounterStarted=true;
 lastTimeTick=performance.now();lastActivityAt=lastTimeTick;
 timeCounterVisible=!document.hidden&&document.hasFocus();
 lastTimePersistedAt=state.activeTimeMs;
 document.addEventListener('visibilitychange',projectVisibilityChanged);
 window.addEventListener('focus',projectVisibilityChanged);
 window.addEventListener('blur',projectVisibilityChanged);
 window.addEventListener('pagehide',flushOnPageHide);
 const listen=['pointermove','pointerdown','keydown','wheel','scroll','input','paste','drop','touchstart'];
 for(const eventName of listen){root.addEventListener(eventName,projectActivity,{passive:true,capture:true})}
 setInterval(tickActiveProjectTime,PROJECT_TIMER_INTERVAL_MS);
 updateProjectTimerDisplay();
}

const getCh=id=>state.chapters.find(c=>c.id===id);
const getTrack=id=>state.tracks.find(t=>t.id===id);
const getCat=id=>state.categories.find(c=>c.id===id);
const labelSorter=new Intl.Collator('pl',{sensitivity:'base',numeric:true});
const sortedLabels=labels=>[...(labels||[])].sort((a,b)=>labelSorter.compare(a.name||'',b.name||''));
const getLabel=id=>state.categories.flatMap(c=>c.labels).find(l=>l.id===id);
const getTag=id=>{for(const c of state.categories){let l=c.labels.find(x=>x.id===id);if(l)return {...l,color:c.color}}return null};

// Filtr jest stanem widoku, nie częścią projektu ani eksportowanego JSON.

function exportJSON(){

 try{
  const snapshot=projectSnapshot();

function moveTile(id,target){const src=locateEvent(id);if(!src)return;let destC=getCh(target.ch),destR=destC?.rows.find(r=>r.id===target.row);if(!destC)return;if(target.gap&&src.c.id===destC.id){let srcI=src.c.rows.indexOf(src.r);if(srcI<target.index)target.index--}cell(src.r,src.t.id).splice(src.idx,1);if(target.gap){destR=row();destC.rows.splice(Math.max(0,Math.min(target.index,destC.rows.length)),0,destR)}else if(!destR){return}
const destT=target.track;
if(target.overTile && (src.r!==destR || src.t.id!==destT)){const at=destC.rows.indexOf(destR)+(target.before?0:1);destR=row();destC.rows.splice(at,0,destR)}
const arr=cell(destR,destT);let ix=target.at==null?arr.length:target.at;if(src.r===destR&&src.t.id===destT&&src.idx<ix)ix--;arr.splice(Math.max(0,Math.min(ix,arr.length)),0,id);compactEmpty(src.c);if(destC!==src.c)compactEmpty(destC);state.selected=destC.id;pick('event',id);render()}
function emptyLaneDestination(e){
 // Detect the empty track by the pointer's coordinates too: the moment/gap
 // grid can sit above the visual lane and otherwise swallow HTML5 drop events.
 let lane=e.target.closest?.('[data-empty-track]');
 if(!lane){
  const middle=e.target.closest?.('.chapter-middle');
  if(middle){
   for(const candidate of middle.querySelectorAll('[data-empty-track]')){
    const rect=candidate.getBoundingClientRect();
    if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom){lane=candidate;break}
   }
  }
 }
 if(!lane)return null;
 const track=lane.dataset.emptyTrack;
 const ch=lane.closest('[data-chapter]')?.dataset.chapter;
 const chapter=getCh(ch),board=lane.closest('.board-shift');
 if(!chapter||!board||!getTrack(track))return null;
 const moments=[...board.querySelectorAll(':scope > .moment')];
 // We intentionally use the horizontal timeline rows, not an arbitrary append.
 for(let i=0;i<moments.length;i++){
  const rect=moments[i].getBoundingClientRect();
  if(e.clientY<rect.top)return {ch,index:i,track,gap:true};
  if(e.clientY<=rect.bottom)return {ch,row:chapter.rows[i].id,track,gap:false};
 }
 return {ch,index:chapter.rows.length,track,gap:true};
}

function showEmptyLanePreview(dest){
 if(!dest||!drag||drag.kind!=='event'){clearEmptyLanePreview();return}
 const source=state.events[drag.id],track=getTrack(dest.track);
 const chapter=root.querySelector(`.chapter[data-chapter="${dest.ch}"]`);
 const board=chapter?.querySelector('.board-shift');
 const lane=board?.querySelector(`.empty-lane[data-empty-track="${dest.track}"]`);
 if(!source||!track||!board||!lane){clearEmptyLanePreview();return}
 const row=dest.gap?board.querySelectorAll(':scope > .gaprow')[dest.index]:board.querySelectorAll(':scope > .moment')[getCh(dest.ch)?.rows.findIndex(r=>r.id===dest.row)];
 if(!row){clearEmptyLanePreview();return}
 const boardRect=board.getBoundingClientRect(),laneRect=lane.getBoundingClientRect(),rowRect=row.getBoundingClientRect();
 const top=rowRect.top-boardRect.top+(dest.gap?3:3);
 const left=laneRect.left-boardRect.left;
 const key=`${dest.ch}:${dest.track}:${dest.gap?'gap-'+dest.index:dest.row}`;
 let preview=root.querySelector('.lane-drop-preview');

  clearEmptyLanePreview();preview=document.createElement('div');preview.className='lane-drop-preview'+(dest.gap?' is-gap':'');
  preview.setAttribute('aria-hidden','true');preview.style.setProperty('--preview-color',track.color);

  board.appendChild(preview);previewLaneKey=key;

function dropDest(e){const laneDest=emptyLaneDestination(e);if(laneDest)return laneDest;let gap=e.target.closest('[data-gap]');if(gap)return {ch:gap.dataset.ch,index:Number(gap.dataset.at),track:gap.dataset.track,gap:true};let sl=e.target.closest('[data-slot]');if(sl){const tile=e.target.closest('[data-event]');const arr=cell(getCh(sl.dataset.ch).rows.find(r=>r.id===sl.dataset.row),sl.dataset.track);let at=null,overTile=false,before=false;if(tile){const index=arr.indexOf(tile.dataset.event),rect=tile.getBoundingClientRect();before=state.orientation==='horizontal'?e.clientX<=rect.left+rect.width/2:e.clientY<=rect.top+rect.height/2;at=Math.max(0,index+(before?0:1));overTile=true}return {ch:sl.dataset.ch,row:sl.dataset.row,track:sl.dataset.track,at,gap:false,overTile,before}}return null}

// Wyszukiwanie wieloetykietowe: wydarzenie pasuje do dowolnej z zaznaczonych etykiet.
// Tekst wpisany w trybie „Etykiety” filtruje jedynie przyciski etykiet, nie odznacza wyboru.
function matchingEvents(term){
 const q=(term||'').trim().toLocaleLowerCase('pl');
 if(searchMode==='tags'&&!searchSelectedLabels.size)return [];
 if(searchMode!=='tags'&&!q)return [];
 const found=[];
 for(const ch of state.chapters)for(const r of ch.rows)for(const tr of state.tracks)for(const id of cell(r,tr.id)){
  const ev=state.events[id];if(!ev)continue;
  const tags=(ev.labels||[]).map(labelId=>getTag(labelId)?.name||'').filter(Boolean).join(' ');
  const matches=searchMode==='tags'
   ?[...searchSelectedLabels].some(labelId=>(ev.labels||[]).includes(labelId))
   :[ev.text,tr.name,ch.name,tags].some(x=>(x||'').toLocaleLowerCase('pl').includes(q));
  if(matches)found.push({id,chapter:ch,name:tr.name,description:ev.text||'',tags});
 }
 return found;
}
function updateSearchDimming(matches=null){
 const active=searchOpen&&(searchMode==='tags'?searchSelectedLabels.size>0:!!searchTerm.trim());
 const visible=active?new Set((matches||matchingEvents(searchTerm)).map(x=>x.id)):null;
 root.querySelectorAll('.tile[data-event]').forEach(tile=>{
  tile.classList.toggle('search-dimmed',!!visible&&!visible.has(tile.dataset.event));
 });
}
function updateSearchResults(){
 const list=root.querySelector('.search-results'),input=root.querySelector('.search-input'),tagsPanel=root.querySelector('.search-tags');
 if(!list||!input)return;
 // Usunięte etykiety nie mogą pozostać zaznaczone po zmianie struktury projektu.
 for(const id of searchSelectedLabels)if(!getLabel(id))searchSelectedLabels.delete(id);
 const query=input.value.trim(),q=query.toLocaleLowerCase('pl');
 searchTerm=input.value;
 const tagMode=searchMode==='tags';
 const count=root.querySelector('.search-selected-count');
 if(count)count.textContent=tagMode&&searchSelectedLabels.size?`Wybrano: ${searchSelectedLabels.size}`:'';
 const clear=root.querySelector('[data-search-clear]');
 if(clear)clear.disabled=!query&&!searchSelectedLabels.size;
 if(tagsPanel){
  tagsPanel.hidden=!tagMode;
  if(tagMode){
   const groups=state.categories.map(cat=>{
    const labels=sortedLabels(cat.labels).filter(l=>l.name?.trim()&&(
      searchSelectedLabels.has(l.id)||!q||l.name.toLocaleLowerCase('pl').includes(q)||cat.name?.toLocaleLowerCase('pl').includes(q)
    ));
    if(!labels.length)return '';
    return `<div class="search-tag-category"><span class="search-tag-category-name">${esc(cat.name)}</span>${labels.map(l=>{
      const count=Object.values(state.events).filter(ev=>(ev.labels||[]).includes(l.id)).length;
      return `<button type="button" class="search-tag" style="--search-tag-color:${esc(cat.color)}" data-search-label="${esc(l.id)}" aria-pressed="${searchSelectedLabels.has(l.id)}">${esc(l.name)}<span class="search-tag-count">${count}</span></button>`;
    }).join('')}</div>`;
   }).filter(Boolean).join('');
   tagsPanel.innerHTML=groups||'<p class="search-empty">Brak pasujących etykiet.</p>';
  }
 }
 const found=matchingEvents(query);
 updateSearchDimming(found);
 if(tagMode&&!searchSelectedLabels.size){list.innerHTML='<p class="search-empty">Wybierz jedną lub kilka etykiet. Znalezione wydarzenia mogą mieć dowolną z wybranych etykiet.</p>';return}
 if(!tagMode&&!query){list.innerHTML='<p class="search-empty">Wpisz fragment wydarzenia lub nazwę etykiety.</p>';return}
 if(!found.length){list.innerHTML='<p class="search-empty">Brak wyników.</p>';return}
 list.innerHTML=found.slice(0,100).map(v=>`<button type="button" class="search-result" data-search-result="${esc(v.id)}" role="option"><span class="search-result-text">${esc(v.description||'(bez opisu)')}</span><span class="search-result-meta">${esc(chapterIndex(v.chapter))} · ${esc(v.name)}${v.tags?' · '+esc(v.tags):''}</span></button>`).join('');
}

 else if(!r){r=row();const at=Number.isFinite(dest.rowIndex)?dest.rowIndex:ch.rows.length;ch.rows.splice(Math.max(0,Math.min(at,ch.rows.length)),0,r)}

function exportDocumentPdf(options){
 tickActiveProjectTime();
 // PDF zachowuje własny wybór kolorystyki — nie czyta motywu aplikacji.
 PDF_COLORS=options.dark?PDF_PALETTES.dark:PDF_PALETTES.light;
 let result;
 try{
  const scenes=[];
  if(options.labels)scenes.push(buildPdfLabelsScene());
  if(options.board){
   if(options.oneChapterPerPage){
    state.chapters.forEach((chapter,i)=>{
     const scene=buildPdfBoardScene(options.mode,options.labels,i);
     scene.keepOnOnePage=true;
     scenes.push(scene);
    });
   }else scenes.push(buildPdfBoardScene(options.mode,options.labels));
  }
  if(options.notes)scenes.push(buildPdfNotesScene());
  result=buildCanvasPdf(scenes);
 }finally{PDF_COLORS=PDF_PALETTES.light}
 const name=(state.projectName||'projekt').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'projekt';
 const url=URL.createObjectURL(result),link=document.createElement('a');
 link.href=url;link.download='drabinka-master-'+name+'.pdf';document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}

function pdfMeasure(){const c=document.createElement('canvas');return c.getContext('2d')}
function pdfLines(c,text,maxWidth,font='13px Arial'){
 c.font=font;const output=[];for(const paragraph of String(text||'').replace(/\r/g,'').split('\n')){
  if(!paragraph){output.push('');continue}

   const trial=line?line+' '+word:word;
   if(c.measureText(trial).width<=maxWidth){line=trial;continue}
   if(line){output.push(line);line=''}
   if(c.measureText(word).width<=maxWidth){line=word;continue}
   let part='';for(const char of word){if(part&&c.measureText(part+char).width>maxWidth){output.push(part);part=''}part+=char}line=part;

function pdfText(c,text,x,y,opt={}){

function buildPdfLabelsScene(){

function pdfChapterTagGroups(ch){
 const ids=new Set();
 for(const r of ch.rows)for(const t of state.tracks)for(const eventId of (r.cells[t.id]||[])){
  const ev=state.events[eventId];if(ev)for(const id of (ev.labels||[]))ids.add(id);
 }

}
function pdfChapterSummaryLayout(ctx,ch,w,includeLabels){
 const used=chapterActiveTracks(ch),groups=includeLabels?pdfChapterTagGroups(ch):[];
 let yy=11;
 const trackTop=yy+25;
 yy=trackTop+used.length*23+13;
 const tags=[];
 if(includeLabels){
  yy+=7;
  yy+=21; // nagłówek ETYKIETY
  if(!groups.length){yy+=24}
  for(const group of groups){
   const catY=yy;yy+=19;
   let xx=12;const rowStart=xx, maxX=w-15;
   const pills=[];
   ctx.font='10px Arial';
   for(const tag of group.labels){
    const tagWidth=Math.min(maxX-rowStart,Math.max(30,ctx.measureText(tag.name).width+15));
    if(xx>rowStart && xx+tagWidth>maxX){xx=rowStart;yy+=20}
    pills.push({label:tag.name,x:xx,y:yy,width:tagWidth,color:group.cat.color});xx+=tagWidth+5;
   }
   yy+=25;tags.push({category:group.cat.name,y:catY,pills,color:group.cat.color});
  }

function buildPdfBoardScene(mode,includeLabels=false,onlyChapterIndex=null){

 const trackLists=chapterEntries.map(({chapter})=>compact?chapterActiveTracks(chapter):state.tracks);
 const maxN=Math.max(1,...trackLists.map(t=>t.length));const boardX=margin+L+14;
 const width=Math.max(860,boardX+maxN*(W+G)-G+14+R+margin), rightX=width-R-margin+6;
 let current=90;const chapters=[];
 for(let chIndex=0;chIndex<chapterEntries.length;chIndex++){
  const {chapter,index}=chapterEntries[chIndex],tracks=trackLists[chIndex];
  const rows=[];let linesHeight=0;

   let rh=46;for(const t of tracks){const ids=pdfCardsFor(ctx,r,t);let sum=0;for(const id of ids){const ev=state.events[id];if(ev)sum+=pdfCardMetrics(ctx,ev,W).height+6}rh=Math.max(rh,sum+2)}
   rows.push({row:r,height:rh});linesHeight+=rh+rowgap;

  const chapterH=42+Math.max(68+linesHeight+18,notesHeight+25,summary.total+17);
  chapters.push({chapter,index,tracks,rows,y:current,height:chapterH,summary});current+=chapterH+6;
 }
 const height=Math.max(280,current+25);
 return {width,height,breaks:chapters.map(c=>c.y),draw(c){
   pdfFillRect(c,0,0,width,height,PDF_COLORS.background);pdfDrawDocumentTitle(c,'',width,compact?'Plansza — układ kompaktowy':'Plansza — pełny układ');

function pdfNoteTextBlocks(note){

}
function buildPdfNotesScene(){

   const h=Math.max(lh,lines.length*lh)+ (h1?13:10);blocks.push({...block,y,height:h,size:fontSize,lh});y+=h;

  pdfFillRect(c,0,0,width,height,PDF_COLORS.background);pdfDrawDocumentTitle(c,'',width,'Notatki');

   for(const b of sec.blocks){pdfText(c,b.text,42,b.y,{size:b.size,weight:b.type.startsWith('h')?750:400,maxWidth:maxW,lineHeight:b.lh,color:PDF_COLORS.ink})}

function buildCanvasPdf(scenes){

 for(const scene of scenes){
  // PDF ma limit 14400 punktów na wymiar strony (około 5 m bez UserUnit).
  // Tryb "1 rozdział na stronę" skaluje cały rozdział zamiast dzielić go na kolejne strony.
  const ptScale=scene.keepOnOnePage
   ?Math.min(.75,13600/scene.width,13600/scene.height)
   :Math.min(.75,13600/scene.width);
  const maxWorldH=scene.keepOnOnePage?scene.height:Math.min(17000,13600/ptScale);
  const rasterScale=Math.min(1.6,2800/scene.width),step=Math.max(120,Math.round(1850/rasterScale));
  let from=0;
  while(from<scene.height){let to=Math.min(scene.height,from+maxWorldH);
   if(to<scene.height){const candidates=scene.breaks.filter(v=>v>from+300&&v<to);if(candidates.length)to=candidates[candidates.length-1]}
   if(to<=from)to=Math.min(scene.height,from+maxWorldH);
