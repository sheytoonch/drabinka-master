// Tekst jest rasteryzowany razem z kolorową planszą, co zachowuje polskie znaki.
function exportDocumentPdf(options){
 tickActiveProjectTime();
 // PDF zachowuje własny wybór kolorystyki — nie czyta motywu aplikacji.
 PDF_COLORS=options.dark?PDF_PALETTES.dark:PDF_PALETTES.light;
 let result;
 try{
  const scenes=[];
  if(options.labels)scenes.push(buildPdfLabelsScene());
  if(options.board){
   if(options.oneChapterPerPage){
    state.chapters.forEach((chapter,i)=>{
     const scene=buildPdfBoardScene(options.mode,options.labels,i);
     scene.keepOnOnePage=true;
     scenes.push(scene);
    });
   }else scenes.push(buildPdfBoardScene(options.mode,options.labels));
  }
  if(options.notes)scenes.push(buildPdfNotesScene());
  result=buildCanvasPdf(scenes);
 }finally{PDF_COLORS=PDF_PALETTES.light}
 const name=(state.projectName||'projekt').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'projekt';
 const url=URL.createObjectURL(result),link=document.createElement('a');
 link.href=url;link.download='drabinka-master-'+name+'.pdf';document.body.append(link);link.click();link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
const PDF_PALETTES={
 light:{dark:false,ink:'#1c304a',muted:'#5c7185',line:'#c3d0da',background:'#ffffff',pale:'#f1f5f9',chapter:'#dce8f4',panel:'#f5f8fb',description:'#4c637d',section:'#66809a',badge:'#ffffffd9',header:'#1d3048',heading:'#ffffff',subheading:'#c8dfef'},
 dark:{dark:true,ink:'#ecf2f9',muted:'#acbdd1',line:'#4b6079',background:'#101b2a',pale:'#1c2c3d',chapter:'#304561',panel:'#192c40',description:'#c0cede',section:'#9db8d2',badge:'#142235ee',header:'#101b29',heading:'#f1f6fb',subheading:'#afc3d9'}
};
let PDF_COLORS=PDF_PALETTES.light;
function pdfRounded(c,x,y,w,h,r=7){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function pdfFillRect(c,x,y,w,h,fill,r=0){c.fillStyle=fill;if(r){pdfRounded(c,x,y,w,h,r);c.fill()}else c.fillRect(x,y,w,h)}
function pdfStroke(c,x,y,w,h,color,r=5){c.strokeStyle=color;c.lineWidth=1;if(r){pdfRounded(c,x,y,w,h,r);c.stroke()}else c.strokeRect(x,y,w,h)}
function pdfColor(hex,alpha=0.17){
 const parse=(value,fallback)=>{const str=String(value||fallback).replace('#','');return /^[0-9a-f]{6}$/i.test(str)?[0,2,4].map(i=>parseInt(str.slice(i,i+2),16)):[155,180,200]};
 const vals=parse(hex,'#93b1cf'),base=parse(PDF_COLORS.background,'#ffffff');
 return 'rgb('+vals.map((n,i)=>Math.round(base[i]*(1-alpha)+n*alpha)).join(',')+')';
}
function pdfMeasure(){const c=document.createElement('canvas');return c.getContext('2d')}
function pdfLines(c,text,maxWidth,font='13px Arial'){
 c.font=font;const output=[];for(const paragraph of String(text||'').replace(/\r/g,'').split('\n')){
  if(!paragraph){output.push('');continue}
  let line='';for(const word of paragraph.split(/\s+/)){
   const trial=line?line+' '+word:word;
   if(c.measureText(trial).width<=maxWidth){line=trial;continue}
   if(line){output.push(line);line=''}
   if(c.measureText(word).width<=maxWidth){line=word;continue}
   let part='';for(const char of word){if(part&&c.measureText(part+char).width>maxWidth){output.push(part);part=''}part+=char}line=part;
  }
  output.push(line)
 }return output;
}
function pdfText(c,text,x,y,opt={}){
 const {size=13,color=PDF_COLORS.ink,weight=400,maxWidth=400,lineHeight=Math.round(size*1.43),align='left'}=opt;
 c.font=`${weight} ${size}px Arial, sans-serif`;c.fillStyle=color;c.textBaseline='top';c.textAlign=align;
 const lines=pdfLines(c,text,maxWidth,`${weight} ${size}px Arial`);
 for(let i=0;i<lines.length;i++)c.fillText(lines[i],x,y+i*lineHeight);
 c.textAlign='left';return lines.length*lineHeight;
}
function pdfCardsFor(c,r,t){return r.cells[t.id]||[]}
function pdfCardMetrics(ctx,ev,w){
 const lh=19;const lineCount=pdfLines(ctx,ev.text||'',w-20,'13px Arial').length;
 const labels=(ev.labels||[]).map(getTag).filter(Boolean).map(l=>l.name);
 let rows=labels.length?1:0,used=0;
 ctx.font='10px Arial';for(const label of labels){const iw=Math.min(w-22,Math.max(24,ctx.measureText(label).width+14));if(used&&used+iw+4>w-20){rows++;used=0}used+=iw+4}
 return {height:Math.max(48,16+Math.max(1,lineCount)*lh+(rows?rows*17+7:0)),labels};
}
function pdfDrawCard(ctx,ev,t,x,y,w){
 const metrics=pdfCardMetrics(ctx,ev,w),h=metrics.height;
 pdfFillRect(ctx,x,y,w,h,pdfColor(t.color,PDF_COLORS.dark?0.26:0.18),7);pdfStroke(ctx,x,y,w,h,pdfColor(t.color,0.70),7);
 let yy=y+10;yy+=pdfText(ctx,ev.text,x+10,yy,{size:13,maxWidth:w-20,lineHeight:19});
 if(metrics.labels.length){yy+=5;let xx=x+10;ctx.font='10px Arial';for(const label of metrics.labels){const iw=Math.min(w-22,Math.max(24,ctx.measureText(label).width+14));if(xx>x+10&&xx+iw>x+w-9){xx=x+10;yy+=17}pdfFillRect(ctx,xx,yy,iw,15,PDF_COLORS.badge,4);pdfText(ctx,label,xx+6,yy+2,{size:10,maxWidth:iw-10,lineHeight:12});xx+=iw+4}}
 return h;
}
function pdfDrawDocumentTitle(ctx,name,width,secondary){
 pdfFillRect(ctx,0,0,width,70,PDF_COLORS.header);pdfText(ctx,'DRABINKA MASTER',28,16,{size:17,color:PDF_COLORS.heading,weight:750,maxWidth:width-60});pdfText(ctx,(state.projectName||'Projekt')+'  /  '+secondary,28,42,{size:12,color:PDF_COLORS.subheading,maxWidth:width-55});
 pdfText(ctx,'Łączny czas pracy: '+formatActiveTime(state.activeTimeMs),width-28,19,{size:10,color:PDF_COLORS.subheading,align:'right',maxWidth:220,lineHeight:12});

function buildPdfLabelsScene(){
 const w=940,ctx=pdfMeasure();const groups=[];let y=100;
 for(const cat of state.categories){const labs=sortedLabels(cat.labels).filter(l=>(l.name||'').trim());
  ctx.font='12px Arial';const titleW=Math.max(115,ctx.measureText(cat.name||'Bez nazwy').width+30);
  let x=28+titleW+12,lines=1;for(const lab of labs){const tokenW=Math.min(810,ctx.measureText(lab.name).width+24);if(x+tokenW>w-25){lines++;x=28}x+=tokenW+8}
  const h=Math.max(40,lines*37+10);groups.push({cat,labs,y,titleW,h});y+=h+14;
 }
 const height=Math.max(240,y+32);
 return {width:w,height,breaks:groups.map(g=>g.y),draw(c){
  pdfFillRect(c,0,0,w,height,PDF_COLORS.background);pdfDrawDocumentTitle(c,'',w,'Etykiety');
  for(const g of groups){let xx=28,yy=g.y;pdfFillRect(c,xx,yy,g.titleW,28,pdfColor(g.cat.color,PDF_COLORS.dark?.27:.4),15);pdfText(c,g.cat.name||'Bez nazwy',xx+12,yy+7,{size:12,weight:750,maxWidth:g.titleW-16});xx+=g.titleW+12;c.font='12px Arial';
   for(const lab of g.labs){const iw=Math.min(810,c.measureText(lab.name).width+24);if(xx+iw>w-28){xx=28;yy+=37}pdfFillRect(c,xx,yy,iw,28,pdfColor(g.cat.color,PDF_COLORS.dark?.25:.37),14);pdfStroke(c,xx,yy,iw,28,pdfColor(g.cat.color,.85),14);pdfText(c,lab.name,xx+11,yy+7,{size:12,maxWidth:iw-18});xx+=iw+8}
  }
 }};
}
// Etykiety użyte w danym rozdziale, pogrupowane według kategorii.
function pdfChapterTagGroups(ch){
 const ids=new Set();
 for(const r of ch.rows)for(const t of state.tracks)for(const eventId of (r.cells[t.id]||[])){
  const ev=state.events[eventId];if(ev)for(const id of (ev.labels||[]))ids.add(id);
 }
 return state.categories.map(cat=>({cat,labels:sortedLabels(cat.labels).filter(l=>ids.has(l.id))})).filter(g=>g.labels.length);
}
function pdfChapterSummaryLayout(ctx,ch,w,includeLabels){
 const used=chapterActiveTracks(ch),groups=includeLabels?pdfChapterTagGroups(ch):[];
 let yy=11;
 const trackTop=yy+25;
 yy=trackTop+used.length*23+13;
 const tags=[];
 if(includeLabels){
  yy+=7;
  yy+=21; // nagłówek ETYKIETY
  if(!groups.length){yy+=24}
  for(const group of groups){
   const catY=yy;yy+=19;
   let xx=12;const rowStart=xx, maxX=w-15;
   const pills=[];
   ctx.font='10px Arial';
   for(const tag of group.labels){
    const tagWidth=Math.min(maxX-rowStart,Math.max(30,ctx.measureText(tag.name).width+15));
    if(xx>rowStart && xx+tagWidth>maxX){xx=rowStart;yy+=20}
    pills.push({label:tag.name,x:xx,y:yy,width:tagWidth,color:group.cat.color});xx+=tagWidth+5;
   }
   yy+=25;tags.push({category:group.cat.name,y:catY,pills,color:group.cat.color});
  }
 }
 return {used,groups,tags,trackTop,total:yy+7};
}
function buildPdfBoardScene(mode,includeLabels=false,onlyChapterIndex=null){
 const compact=mode==='compact', ctx=pdfMeasure(),margin=28,L=193,R=225,W=205,G=9,rowgap=8;
 const chapterEntries=state.chapters.map((chapter,index)=>({chapter,index})).filter(entry=>onlyChapterIndex===null||entry.index===onlyChapterIndex);
 const trackLists=chapterEntries.map(({chapter})=>compact?chapterActiveTracks(chapter):state.tracks);
 const maxN=Math.max(1,...trackLists.map(t=>t.length));const boardX=margin+L+14;
 const width=Math.max(860,boardX+maxN*(W+G)-G+14+R+margin), rightX=width-R-margin+6;
 let current=90;const chapters=[];
 for(let chIndex=0;chIndex<chapterEntries.length;chIndex++){
  const {chapter,index}=chapterEntries[chIndex],tracks=trackLists[chIndex];
  const rows=[];let linesHeight=0;
  for(const r of chapter.rows){
   let rh=46;for(const t of tracks){const ids=pdfCardsFor(ctx,r,t);let sum=0;for(const id of ids){const ev=state.events[id];if(ev)sum+=pdfCardMetrics(ctx,ev,W).height+6}rh=Math.max(rh,sum+2)}
   rows.push({row:r,height:rh});linesHeight+=rh+rowgap;
  }
  const descLines=pdfLines(ctx,chapter.desc||'',L-24,'12px Arial');
  const notesHeight=(descLines.length*18)+18;
  const summary=pdfChapterSummaryLayout(ctx,chapter,R-9,includeLabels);
  const chapterH=42+Math.max(68+linesHeight+18,notesHeight+25,summary.total+17);
  chapters.push({chapter,index,tracks,rows,y:current,height:chapterH,summary});current+=chapterH+6;
 }
 const height=Math.max(280,current+25);
 return {width,height,breaks:chapters.map(c=>c.y),draw(c){
   pdfFillRect(c,0,0,width,height,PDF_COLORS.background);pdfDrawDocumentTitle(c,'',width,compact?'Plansza — układ kompaktowy':'Plansza — pełny układ');
   for(const entry of chapters){
    const {chapter,tracks,rows,y,height:chH,summary}=entry;
    pdfFillRect(c,margin,y,width-margin*2,40,PDF_COLORS.chapter,3);
    pdfText(c,'Rozdział '+(entry.index+1),margin+11,y+11,{size:13,weight:750,maxWidth:L-28});
    pdfText(c,chapter.name||'',boardX,y+11,{size:13,weight:700,maxWidth:Math.max(W,tracks.length*(W+G)-G)});
    c.strokeStyle=PDF_COLORS.line;c.lineWidth=1;c.beginPath();c.moveTo(margin,y+40);c.lineTo(width-margin,y+40);c.stroke();
    const innerTop=y+48;const bodyH=chH-48;
    pdfFillRect(c,margin,innerTop,L-5,bodyH-8,PDF_COLORS.panel,4);
    pdfText(c,chapter.desc||'',margin+10,innerTop+12,{size:12,color:PDF_COLORS.description,maxWidth:L-26,lineHeight:18});
    pdfFillRect(c,rightX,innerTop,R-9,bodyH-8,PDF_COLORS.panel,4);
    pdfText(c,'WĄTKI W ROZDZIALE',rightX+11,innerTop+11,{size:10,weight:750,color:PDF_COLORS.section,maxWidth:R-24});
    summary.used.forEach((t,i)=>{pdfFillRect(c,rightX+13,innerTop+summary.trackTop+i*23,9,9,t.color,4);pdfText(c,t.name,rightX+28,innerTop+summary.trackTop-5+i*23,{size:11,maxWidth:R-44})});
    if(includeLabels){
     const tagHeaderY=innerTop+summary.trackTop+summary.used.length*23+16;
     pdfText(c,'ETYKIETY',rightX+11,tagHeaderY,{size:10,weight:750,color:PDF_COLORS.section,maxWidth:R-24});
     if(!summary.groups.length)pdfText(c,'Brak etykiet',rightX+12,tagHeaderY+23,{size:11,color:PDF_COLORS.muted,maxWidth:R-25});
     summary.tags.forEach(group=>{
      pdfText(c,group.category,rightX+12,innerTop+group.y,{size:11,weight:700,color:PDF_COLORS.muted,maxWidth:R-27});
      group.pills.forEach(pill=>{
       pdfFillRect(c,rightX+pill.x,innerTop+pill.y,pill.width,17,pdfColor(pill.color,PDF_COLORS.dark?.32:.28),5);
       pdfStroke(c,rightX+pill.x,innerTop+pill.y,pill.width,17,pdfColor(pill.color,.62),5);
       pdfText(c,pill.label,rightX+pill.x+6,innerTop+pill.y+3,{size:10,maxWidth:pill.width-12,lineHeight:11});
      });
     });
    }
    if(!tracks.length){pdfText(c,'Brak wydarzeń',boardX,innerTop+13,{size:12,color:PDF_COLORS.muted});continue}
    tracks.forEach((t,i)=>{const x=boardX+i*(W+G);pdfFillRect(c,x,innerTop+4,W,31,pdfColor(t.color,PDF_COLORS.dark?.23:.26),4);pdfFillRect(c,x,innerTop+32,W,3,t.color);pdfText(c,t.name,x+8,innerTop+11,{size:12,weight:700,maxWidth:W-16})});
    let yy=innerTop+43;
    for(const row of rows){
     tracks.forEach((t,i)=>{let tileY=yy;const x=boardX+i*(W+G);for(const id of pdfCardsFor(c,row.row,t)){const ev=state.events[id];if(ev)tileY+=pdfDrawCard(c,ev,t,x,tileY,W)+6}});
     yy+=row.height+rowgap;
    }
   }
 }};
}
function pdfNoteTextBlocks(note){
 const holder=document.createElement('div');holder.innerHTML=sanitizeNoteHtml(note.html||plainNoteToHtml(note.text||''));
 const blocks=[];function walk(node){if(node.nodeType===Node.TEXT_NODE){if(node.textContent.trim())blocks.push({type:'p',text:node.textContent});return}if(node.nodeType!==Node.ELEMENT_NODE)return;
 const tag=node.tagName.toLowerCase();if(['p','h1','h2','h3','li','blockquote'].includes(tag)){blocks.push({type:tag,text:node.textContent.trim()})}
 else if(tag==='ul'||tag==='ol'){Array.from(node.children).forEach(child=>blocks.push({type:'li',text:'• '+child.textContent.trim()}))}
 else Array.from(node.childNodes).forEach(walk)}
 Array.from(holder.childNodes).forEach(walk);return blocks;
}
function buildPdfNotesScene(){
 const ctx=pdfMeasure(),width=920,maxW=width-80,layout=[];let y=107;
 for(const note of state.noteSections){const start=y;const title=(note.title||'Bez nazwy');y+=38;
  const blocks=[];for(const block of pdfNoteTextBlocks(note)){const h1=block.type==='h1',h2=block.type==='h2',fontSize=h1?23:h2?18:14,lh=h1?30:h2?26:22;
   const lines=pdfLines(ctx,block.text,maxW,`${h1||h2?700:400} ${fontSize}px Arial`);
   const h=Math.max(lh,lines.length*lh)+ (h1?13:10);blocks.push({...block,y,height:h,size:fontSize,lh});y+=h;
  }
  y+=23;layout.push({title,start,blocks});
 }
 const height=Math.max(260,y+25);
 return {width,height,breaks:layout.map(b=>b.start),draw(c){
  pdfFillRect(c,0,0,width,height,PDF_COLORS.background);pdfDrawDocumentTitle(c,'',width,'Notatki');
  for(const sec of layout){pdfText(c,sec.title,40,sec.start,{size:20,weight:750,maxWidth:maxW});c.strokeStyle=PDF_COLORS.line;c.lineWidth=1;c.beginPath();c.moveTo(40,sec.start+30);c.lineTo(width-40,sec.start+30);c.stroke();
   for(const b of sec.blocks){pdfText(c,b.text,42,b.y,{size:b.size,weight:b.type.startsWith('h')?750:400,maxWidth:maxW,lineHeight:b.lh,color:PDF_COLORS.ink})}
  }
 }};
}
function buildCanvasPdf(scenes){
 const pages=[];
 for(const scene of scenes){
  // PDF ma limit 14400 punktów na wymiar strony (około 5 m bez UserUnit).
  // Tryb "1 rozdział na stronę" skaluje cały rozdział zamiast dzielić go na kolejne strony.
  const ptScale=scene.keepOnOnePage
   ?Math.min(.75,13600/scene.width,13600/scene.height)
   :Math.min(.75,13600/scene.width);
  const maxWorldH=scene.keepOnOnePage?scene.height:Math.min(17000,13600/ptScale);
  const rasterScale=Math.min(1.6,2800/scene.width),step=Math.max(120,Math.round(1850/rasterScale));
  let from=0;
  while(from<scene.height){let to=Math.min(scene.height,from+maxWorldH);
   if(to<scene.height){const candidates=scene.breaks.filter(v=>v>from+300&&v<to);if(candidates.length)to=candidates[candidates.length-1]}
   if(to<=from)to=Math.min(scene.height,from+maxWorldH);
   const parts=[];for(let slice=from;slice<to;){const bottom=Math.min(to,slice+step),w=Math.max(1,Math.ceil(scene.width*rasterScale)),h=Math.max(1,Math.ceil((bottom-slice)*rasterScale));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
    ctx.save();ctx.scale(rasterScale,rasterScale);ctx.translate(0,-slice);scene.draw(ctx);ctx.restore();
    const base64=cv.toDataURL('image/jpeg',.9).split(',')[1];const raw=atob(base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    parts.push({bytes,w,h,top:slice-from,bottom:bottom-from});slice=bottom;cv.width=0;cv.height=0;
   }
   pages.push({width:scene.width*ptScale,height:(to-from)*ptScale,scale:ptScale,parts});from=to;
  }
 }
 if(!pages.length)throw Error('Nie ma danych do eksportu');
 const pdfObjects=new Map();let next=3;const pids=[];
 for(const page of pages){page.id=next++;page.contentId=next++;page.parts.forEach(im=>im.id=next++);pids.push(page.id)}
 pdfObjects.set(1,{text:'<< /Type /Catalog /Pages 2 0 R >>'});
 pdfObjects.set(2,{text:`<< /Type /Pages /Kids [${pids.map(n=>n+' 0 R').join(' ')}] /Count ${pages.length} >>`});
 for(const page of pages){
  const dim=n=>Number(n.toFixed(3));
  const images=page.parts.map((im,i)=>`/Im${i} ${im.id} 0 R`).join(' ');
  pdfObjects.set(page.id,{text:`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${dim(page.width)} ${dim(page.height)}] /Resources << /XObject << ${images} >> >> /Contents ${page.contentId} 0 R >>`});
  let content='';page.parts.forEach((im,i)=>{const h=(im.bottom-im.top)*page.scale,y=page.height-im.bottom*page.scale;content+=`q ${dim(page.width)} 0 0 ${dim(h)} 0 ${dim(y)} cm /Im${i} Do Q\n`});
  pdfObjects.set(page.contentId,{stream:new TextEncoder().encode(content),dict:`<< /Length ${new TextEncoder().encode(content).length} >>`});
  page.parts.forEach(im=>pdfObjects.set(im.id,{stream:im.bytes,dict:`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>`}));
 }
 const encoder=new TextEncoder(),blocks=[],offsets=[0];let total=0;
 function append(data){const bytes=typeof data==='string'?encoder.encode(data):data;blocks.push(bytes);total+=bytes.length}
 append('%PDF-1.4\n%DRABINKA\n');
 for(let id=1;id<next;id++){offsets[id]=total;const obj=pdfObjects.get(id);append(`${id} 0 obj\n`);if(obj.text)append(obj.text+'\n');else{append(obj.dict+'\nstream\n');append(obj.stream);append('\nendstream\n')}append('endobj\n')}
 const xref=total;append(`xref\n0 ${next}\n0000000000 65535 f \n`);for(let id=1;id<next;id++)append(String(offsets[id]).padStart(10,'0')+' 00000 n \n');
 append(`trailer\n<< /Size ${next} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
 return new Blob(blocks,{type:'application/pdf'});
}
