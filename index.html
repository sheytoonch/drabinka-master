/* Eksperymentalne rozdziały grafu: poziome obszary na całą szerokość planszy. */
.graph-chapter-layers{position:absolute;inset:0;z-index:1;pointer-events:none}
/* W każdym rozdziale grafu obowiązuje identyczne tło, niezależne od numeru i kolejności utworzenia. */
.graph-chapter-band{position:absolute;left:0;right:0;box-sizing:border-box;border-top:1px solid #8ca2bb6c;border-bottom:1px solid #8ca2bb6c;background:rgba(120,151,187,.055);pointer-events:none}
.graph-chapter-band.graph-chapter-gap{background:rgba(127,144,165,.025);border-top:1px solid #8ca2bb55;border-bottom:1px solid #8ca2bb55}
.graph-chapter-band.is-drop-target{background:rgba(120,175,231,.22)!important;box-shadow:inset 0 0 0 2px rgba(118,188,243,.6)}
.graph-chapter-band-head{position:absolute;top:7px;left:32px;right:15px;display:flex;align-items:center;gap:9px;min-height:23px;font:700 12px/1.25 system-ui,sans-serif;pointer-events:none}
.graph-chapter-band-head .graph-chapter-name{display:inline-block;max-width:330px;border:1px solid transparent;border-radius:4px;padding:3px 7px;color:var(--text,#dfe9f8);background:rgba(25,40,55,.4);pointer-events:auto}
.graph-chapter-band-head .graph-chapter-name[contenteditable="true"]:focus{border-color:#8ab8ea;outline:none}
.graph-chapter-band-head .graph-chapter-counter{color:var(--muted,#9aacc3);font:500 11px/1.2 system-ui,sans-serif}
.graph-chapter-band.graph-chapter-gap .graph-chapter-name{color:var(--muted,#9aacc3);font-weight:550;background:transparent}
.graph-chapter-band.graph-chapter-gap .graph-chapter-band-head{left:145px}
html[data-theme="light"] .graph-chapter-band-head .graph-chapter-name{color:#334b64;background:#ffffffd9}
html[data-theme="light"] .graph-chapter-band.graph-chapter-gap .graph-chapter-name{color:#63788f;background:transparent}
/* Naglowki rozdzialow sa wspolne dla paneli 01 / 02 / 03 (jak w widoku tabeli). */
.graph-project{position:relative}
.graph-chapter-overlays{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:visible}
.graph-chapter-banner{position:absolute;left:0;right:0;height:37px;display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);align-items:stretch;box-sizing:border-box;background:#dfe8f3;color:#26384b;border-top:2px solid #879eb7;border-bottom:1px solid #aebdd0;user-select:none}
.graph-chapter-banner-left, .graph-chapter-banner-center, .graph-chapter-banner-right{min-width:0;display:flex;align-items:center;padding:4px 10px;gap:9px}
.graph-chapter-banner-left{border-right:3px solid #8da1b9}
.graph-chapter-banner-right{border-left:3px solid #8da1b9}
.graph-chapter-banner-index{font-size:12px;font-weight:650;white-space:nowrap}
.graph-chapter-banner-name{font-size:12px;font-weight:650;min-width:80px;max-width:50%;border-radius:4px;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:text}
.graph-chapter-banner-name:focus{outline:1px solid #78addf;background:#ffffff24}
.graph-chapter-banner-count{font-size:11px;color:#657b92;white-space:nowrap}






.graph-chapter-add-slot{position:absolute;left:var(--left);right:var(--right);height:30px;display:flex;align-items:flex-start;padding:3px 0 0 15px;box-sizing:border-box;pointer-events:none;z-index:3}
.graph-chapter-add-button{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:25px;padding:0 9px;border:1px solid #6b879f79;border-radius:5px;background:#e6edf5;color:#466781;font:650 11px/1 system-ui,sans-serif;cursor:pointer;transition:background-color .15s,border-color .15s}
.graph-chapter-add-button:hover, .graph-chapter-add-button:focus-visible{background:#cfe1f4;border-color:#527eae;outline:2px solid #527eae88;outline-offset:1px}
html[data-theme="dark"] .graph-chapter-banner{background:#26384d;color:#e6edf7;border-top-color:#4b6582;border-bottom-color:#4b6079}
html[data-theme="dark"] .graph-chapter-banner-left{border-right-color:#42546c}
html[data-theme="dark"] .graph-chapter-banner-right{border-left-color:#42546c}
html[data-theme="dark"] .graph-chapter-banner-count{color:#9fb2cb}
html[data-theme="dark"] .graph-chapter-add-button{background:#233448;color:#c7d9f0;border-color:#647f9d}
html[data-theme="dark"] .graph-chapter-add-button:hover, html[data-theme="dark"] .graph-chapter-add-button:focus-visible{background:#354d68;border-color:#9fbde0}
.upper-shell.left-collapsed .graph-chapter-banner-left{padding:3px 5px}
.upper-shell.left-collapsed .graph-chapter-banner-index{font-size:10px}
.upper-shell.right-collapsed .graph-chapter-banner-right{padding:0}
/* Zwinięte pasy grafu nie powinny układać opisów i statystyk pionowo. */
.upper-shell.left-collapsed .graph-chapter-banner-left > *,
.upper-shell.right-collapsed .graph-chapter-banner-right > *,
.upper-shell.left-collapsed .graph-chapter-side-left > *,
.upper-shell.right-collapsed .graph-chapter-side-right > *{visibility:hidden}
/* Włączone rozdziały są świadomym stanem widoku: przycisk jest podświetlony.
   Wyłączony pozostaje neutralny, jak pozostałe przełączniki. */
.graph-chapters-tool[aria-pressed="false"]:not(:hover):not(:focus-visible){opacity:.6}

/* Szyna rozdziałów mieści się w pustym marginesie na początku planszy. */
.graph-chapter-rail{position:absolute;z-index:12;left:var(--left);width:25px;box-sizing:border-box;border-left:1px solid rgba(123,152,185,.43);border-right:1px solid rgba(123,152,185,.38);background:rgba(100,129,163,.075);pointer-events:none;overflow:visible}
.graph-rail-selection{position:absolute;left:2px;right:2px;border:1px solid rgba(130,192,242,.8);border-radius:5px;background:rgba(98,170,224,.17);box-sizing:border-box;display:flex;align-items:center;justify-content:center;pointer-events:none}
.graph-rail-selection::before, .graph-rail-selection::after{content:"";position:absolute;left:-3px;width:7px;height:2px;background:#9ac8ee}
.graph-rail-selection::before{top:-1px}.graph-rail-selection::after{bottom:-1px}
.graph-rail-selection button, .graph-rail-boundary-add{appearance:none;display:flex;align-items:center;justify-content:center;width:20px;height:20px;min-width:20px;min-height:20px;border:1px solid #7c9dbe;border-radius:5px;background:#314a68;color:#e9f3ff;box-shadow:0 1px 4px #0004;font:700 16px/1 system-ui,sans-serif;cursor:pointer;pointer-events:auto;padding:0}
.graph-rail-selection button:hover, .graph-rail-selection button:focus-visible, .graph-rail-boundary-add:hover, .graph-rail-boundary-add:focus-visible{background:#4779a8;border-color:#bbd9f6;outline:2px solid #8bbbee66;outline-offset:1px}
.graph-rail-selection button{position:sticky;top:45px;bottom:45px}
.graph-rail-boundary-add{position:absolute;left:2px;width:19px;height:19px;min-height:19px;font-size:15px;opacity:.8}
.graph-rail-boundary-add:hover, .graph-rail-boundary-add:focus-visible{opacity:1}
/* Miejsce na szynę w nagłówku rozdziału: przycisk nie zasłania nazwy. */
.graph-chapter-banner-center{padding-left:34px}
html[data-theme="light"] .graph-chapter-rail{background:rgba(118,163,204,.10);border-color:#a3b8d2}
html[data-theme="light"] .graph-rail-selection{background:rgba(91,154,201,.12);border-color:#699ec5}
html[data-theme="light"] .graph-rail-selection button, html[data-theme="light"] .graph-rail-boundary-add{background:#e7f1fa;color:#28517a;border-color:#7aa0c1;box-shadow:0 1px 3px #31445b33}
html[data-theme="light"] .graph-rail-selection button:hover, html[data-theme="light"] .graph-rail-boundary-add:hover{background:#c4e1f9}


/* Cztery rzeczywiste kolumny: 01 | szyna | 02 | 03. */
.upper-shell.graph-rail-integrated .upper-head, .upper-shell.graph-rail-integrated .h-rail-grid, .upper-shell.graph-rail-integrated .graph-project{
 grid-template-columns:var(--left) var(--graph-rail-width) minmax(0,1fr) var(--right);
}
.graph-rail-head, .graph-rail-scroll-spare{display:none}
.graph-rail-integrated .graph-rail-head{
 display:block;min-width:0;background:#edf1f7;border-right:2px solid #8da1b9;
}
.graph-rail-integrated .graph-rail-scroll-spare{
 display:block;min-width:0;background:#e7edf4;border-right:2px solid #8da1b9;
}
.graph-rail-integrated .panel-cap.left{border-right:0}
.graph-rail-integrated .h-rail-grid .spare:first-child{border-right:0}
.graph-rail-integrated .graph-project .chapter-left{border-right:0;padding-right:10px}
.graph-rail-integrated .graph-project .chapter-right{grid-column:4;grid-row:1}
.graph-rail-integrated .graph-project .chapter-middle{grid-column:3;grid-row:1}
.graph-rail-integrated .graph-project .chapter-left{grid-column:1;grid-row:1}
.upper-shell.graph-rail-integrated .graph-chapter-rail{
 grid-column:2;grid-row:1;align-self:stretch;position:relative;
 left:auto;right:auto;top:0;width:100%;height:100%;min-height:100%;
 z-index:12;box-sizing:border-box;border:0;border-right:2px solid #42546c;
 background:transparent;overflow:visible;pointer-events:none;
}
.upper-shell.graph-rail-integrated .graph-chapter-banner{
 grid-template-columns:var(--left) var(--graph-rail-width) minmax(0,1fr) var(--right);
}
.upper-shell.graph-rail-integrated .graph-chapter-banner-left{border-right:0}
.graph-chapter-banner-rail{display:none}
.graph-rail-integrated .graph-chapter-banner-rail{display:block;min-width:0;background:inherit;border-right:2px solid #8da1b9}
.upper-shell.graph-rail-integrated .graph-chapter-banner-center{padding-left:10px}


/* Każdy przycisk jest wyśrodkowany w szynie, a jego środek leży na krawędzi rozdziału. */
.upper-shell.graph-rail-integrated .graph-rail-boundary-add{
 left:50%;transform:translateX(-50%);width:var(--chapter-insert-gap);height:var(--chapter-insert-gap);min-height:var(--chapter-insert-gap);min-width:var(--chapter-insert-gap);
 padding:0;border:0;border-radius:50%;background:transparent;box-shadow:none;
 color:#a7c9e9;opacity:1;
}
.upper-shell.graph-rail-integrated .graph-rail-selection{
 left:2px;right:2px;width:auto;border:0;border-right:2px solid #8ac0ee;
 border-radius:0;background:linear-gradient(90deg,transparent,rgba(95,161,216,.21));box-shadow:none;
}
.upper-shell.graph-rail-integrated .graph-rail-selection button{
 position:sticky;left:auto;top:45px;bottom:45px;transform:none;
 width:22px;height:22px;min-width:22px;min-height:22px;
 background:transparent;border:0;box-shadow:none;border-radius:50%;color:#a7c9e9;
}
.upper-shell.graph-rail-integrated .graph-rail-selection button svg, .upper-shell.graph-rail-integrated .graph-rail-boundary-add svg{
 display:block;width:14px;height:14px;fill:none;stroke:currentColor;
 stroke-width:2.15px;stroke-linecap:round;pointer-events:none;
}
.upper-shell.graph-rail-integrated .graph-rail-selection button:hover, .upper-shell.graph-rail-integrated .graph-rail-selection button:focus-visible, .upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover, .upper-shell.graph-rail-integrated .graph-rail-boundary-add:focus-visible{
 background:#375775;color:#fff;outline:2px solid #8bbbee66;outline-offset:1px;
}
html[data-theme="dark"] .graph-rail-integrated .graph-rail-head{background:#1a2635;border-right-color:#42546c}
html[data-theme="dark"] .graph-rail-integrated .graph-rail-scroll-spare{background:#1d2b3c;border-right-color:#42546c}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-chapter-rail{background:transparent;border-right-color:#a0aec1}
html[data-theme="light"] .graph-rail-integrated .graph-rail-head{background:#edf1f7;border-right-color:#8da1b9}
html[data-theme="light"] .graph-rail-integrated .graph-rail-scroll-spare{background:#e7edf4;border-right-color:#8da1b9}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection{
 border-right-color:#518cbf;background:linear-gradient(90deg,transparent,rgba(75,135,185,.13));
}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add{background:transparent;color:#4579a9;border:0;box-shadow:none}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button:hover, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover{background:#d9eafa;color:#215681}

/* W grafie lewy uchwyt należy do całego bloku OPIS + szyna rozdziałów,
   więc siedzi na jego zewnętrznej prawej krawędzi. */
.upper-shell.graph-rail-integrated .panel-resizer-left{
 left:calc(var(--left) + var(--graph-rail-width));
}
.upper-shell.graph-rail-integrated .panel-resizer-left::before{
 left:5px;width:2px;background:#58718e;
}
html[data-theme="light"] .upper-shell.graph-rail-integrated .panel-resizer-left::before{background:#8da1b9}
.upper-shell.graph-rail-integrated .panel-resizer-left:hover::before, .dm-resizing .upper-shell.graph-rail-integrated .panel-resizer-left::before{background:#a6c8ec}

/* Prawdziwe, stale widoczne pionowe separatory 01|szyna|02. */
.graph-rail-integrated .graph-rail-head, .graph-rail-integrated .graph-rail-scroll-spare, .upper-shell.graph-rail-integrated .graph-chapter-rail, .graph-rail-integrated .graph-chapter-banner-rail{
 border-left:1px solid #42546c;
 border-right:2px solid #58718e;
}
html[data-theme="light"] .graph-rail-integrated .graph-rail-head, html[data-theme="light"] .graph-rail-integrated .graph-rail-scroll-spare, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-chapter-rail, html[data-theme="light"] .graph-rail-integrated .graph-chapter-banner-rail{
 border-left-color:#b4c3d6;border-right-color:#8da1b9;
}
/* Ciągłe poziome obramowania rozdziałów, również przez szynę (ta ma
   wyższą warstwę, dlatego musi odtworzyć zakryte fragmenty linii). */
.graph-rail-integrated{--graph-chapter-separator:#647e9d}
html[data-theme="light"] .graph-rail-integrated{--graph-chapter-separator:#849ab3}

.graph-rail-integrated .graph-chapter-banner{
 border-top:1px solid var(--graph-chapter-separator);
 border-bottom:1px solid var(--graph-chapter-separator);
}
html[data-theme="dark"] .graph-rail-integrated .graph-chapter-banner{
 border-top-color:var(--graph-chapter-separator);
 border-bottom-color:var(--graph-chapter-separator);
}



.upper-shell.graph-rail-integrated .graph-rail-boundary-add{
 z-index:3;
}
.upper-shell.graph-rail-integrated .graph-rail-selection{z-index:4}
/* Przyciski są symetrycznie POZA granicami rozdziału, w przerwach. */

/* v1.1.44 — spójny nagłówek rozdziału w grafie i poprawione nazwy paneli.
   Zasada: nagłówek rozdziału jest jeden i rozciąga się przez 01 + szynę + 02 + 03.
   Szyna nie rysuje własnej belki ani poziomych granic; pokazuje tylko przyciski i zaznaczenie. */
.graph-project .chapter-left, .graph-project .chapter-right{position:relative;z-index:1}
.graph-chapter-overlays{z-index:8}
.graph-chapter-banner{position:absolute;left:0;right:0;height:37px;display:grid;grid-template-columns:var(--left) var(--graph-rail-width,0px) minmax(0,1fr) var(--right);align-items:stretch;box-sizing:border-box;background:#26384d;color:#e6edf7;border-top:2px solid #4b6582;border-bottom:1px solid #4b6079;user-select:none;pointer-events:none}
.graph-chapter-banner-left, .graph-chapter-banner-rail, .graph-chapter-banner-center, .graph-chapter-banner-right{min-width:0;display:flex;align-items:center;box-sizing:border-box}
.graph-chapter-banner-left{padding:4px 10px;border-right:1px solid #42546c}
.graph-chapter-banner-rail{display:flex;justify-content:center;background:transparent;border-left:1px solid #42546c;border-right:1px solid #58718e}
.graph-chapter-banner-center{padding:4px 10px;gap:9px}
.graph-chapter-banner-right{border-left:3px solid #42546c}
.graph-chapter-banner-name{pointer-events:auto}
html[data-theme="light"] .graph-chapter-banner{background:#dfe8f3;color:#26384b;border-top-color:#879eb7;border-bottom-color:#aebdd0}
html[data-theme="light"] .graph-chapter-banner-left{border-right-color:#a9b8ca}
html[data-theme="light"] .graph-chapter-banner-rail{border-left-color:#b4c3d6;border-right-color:#8da1b9}
html[data-theme="light"] .graph-chapter-banner-right{border-left-color:#8da1b9}

.upper-shell.graph-rail-integrated .graph-rail-head, .upper-shell.graph-rail-integrated .graph-rail-scroll-spare, .upper-shell.graph-rail-integrated .graph-chapter-rail{position:relative;background:transparent;border:0!important;overflow:visible}





.upper-shell.graph-rail-integrated .graph-chapter-rail{z-index:10;pointer-events:none}
.upper-shell.graph-rail-integrated .graph-chapter-banner-rail{display:flex}
.upper-shell.graph-rail-integrated .graph-chapter-banner-left{border-right:1px solid #42546c}
.upper-shell.graph-rail-integrated .graph-chapter-banner-center{padding-left:10px}



.upper-shell.graph-rail-integrated .graph-rail-selection{left:2px;right:2px;width:auto;border:0;border-right:2px solid #8ac0ee;border-radius:0;background:linear-gradient(90deg,transparent,rgba(95,161,216,.21));box-shadow:none;z-index:4}
.upper-shell.graph-rail-integrated .graph-rail-selection button{position:sticky;left:auto;top:45px;bottom:45px;transform:none;width:22px;height:22px;min-width:22px;min-height:22px;background:transparent;border:0;box-shadow:none;border-radius:50%;color:#a7c9e9}
.upper-shell.graph-rail-integrated .graph-rail-boundary-add{left:50%;transform:translateX(-50%);width:18px;height:18px;min-width:18px;min-height:18px;padding:0;border:0;border-radius:50%;background:transparent;box-shadow:none;color:#a7c9e9;opacity:1;z-index:11;pointer-events:auto}
.upper-shell.graph-rail-integrated .graph-rail-selection button svg, .upper-shell.graph-rail-integrated .graph-rail-boundary-add svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.15px;stroke-linecap:round;pointer-events:none}
.upper-shell.graph-rail-integrated .graph-rail-selection button:hover, .upper-shell.graph-rail-integrated .graph-rail-selection button:focus-visible, .upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover, .upper-shell.graph-rail-integrated .graph-rail-boundary-add:focus-visible{background:#375775;color:#fff;outline:2px solid #8bbbee66;outline-offset:1px}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add{color:#4579a9}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-selection button:hover, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover{background:#d9eafa;color:#215681}


/* v1.1.45 — opisy i podsumowania rozdziałów w grafie (jak w klasycznej siatce). */
.graph-project .graph-chapter-overlays{z-index:8;pointer-events:none}
.graph-project .graph-chapter-banner{z-index:2}
.graph-project .graph-chapter-side{position:absolute;box-sizing:border-box;z-index:1;min-height:0;overflow:hidden;padding:10px 10px 13px;pointer-events:auto;background:#151f2d;color:#e0e9f5}
.graph-project .graph-chapter-side-left{left:0;width:var(--left);display:flex}
.graph-project .graph-chapter-side-right{right:0;width:var(--right);border-left:3px solid #42546c}
.graph-project .graph-chapter-side-left .chapter-desc{display:block;width:100%;height:100%;min-height:100%;resize:none;overflow:auto;border:1px solid transparent;background:#202d3d;padding:8px;border-radius:5px;line-height:1.45;font-family:inherit;font-size:12px;font-weight:400;color:#e2ebf7;box-sizing:border-box}
.graph-project .graph-chapter-side-left .chapter-desc:hover, .graph-project .graph-chapter-side-left .chapter-desc:focus{background:#27364a;border-color:#50637e;outline:none;box-shadow:none}
.graph-project .graph-chapter-side-right .stat{color:inherit}
.graph-chapter-banner-name:empty::before{content:attr(data-placeholder);opacity:.5;font-style:italic}
html[data-theme="light"] .graph-project .graph-chapter-side{background:#fff;color:#26384b}
html[data-theme="light"] .graph-project .graph-chapter-side-right{border-left-color:#8da1b9}
html[data-theme="light"] .graph-project .graph-chapter-side-left .chapter-desc{background:#f6f8fb;color:#41526a}
html[data-theme="light"] .graph-project .graph-chapter-side-left .chapter-desc:hover, html[data-theme="light"] .graph-project .graph-chapter-side-left .chapter-desc:focus{background:#fff;border-color:#d0d2d7}
/* Szyna nie przykrywa już jednego wspólnego nagłówka rozdziału. */
.upper-shell.graph-rail-integrated .graph-chapter-rail{z-index:7;background:transparent;pointer-events:none}
.upper-shell.graph-rail-integrated .graph-rail-selection{z-index:4}
.upper-shell.graph-rail-integrated .graph-rail-boundary-add{z-index:11}


/* Krótki krój nagłówka podsumowania pozwala zachować pełną nazwę w panelu 03. */
.graph-mode-active .upper-head .panel-cap.right .summary-cap-title{font-size:10px;letter-spacing:.45px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Podgląd nowego rozdziału — jeden pas przez panele 01, szynę, 02 i 03. */
.graph-chapter-preview[hidden]{display:none!important}
.graph-chapter-preview{position:absolute;left:0;right:0;z-index:9;pointer-events:none;box-sizing:border-box;display:grid;grid-template-columns:var(--left) var(--graph-rail-width) minmax(0,1fr) var(--right);min-height:var(--chapter-insert-gap);color:#e9f5ff;animation:graph-chapter-preview-appear .16s ease-out}
.graph-chapter-preview.is-empty{height:var(--chapter-insert-gap);background:rgba(81,144,197,.26);border-top:1px solid #8bbce6;border-bottom:1px solid #8bbce6;box-shadow:0 0 0 1px rgba(71,146,205,.13)}
.graph-chapter-preview .graph-chapter-preview-left, .graph-chapter-preview .graph-chapter-preview-rail, .graph-chapter-preview .graph-chapter-preview-middle, .graph-chapter-preview .graph-chapter-preview-right{display:flex;align-items:center;min-width:0;box-sizing:border-box}
.graph-chapter-preview .graph-chapter-preview-left{padding:3px 10px;border-right:1px solid #7293b7}
.graph-chapter-preview .graph-chapter-preview-rail{border-right:1px solid #7293b7}
.graph-chapter-preview .graph-chapter-preview-middle{padding:3px 10px;font-size:12px;font-weight:650;gap:8px}
.graph-chapter-preview .graph-chapter-preview-right{border-left:2px solid #7293b7}
.graph-chapter-preview.is-range{background:rgba(86,165,217,.04);border:1px solid rgba(119,195,242,.73);box-shadow:inset 0 0 0 1px rgba(119,195,242,.11)}
.graph-chapter-preview.is-range .graph-chapter-preview-head{position:absolute;left:0;right:0;bottom:100%;height:34px;display:grid;grid-template-columns:var(--left) var(--graph-rail-width) minmax(0,1fr) var(--right);background:rgba(42,79,117,.93);border:1px solid #8bbce6;border-bottom:0;box-sizing:border-box;align-items:stretch}
.graph-chapter-preview.is-range .graph-chapter-preview-head .graph-chapter-preview-middle{font-weight:700}
.graph-node.graph-chapter-preview-member{z-index:7!important}
.graph-node.graph-chapter-preview-member .tile{outline:2px solid color-mix(in srgb,var(--tile-accent) 86%,#f5faff);outline-offset:3px;box-shadow:0 0 0 5px rgba(105,176,224,.18)}
.graph-node.graph-chapter-preview-member::before{content:"";position:absolute;inset:-5px;border-radius:8px;box-shadow:0 0 0 1px rgba(136,194,244,.45);pointer-events:none}
@keyframes graph-chapter-preview-appear{from{opacity:0}to{opacity:1}}
html[data-theme="light"] .graph-chapter-preview{color:#274a69}
html[data-theme="light"] .graph-chapter-preview.is-empty{background:rgba(89,157,205,.22);border-color:#5d9cc8}
html[data-theme="light"] .graph-chapter-preview.is-range{background:rgba(80,155,207,.09);border-color:#5d9cc8}
html[data-theme="light"] .graph-chapter-preview.is-range .graph-chapter-preview-head{background:rgba(210,235,250,.96);border-color:#5d9cc8}
@media(prefers-reduced-motion:reduce){.graph-chapter-preview{animation:none}}


/* Jedna dwupikselowa granica rozdziału ponad panelami 01, 02 i 03. */
.graph-rail-integrated .graph-chapter-band:not(.graph-chapter-gap){border-bottom:0}
.graph-rail-integrated .graph-chapter-band.graph-chapter-gap{border-top:0}


/* v1.1.77 — pionowa szyna rozdziałów ma dokładnie szerokość przerwy
   między kafelkami (18 px). Wszystkie kolumny i pozycje + czytają tę samą
   właściwość --dm-graph-rail-width; usuwa to pozostawione 28 px. */
.upper-shell.graph-rail-integrated .graph-rail-selection{
 left:1px;right:1px;
}
.upper-shell.graph-rail-integrated .graph-rail-selection button{
 width:16px;min-width:16px;height:16px;min-height:16px;
}
.upper-shell.graph-rail-integrated .graph-rail-selection button svg{
 width:14px;height:14px;
}

/* v1.1.76 — przycisk mieści się wewnątrz 18-pikselowej przerwy.
   Szerokość szyny i wysokość przerwy są teraz takie same. */
.upper-shell.graph-rail-integrated .graph-rail-boundary-add{
 left:50%;transform:translateX(-50%);
 width:var(--chapter-insert-gap);min-width:var(--chapter-insert-gap);
 height:var(--chapter-insert-gap);min-height:var(--chapter-insert-gap);
 box-sizing:border-box;margin:0;padding:0;
 border:1px solid transparent;border-radius:50%;
 background:transparent;box-shadow:none;
 display:grid;place-items:center;
 z-index:11;
}
.upper-shell.graph-rail-integrated .graph-rail-boundary-add svg{
 width:13px;height:13px;stroke-width:2px;
}
.upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover, .upper-shell.graph-rail-integrated .graph-rail-boundary-add:focus-visible{
 border-color:currentColor;background:rgba(128,172,216,.17);
 outline:none;outline-offset:0;
}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover, html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add:focus-visible{
 background:rgba(76,135,193,.14);
}



/* v1.1.79 — sam znak + również podczas najechania. Bez okręgu
   i podwójnego plusa w podglądzie; fokus klawiatury pozostaje widoczny. */
.upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover {
 border-color:transparent;
 border-radius:0;
 background:transparent;
 box-shadow:none;
 outline:none;
 color:#e4f3ff;
}
html[data-theme="light"] .upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover {
 background:transparent;
 border-color:transparent;
 color:#285b87;
}

/* v1.1.49 — jeden prawy separator zamiast kilku nakładających się krawędzi. */
.graph-mode-active .graph-project>.chapter-right, .graph-mode-active .graph-project .graph-chapter-side-right, .graph-mode-active .graph-project .graph-chapter-banner-right, .graph-mode-active .graph-project .graph-chapter-preview-right{
 border-left:0!important;
}



.graph-mode-active .upper-head .panel-cap.right, .graph-mode-active .upper-shell .h-rail-grid .spare:last-child{border-left-width:2px}

/* Nagłówek rozdziału rozdziela się od treści zmianą tła, bez osobnej mocnej kreski. */
.graph-mode-active .graph-project .graph-chapter-banner, html[data-theme="dark"] .graph-mode-active .graph-project .graph-chapter-banner{
 border-bottom:0!important;
}
/* W pustym rozdziale pole opisu nie wygląda jak dodatkowa ramka; nadal jest edytowalne. */
.graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc:placeholder-shown{
 background:transparent;
 border-color:transparent;
 overflow:hidden;
 box-shadow:none;
}
.graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc::placeholder{color:#8293a9;opacity:.65}
.graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc:placeholder-shown:hover{
 background:rgba(129,157,188,.055);
}
.graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc:focus{
 overflow:auto;
 background:#27364a;
 border-color:#50637e;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc:focus{
 background:#fff;
 border-color:#b4c5d6;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc::placeholder{color:#70839a}


/* v1.1.50: jedna para ciągłych krawędzi rozdziału, z jednej nakładki.
   Dawne obramowania pasów planszy i tła rozdziałów zachowywały się jak
   dodatkowe linie i dawały różną grubość na styku paneli. */
.graph-mode-active .graph-project .graph-chapter-band, .graph-mode-active .graph-project .graph-chapter-band.graph-chapter-gap, .graph-mode-active .graph-project .graph-chapter-banner, html[data-theme="dark"] .graph-mode-active .graph-project .graph-chapter-banner{
 border-top:0!important;
 border-bottom:0!important;
}

/* Linie leżą nad stałym separatorem prawego panelu, by w żadnym punkcie
   nie znikały na krawędziach kolumn. */



/* v1.1.51 — jedna geometria granic rozdziałów i paneli.
   Pionowe separatory należą wyłącznie do upper-shell, poziome wyłącznie
   do graph-chapter-geometry; nagłówki, podsumowania i pasy nie rysują linii. */
.upper-shell.graph-rail-integrated{
 position:relative;
 --graph-frame-edge:#58718e;
 --graph-frame-inner:#42546c;
 --graph-frame-chapter:#647e9d;
}
html[data-theme="light"] .upper-shell.graph-rail-integrated{
 --graph-frame-edge:#8da1b9;
 --graph-frame-inner:#b4c3d6;
 --graph-frame-chapter:#849ab3;
}
/* Jedna warstwa przez całą wysokość górnego interfejsu, bez kawałków
   w nagłówkach, rozdziałach, szynie ani stopce poziomego scrolla. */
.upper-shell.graph-rail-integrated::before{
 content:"";
 position:absolute;
 inset:0;
 z-index:28;
 pointer-events:none;
 background-image:
  linear-gradient(var(--graph-frame-inner),var(--graph-frame-inner)),
  linear-gradient(var(--graph-frame-edge),var(--graph-frame-edge)),
  linear-gradient(var(--graph-frame-edge),var(--graph-frame-edge));
 background-repeat:no-repeat;
 background-size:1px 100%,2px 100%,2px 100%;
 background-position:
  calc(var(--left) - 1px) 0,
  calc(var(--left) + var(--graph-rail-width) - 2px) 0,
  calc(100% - var(--right) - var(--scrollbar-space)) 0;
}
/* Wszystkie stare źródła pionowych linii są wyłączone, separator jest jeden. */
.graph-mode-active .upper-shell.graph-rail-integrated .panel-cap.left,
.graph-mode-active .upper-shell.graph-rail-integrated .panel-cap.right,
.graph-mode-active .upper-shell.graph-rail-integrated .h-rail-grid .spare,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-rail-head,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-rail-scroll-spare,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-rail,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-project>.chapter-left,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-project>.chapter-right,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-banner-left,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-banner-rail,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-banner-right,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-side-left,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-side-right,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-preview-left,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-preview-rail,
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-preview-right{
 border-left:0!important;
 border-right:0!important;
}
.graph-mode-active .upper-shell.graph-rail-integrated .graph-chapter-rail{
 background:transparent;
 z-index:7;
 pointer-events:none;
 overflow:visible;
}
/* Uchwyt przeciągania pozostaje aktywny, lecz nie dodaje kolejnej stałej kreski. */
.graph-mode-active .upper-shell.graph-rail-integrated .panel-resizer-left::before,
.graph-mode-active .upper-shell.graph-rail-integrated .panel-resizer-right::before{
 background:transparent;
}
.graph-mode-active .upper-shell.graph-rail-integrated .panel-resizer-left:hover::before,
.graph-mode-active .upper-shell.graph-rail-integrated .panel-resizer-right:hover::before,
.dm-resizing .graph-mode-active .upper-shell.graph-rail-integrated .panel-resizer::before{
 background:rgba(180,216,248,.7);
}
/* Jeden geometryczny rysunek poziomych granic rozdziałów,
   oparty na dokładnie tych samych sections co kafelki, opisy i przyciski. */
.graph-mode-active .graph-project .graph-chapter-geometry{
 position:absolute;
 inset:0;
 z-index:19;
 overflow:visible;
 pointer-events:none;
}
.graph-mode-active .graph-project .graph-chapter-geometry-line{
 position:absolute;
 left:0;
 right:0;
 height:2px;
 background:var(--graph-frame-chapter,#647e9d);
 box-shadow:none;
 border:0;
 pointer-events:none;
}
.graph-mode-active .graph-project .graph-chapter-band,
.graph-mode-active .graph-project .graph-chapter-band.graph-chapter-gap,
.graph-mode-active .graph-project .graph-chapter-banner{
 border-top:0!important;
 border-bottom:0!important;
 box-shadow:none;
}
/* Panel rozdziału pozostaje treścią, nie generatorem separatorów. */
.graph-mode-active .graph-project .graph-chapter-overlays{
 z-index:8;
 pointer-events:none;
}
.graph-mode-active .graph-project .graph-chapter-banner{
 background:#26384d;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner{
 background:#dfe8f3;
}
.graph-mode-active .graph-project .graph-chapter-preview{
 z-index:20;
}
/* Plusy w szynie są klikalne przez transparentne warstwy nad nimi. */
.graph-mode-active .graph-project .graph-rail-boundary-add{
 pointer-events:auto;
}

/* v1.1.54: biblioteka etykiet zachowuje stały tor przewijania,
   a wszystkie główne scrollbary korzystają z jednego stylu. */
.dock-scroll{overflow-y:scroll;scrollbar-gutter:stable}
.dock-toggle{right:31px}
.dock.is-collapsed .dock-toggle{right:8px}

.upper-scroll,
.dock-scroll,
.chapter-left .chapter-desc,
.notes-list,
.notes-editor,
.thread-filter-list,
.h-rail{
  scrollbar-width:auto;
}
.upper-scroll::-webkit-scrollbar,
.dock-scroll::-webkit-scrollbar,
.chapter-left .chapter-desc::-webkit-scrollbar,
.notes-list::-webkit-scrollbar,
.notes-editor::-webkit-scrollbar,
.thread-filter-list::-webkit-scrollbar{
  width:12px;
  height:12px;
  background:#e3eaf3;
}
.upper-scroll::-webkit-scrollbar-track,
.dock-scroll::-webkit-scrollbar-track,
.chapter-left .chapter-desc::-webkit-scrollbar-track,
.notes-list::-webkit-scrollbar-track,
.notes-editor::-webkit-scrollbar-track,
.thread-filter-list::-webkit-scrollbar-track{
  background:#e3eaf3;
}
.upper-scroll::-webkit-scrollbar-thumb,
.dock-scroll::-webkit-scrollbar-thumb,
.chapter-left .chapter-desc::-webkit-scrollbar-thumb,
.notes-list::-webkit-scrollbar-thumb,
.notes-editor::-webkit-scrollbar-thumb,
.thread-filter-list::-webkit-scrollbar-thumb{
  background:#7994b0;
  border-radius:6px;
  border:0;
}
html[data-theme="dark"] .upper-scroll::-webkit-scrollbar,
html[data-theme="dark"] .dock-scroll::-webkit-scrollbar,
html[data-theme="dark"] .chapter-left .chapter-desc::-webkit-scrollbar,
html[data-theme="dark"] .notes-list::-webkit-scrollbar,
html[data-theme="dark"] .notes-editor::-webkit-scrollbar,
html[data-theme="dark"] .thread-filter-list::-webkit-scrollbar{
  background:#243449;
}
html[data-theme="dark"] .upper-scroll::-webkit-scrollbar-track,
html[data-theme="dark"] .dock-scroll::-webkit-scrollbar-track,
html[data-theme="dark"] .chapter-left .chapter-desc::-webkit-scrollbar-track,
html[data-theme="dark"] .notes-list::-webkit-scrollbar-track,
html[data-theme="dark"] .notes-editor::-webkit-scrollbar-track,
html[data-theme="dark"] .thread-filter-list::-webkit-scrollbar-track{
  background:#243449;
}
html[data-theme="dark"] .upper-scroll::-webkit-scrollbar-thumb,
html[data-theme="dark"] .dock-scroll::-webkit-scrollbar-thumb,
html[data-theme="dark"] .chapter-left .chapter-desc::-webkit-scrollbar-thumb,
html[data-theme="dark"] .notes-list::-webkit-scrollbar-thumb,
html[data-theme="dark"] .notes-editor::-webkit-scrollbar-thumb,
html[data-theme="dark"] .thread-filter-list::-webkit-scrollbar-thumb{
  background:#667f9c;
}
@supports (-moz-appearance:none){
  .upper-scroll,
  .dock-scroll,
  .chapter-left .chapter-desc,
  .notes-list,
  .notes-editor,
  .thread-filter-list{
    scrollbar-color:#7994b0 #e3eaf3;
  }
  html[data-theme="dark"] .upper-scroll,
  html[data-theme="dark"] .dock-scroll,
  html[data-theme="dark"] .chapter-left .chapter-desc,
  html[data-theme="dark"] .notes-list,
  html[data-theme="dark"] .notes-editor,
  html[data-theme="dark"] .thread-filter-list{
    scrollbar-color:#667f9c #243449;
  }
}

/* v1.1.55: przyciski paneli mają własne miejsce w nagłówkach,
   także po zwężeniu lub zwinięciu panelu. */
.upper-head > .panel-cap.left,
.upper-head > .panel-cap.right{
  display:grid!important;
  grid-template-columns:minmax(0,1fr) 23px;
  column-gap:6px;
  align-items:start!important;
  justify-content:initial;
  overflow:hidden;
}
.upper-head > .panel-cap.left > .panel-cap-label,
.upper-head > .panel-cap.right > .panel-cap-label{
  grid-column:1;
  width:100%;
  min-width:0;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap;
  line-height:23px;
}
.upper-head > .panel-cap.left > .panel-toggle,
.upper-head > .panel-cap.right > .panel-toggle{
  grid-column:2;
  grid-row:1;
  justify-self:end;
}
.upper-head .panel-cap.center-cap > .board-cap-title{
  flex:0 1 auto;
  min-width:0;
  max-width:100%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.upper-shell.left-collapsed .upper-head > .panel-cap.left,
.upper-shell.right-collapsed .upper-head > .panel-cap.right{
  grid-template-columns:minmax(0,1fr);
  justify-content:initial;
}
.upper-shell.left-collapsed .upper-head > .panel-cap.left > .panel-toggle,
.upper-shell.right-collapsed .upper-head > .panel-cap.right > .panel-toggle{
  grid-column:1;
}


/* 1.1.58 — one divider between adjacent tracks. */
.graph-mode-active .graph-board .graph-lane{background-image:none!important;border:0!important}
.graph-mode-active .graph-board .empty-lane{border-left:0!important;border-right:0!important}
.graph-track-dividers{position:absolute;inset:0;z-index:0;pointer-events:none}
.graph-track-divider{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(122,150,181,.43) 0 1px,transparent 1px 18px)}
html[data-theme="light"] .graph-track-divider{background:repeating-linear-gradient(to bottom,rgba(80,107,138,.37) 0 1px,transparent 1px 18px)}
/* Headers are the collapse controls; no icon buttons. */
.upper-head .panel-cap.left[data-panel-header],.upper-head .panel-cap.right[data-panel-header]{cursor:pointer;user-select:none;transition:background-color .14s}
.upper-head .panel-cap.left[data-panel-header]:hover,.upper-head .panel-cap.right[data-panel-header]:hover{background:rgba(110,160,210,.10)}
.upper-head [data-panel-header]:focus-visible,.dock-mini-title[data-panel-header]:focus-visible{outline:1px solid #9dbce1;outline-offset:-2px;border-radius:2px}
.upper-shell.left-collapsed .panel-cap.left .panel-cap-label,.upper-shell.right-collapsed .panel-cap.right .panel-cap-label{display:block;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:1;font-size:inherit}
/* The label palette has a clickable header in both expanded and collapsed modes. */
.dock .dock-mini-title{display:flex;align-items:center;top:0;left:0;right:0;height:29px;padding:0 12px;cursor:pointer;user-select:none;pointer-events:auto;z-index:6;background:var(--dock-header-bg,rgba(33,46,64,.30))}
.dock .dock-mini-title:hover{background:rgba(110,160,210,.16)}
.dock:not(.is-collapsed) .dock-scroll{padding-top:37px}
.dock .dock-toggle{display:none!important}
.dock.is-collapsed .dock-mini-title{height:27px}
.graph-chapter-preview.is-range .graph-chapter-preview-head{top:0;bottom:auto}

/* v1.1.59: Cała belka rozdziału przechwytuje kliknięcia; edycja nazwy
   uruchamiana wyłącznie dwuklikiem. Separatory i numer rozdziału bez zmian. */
.graph-mode-active .graph-project .graph-chapter-banner{
  pointer-events:auto;
  cursor:text;
}
.graph-mode-active .graph-project .graph-chapter-banner-name{
  pointer-events:auto;
  cursor:text;
}
.graph-mode-active .graph-project .graph-chapter-banner-name:not([contenteditable="true"]){
  user-select:none;
}
.graph-mode-active .graph-project .graph-chapter-banner-name[contenteditable="true"]{
  user-select:text;
  cursor:text;
}
/* Puste pola opisu mają taki sam wygląd i miejsce jak pola z tekstem. */
.graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc{
  background:#202d3d;
  border:1px solid transparent;
  overflow:auto;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-side-left .chapter-desc{
  background:#f6f8fb;
  border:1px solid transparent;
}


/* v1.1.59 — czytelny podgląd fizycznego miejsca wstawienia rozdziału. */
.graph-project .graph-chapter-preview.is-empty{
  display:block;
  min-height:82px;
  border:1px solid #8bbce6;
  background:rgba(75,140,195,.13);
  box-shadow:0 0 0 1px rgba(75,140,195,.13);
}
.graph-project .graph-chapter-preview-row{
  display:grid;grid-template-columns:var(--left) var(--graph-rail-width) minmax(0,1fr) var(--right);
  height:37px;box-sizing:border-box;align-items:stretch;
  background:rgba(60,113,160,.45);
  border-bottom:1px solid #8bbce6;
}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty{background:rgba(89,157,205,.11)}
html[data-theme="light"] .graph-project .graph-chapter-preview-row{background:rgba(89,157,205,.27)}
.graph-project .graph-chapter-preview-shift{
  transform:translateY(110px)!important;
  transition:transform .16s ease-out!important;
}
.graph-project.graph-chapter-preview-insert .graph-wires{opacity:.13;transition:opacity .15s}
@media(prefers-reduced-motion:reduce){.graph-project .graph-chapter-preview-shift{transition:none!important}}


/* v1.1.60: przyciski przewijania są zawsze widoczne, a sam pasek
   ma dokładnie 15 px i używa tych samych kolorów co pionowy scrollbar 02. */
.h-rail-wrap .h-rail-arrow{
 position:absolute;top:0;z-index:2;display:grid;place-items:center;
 width:15px;height:15px;padding:0;margin:0;border:0;border-radius:0;
 background:#edf2f7;color:#7994b0;cursor:pointer;
}
.h-rail-arrow[data-h-rail-step="-1"]{left:0}
.h-rail-arrow[data-h-rail-step="1"]{right:0}
.h-rail-arrow svg{display:block;width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.h-rail-wrap .h-rail-arrow:hover:not(:disabled){background:#cfdeee;color:#4c6582}
.h-rail-wrap .h-rail-arrow:disabled{color:#a9b8c9;cursor:default}
.h-rail-wrap .h-rail-arrow:focus-visible{outline:1px solid #6ba4dd;outline-offset:-2px}
html[data-theme="dark"] .h-rail-wrap .h-rail-arrow{background:#1b2a3b;color:#9aadc1}
html[data-theme="dark"] .h-rail-wrap .h-rail-arrow:hover:not(:disabled){background:#314963;color:#e5eff9}
html[data-theme="dark"] .h-rail-wrap .h-rail-arrow:disabled{color:#465c73}

:root{--dm-graph-rail-width:var(--graph-node-gap)}
/* v1.1.65: widoczny fokus dla klawiatury, bez zmian interakcji myszą. */
:where(button,[role="button"],[tabindex],input,textarea,.tile):focus-visible{outline:2px solid #9cd1ff!important;outline-offset:2px!important;box-shadow:0 0 0 1px #162b4d!important}
html[data-theme="light"] :where(button,[role="button"],[tabindex],input,textarea,.tile):focus-visible{outline-color:#1b65ac!important;box-shadow:0 0 0 1px #fff!important}
:where(.edit-input,[contenteditable="true"]):focus-visible{outline:2px solid #9cd1ff!important;outline-offset:1px!important}

/* v1.1.75: Wstępne miejsce dla nowego pustego rozdziału ma tę samą grubość,
   co zwykła przerwa między kafelkami. */
.graph-project .graph-chapter-preview.is-empty.is-compact{
 display:flex;align-items:center;box-sizing:border-box;
 min-height:0;height:var(--chapter-insert-gap);
 border:1px dashed #8bbce6;border-left:0;border-right:0;
 background:rgba(75,140,195,.23);box-shadow:none;
}
.graph-project .graph-chapter-preview.is-empty.is-compact .graph-chapter-preview-compact-label{
 display:block;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
 margin-left:calc(var(--left) + var(--graph-rail-width) + 8px);
 margin-right:6px;font-size:10px;font-weight:600;line-height:1.1;color:#d1e9ff;
}
/* Przyleganie do rozdziału bez drugiej, nakładającej się linii. */
.graph-project .graph-chapter-preview.is-empty.is-compact.is-attached-after{border-top:0}
.graph-project .graph-chapter-preview.is-empty.is-compact.is-attached-before{border-bottom:0}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty.is-compact{
 background:rgba(89,157,205,.20);border-color:#5d9cc8;
}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty.is-compact .graph-chapter-preview-compact-label{color:#315b7f}

/* Lekki podgląd bez trzeciej, przerywanej granicy nad istniejącymi liniami. */
.graph-project .graph-chapter-preview.is-empty.is-compact{
 border:0;
 background:rgba(75,140,195,.11);
}
html[data-theme="light"] .graph-project .graph-chapter-preview.is-empty.is-compact{
 background:rgba(89,157,205,.10);
}


/* v1.1.80 — podgląd pustego rozdziału: jednorodna płaszczyzna bez kreski
   przebijającej spodem ani obramowania (oba motywy). */
.graph-mode-active .graph-project .graph-chapter-preview.is-empty.is-compact{
 border:0!important;box-shadow:none!important;
 background:#253b52!important;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-preview.is-empty.is-compact{
 background:#dbeaf5!important;
}
/* Kosz jest w wierszu numeru rozdziału, ponad tytułem.
   Tytuł otrzymuje pełną szerokość kolumny OPIS. */
.graph-chapter-inspector-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px;margin-bottom:3px}
.graph-mode-active .graph-project .graph-chapter-inspector-heading .graph-chapter-inspector-eyebrow{margin-bottom:0}
.graph-chapter-delete{
 width:22px;height:22px;min-width:22px;flex:none;display:grid;place-items:center;
 background:transparent;border:1px solid transparent;border-radius:5px;
 color:#9cadbe;padding:3px;cursor:pointer;
}
.graph-chapter-delete svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.graph-chapter-delete:hover{background:#ad4b4b26;color:#ffb2b2;border-color:#d57b7b55}
html[data-theme="light"] .graph-chapter-delete{color:#647e99}
html[data-theme="light"] .graph-chapter-delete:hover{background:#fbe2e2;color:#a93645;border-color:#df9b9b}

/* v1.1.69 — minimalistyczne znaczniki rozdziałów i pojedynczy inspektor.
   Dane/relacje nie zmieniają się; widoczny opis zależy od wyboru użytkownika. */
.graph-mode-active .graph-project .graph-chapter-banner{
 height:31px;display:block;left:0;right:0;background:transparent!important;
 pointer-events:none!important;box-shadow:none!important;border:0!important;
 z-index:10;
}
/* v1.1.70 — numer i nazwa to zwykła typografia, bez wyglądu przycisku. */
.graph-mode-active .graph-project .graph-chapter-banner-chip{
 position:absolute;top:6px;
 left:calc(var(--left) + var(--graph-rail-width,0px) + 11px);
 min-height:21px;max-width:min(420px,calc(100% - var(--left) - var(--graph-rail-width,0px) - var(--right) - 24px));
 display:inline-flex;gap:6px;align-items:center;padding:0;
 box-sizing:border-box;border:0;border-radius:0;
 background:transparent;color:#a4b7ca;box-shadow:none;
 pointer-events:auto;cursor:pointer;font-size:10px;font-weight:650;letter-spacing:.65px;line-height:18px;text-transform:uppercase;
}
.graph-mode-active .graph-project .graph-chapter-banner-chip:hover{
 background:transparent;border-color:transparent;color:#dce9f6;
}
.graph-mode-active .graph-project .graph-chapter-banner-chip.is-active{
 background:transparent;border-color:transparent;color:#e6edf7;font-weight:700;
}
.graph-mode-active .graph-project .graph-chapter-banner-index{
 display:inline;flex:none;min-width:0;height:auto;
 padding:0;border:0;border-radius:0;background:transparent;
 color:inherit;font-size:10px;font-weight:650;letter-spacing:inherit;
}
.graph-mode-active .graph-project .graph-chapter-banner-chip.is-active .graph-chapter-banner-index{color:inherit}
.graph-mode-active .graph-project .graph-chapter-banner-name{
 display:inline-block;min-width:0;max-width:100%;padding:0;
 font-size:inherit;font-weight:inherit;line-height:18px;letter-spacing:inherit;
 color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.graph-mode-active .graph-project .graph-chapter-banner-name[contenteditable="true"]{
 min-width:95px;cursor:text;user-select:text;outline:1px solid #9bd2ff!important;
}
.graph-mode-active .graph-project .graph-chapter-banner-chip:focus-visible{
 outline:2px solid #9bd2ff!important;outline-offset:2px!important;
}
/* v1.1.78: Poziome granice rozdziałów przebiegają również przez szynę +.
   Jedna linia od lewego brzegu szyny do prawego panelu, bez osobnych nakładek. */
.graph-mode-active .graph-project .graph-chapter-geometry-line{
 left:var(--left);right:var(--right);
 height:1px;background:rgba(119,151,184,.75);box-shadow:none;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-chip{
 background:transparent;color:#566c85;border-color:transparent;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-chip:hover{
 background:transparent;color:#334f6a;border-color:transparent;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-chip.is-active{
 background:transparent;color:#304f6e;border-color:transparent;font-weight:700;
}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-index{color:inherit}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-banner-chip.is-active .graph-chapter-banner-index{color:inherit}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-geometry-line{background:rgba(101,133,166,.67)}
.graph-mode-active .graph-project >.chapter-left,
.graph-mode-active .graph-project >.chapter-right{align-content:start;min-height:0;padding:10px 9px}
.graph-mode-active .graph-project .graph-chapter-inspector{
 position:sticky;top:9px;width:100%;min-width:0;align-self:flex-start;
 max-height:calc(100dvh - 320px);overflow-y:auto;overflow-x:hidden;
 scrollbar-width:thin;box-sizing:border-box;
}
.graph-mode-active .graph-project .graph-chapter-inspector-eyebrow{
 text-transform:uppercase;letter-spacing:.6px;font-size:9px;font-weight:650;
 color:#92afce;margin-bottom:4px;
}
.graph-mode-active .graph-project .graph-chapter-inspector-title{
 font-weight:700;font-size:12px;line-height:1.4;color:#edf4ff;
 overflow-wrap:anywhere;margin-bottom:11px;
}
.graph-mode-active .graph-project .graph-chapter-inspector-field{
 display:block;color:#9eb5ce;font-size:10px;margin-bottom:5px;
}
.graph-mode-active .graph-project .graph-chapter-inspector .chapter-desc{
 display:block;min-height:132px;height:clamp(132px,26vh,330px);width:100%;
 padding:9px;resize:vertical;overflow:auto;border:1px solid #3d5065;border-radius:6px;
 background:#202d3d;color:#e1ebf6;line-height:1.45;font-size:12px;
}
.graph-mode-active .graph-project .graph-chapter-inspector .chapter-desc:focus-visible{outline:2px solid #8bc2f4!important}
.graph-mode-active .graph-project .graph-chapter-inspector-count{
 font-size:10px;color:#aac0d7;margin:-4px 0 10px;
}
.graph-mode-active .graph-project .graph-chapter-inspector .stat{display:flex;min-width:0}
.graph-mode-active .graph-project .graph-chapter-inspector .stat>span{min-width:0;overflow-wrap:anywhere}
.graph-mode-active .graph-project .graph-chapter-inspector-empty{font-size:11px;color:#95a9bf;line-height:1.4}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector-eyebrow,
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector-field{color:#607993}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector-title{color:#243b56}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector-count{color:#69819b}
html[data-theme="light"] .graph-mode-active .graph-project .graph-chapter-inspector .chapter-desc{
 background:#f4f7fb;color:#283d56;border-color:#c7d5e3;
}
.upper-shell.left-collapsed .graph-chapter-inspector-left,
.upper-shell.right-collapsed .graph-chapter-inspector-right{display:none!important}

/* v1.1.82: prowadnice pozostają na planszy, ale nie wystają obok nagłówków wątków. */
.graph-mode-active .head-shift .thread-guides{display:none}
/* Panel OPIS: tekst wykorzystuje całą przestrzeń pomiędzy tytułem i dołem planszy.
   Jego wysokość jest aktualizowana na podstawie faktycznej wysokości .upper-scroll. */
.graph-mode-active .graph-project .graph-chapter-inspector-left{
 display:flex;flex-direction:column;
 height:var(--graph-inspector-height,300px);max-height:none;
 overflow:hidden;
}
.graph-mode-active .graph-project .graph-chapter-inspector-left > .graph-chapter-inspector-heading,
.graph-mode-active .graph-project .graph-chapter-inspector-left > .graph-chapter-inspector-title{
 flex:none;
}
.graph-mode-active .graph-project .graph-chapter-inspector-left .chapter-desc{
 flex:1 1 auto;min-height:0;height:auto;
 resize:none;overflow-y:auto;overflow-x:hidden;
 scrollbar-gutter:stable;
}

/* v1.1.86 — edycja nazwy rozdziału w panelu OPIS, wygląd nadal tekstowy. */
.graph-mode-active .graph-project .graph-chapter-inspector-title[data-graph-chapter-inspector-name]{cursor:text}
.graph-mode-active .graph-project .graph-chapter-inspector-title[data-graph-chapter-inspector-name]:focus-visible{
 outline:1px solid #9bcdf5!important;outline-offset:2px;
}
.graph-mode-active .graph-project .graph-chapter-inspector-name-input{
 display:block;width:100%;min-width:0;box-sizing:border-box;
 margin:0;padding:0;color:inherit;background:transparent;
 font:inherit;font-size:inherit;font-weight:inherit;line-height:inherit;
 border:0;border-bottom:1px solid #9bcdf5;border-radius:0;
 box-shadow:none;outline:none!important;
}
.graph-mode-active .graph-project .graph-chapter-inspector-name-input:focus{
 box-shadow:0 1px 0 #9bcdf5!important;
}

/* v1.1.85 — schowaj sam symbol + przy najechaniu na obszar jego położenia.
   Przycisk pozostaje w DOM i zachowuje rozmiar, więc nadal można kliknąć. */
.upper-shell.graph-rail-integrated .graph-rail-selection{pointer-events:auto}
.upper-shell.graph-rail-integrated .graph-rail-selection:hover button:not(:focus-visible) svg,
.upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover:not(:focus-visible) svg{
 opacity:0;
}
/* Dla obsługi klawiaturą zachowaj czytelny plus przy widocznym fokusie. */
.upper-shell.graph-rail-integrated .graph-rail-selection button:focus-visible svg,
.upper-shell.graph-rail-integrated .graph-rail-boundary-add:focus-visible svg{opacity:1}
/* Najechanie nie tworzy dodatkowego tła ani obwódki przycisku. */
.upper-shell.graph-rail-integrated .graph-rail-selection button:hover:not(:focus-visible),
.upper-shell.graph-rail-integrated .graph-rail-boundary-add:hover:not(:focus-visible){
 background:transparent;border-color:transparent;box-shadow:none;outline:none;
}

/* v1.1.91 — siatka korzysta z osobnej, nieruchomej szyny 18 px.
   Graf pozostaje nietknięty. Nie rysujemy linii osobno w każdym wierszu. */
.upper-shell.grid-rail-integrated{
 --grid-rail-width:var(--dm-graph-rail-width,18px);
 --grid-rail-edge:#58718e;
 --grid-rail-inner:#42546c;
 position:relative;
}
html[data-theme="light"] .upper-shell.grid-rail-integrated{
 --grid-rail-edge:#8da1b9;--grid-rail-inner:#b4c3d6;
}
.upper-shell.grid-rail-integrated .upper-head,
.upper-shell.grid-rail-integrated .h-rail-grid,
.upper-shell.grid-rail-integrated .chapter{
 grid-template-columns:var(--left) var(--grid-rail-width) minmax(0,1fr) var(--right);
}
.upper-shell.grid-rail-integrated .chapter>.chapter-left{grid-column:1;grid-row:2;border-right:0}
.upper-shell.grid-rail-integrated .chapter>.grid-chapter-rail{grid-column:2;grid-row:2}
.upper-shell.grid-rail-integrated .chapter>.chapter-middle{grid-column:3;grid-row:2}
.upper-shell.grid-rail-integrated .chapter>.chapter-right{grid-column:4;grid-row:2;border-left:0}
.upper-shell.grid-rail-integrated .chapter{position:relative}
.upper-shell.grid-rail-integrated .chapter-bar{grid-column:1/-1;grid-row:1}
.upper-shell.grid-rail-integrated .chapter-bar .chapter-seg.left{border-right:0}
.upper-shell.grid-rail-integrated .chapter-bar .chapter-seg.right{border-left:0}
.upper-shell.grid-rail-integrated .chapter-bar .chapter-seg.middle{padding-left:calc(var(--grid-rail-width) + 10px)}
.upper-shell.grid-rail-integrated .panel-cap.left,
.upper-shell.grid-rail-integrated .h-rail-grid>.spare:first-child{border-right:0}
.upper-shell.grid-rail-integrated .panel-cap.right,
.upper-shell.grid-rail-integrated .h-rail-grid>.spare:last-child{border-left:0}
.grid-rail-head,.grid-rail-scroll-spare{display:none}
.upper-shell.grid-rail-integrated .grid-rail-head,
.upper-shell.grid-rail-integrated .grid-rail-scroll-spare{display:block;min-width:0;background:transparent}
.upper-shell.grid-rail-integrated .grid-rail-head{background:transparent}
.upper-shell.grid-rail-integrated .grid-rail-scroll-spare{background:transparent}
.upper-shell.grid-rail-integrated::before{
 content:"";position:absolute;inset:0;z-index:28;pointer-events:none;
 background-image:
  linear-gradient(var(--grid-rail-inner),var(--grid-rail-inner)),
  linear-gradient(var(--grid-rail-edge),var(--grid-rail-edge)),
  linear-gradient(var(--grid-rail-edge),var(--grid-rail-edge));
 background-repeat:no-repeat;
 background-size:1px 100%,2px 100%,2px 100%;
 background-position:
  calc(var(--left) - 1px) 0,
  calc(var(--left) + var(--grid-rail-width) - 2px) 0,
  calc(100% - var(--right) - var(--scrollbar-space,0px)) 0;
}
/* W grafie uchwyt panelu działa na zewnętrznej krawędzi szyny; w siatce tak samo. */
.upper-shell.grid-rail-integrated .panel-resizer-left{left:calc(var(--left) + var(--grid-rail-width))}
.grid-chapter-rail{position:relative;align-self:stretch;min-height:100%;background:transparent;z-index:7;pointer-events:none}
.upper-shell.grid-rail-integrated .chapter.is-collapsed>.grid-chapter-rail{display:none}
.grid-rail-add{
 position:absolute;left:0;width:var(--dm-graph-rail-width,18px);height:var(--chapter-insert-gap,18px);
 padding:0;margin:0;appearance:none;box-sizing:border-box;
 display:grid;place-items:center;cursor:pointer;pointer-events:auto;
 border:0;border-radius:0;box-shadow:none;background:transparent;color:#a7c9e9;
 touch-action:manipulation;
}
.grid-rail-add svg{display:block;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.15px;stroke-linecap:round;pointer-events:none}
.grid-rail-add:hover svg{opacity:0}
.grid-rail-add:focus-visible{outline:2px solid #8bbbee!important;outline-offset:-2px;z-index:2}
.grid-rail-add:focus-visible svg{opacity:1}
html[data-theme="light"] .grid-rail-add{color:#4579a9}
.grid-rail-preview{
 display:none;position:absolute;left:calc(var(--left) + var(--grid-rail-width));right:var(--right);
 height:var(--chapter-insert-gap,18px);background:rgba(138,148,161,.15);
 pointer-events:none;z-index:6;border:0;box-shadow:none;
}
html[data-theme="light"] .grid-rail-preview{background:rgba(141,150,160,.12)}
.grid-rail-preview.is-visible{display:block}
/* Właścicielem szyny jest osobna kolumna. Dawne pseudo-paski i przyciski w rzędach są wyłączone. */
.upper-shell.grid-rail-integrated .gaprow .grid-rail-placeholder,
.upper-shell.grid-rail-integrated .moment .grid-rail-placeholder{width:0;min-width:0;height:100%;border:0;background:transparent;pointer-events:none}


/* v1.1.94: typ projektu jest jawny; ikona w pasku otwiera DRUGI niezależny projekt. */
.project-type-chip{flex:none;white-space:nowrap;font-size:10px;font-weight:750;letter-spacing:.7px;color:#b8d3ed;border:1px solid #536b84;border-radius:4px;padding:3px 6px;line-height:1}
html[data-theme="light"] .project-type-chip{color:#b8d3ed}
@media(max-width:1080px){
 .toolbar{grid-template-columns:max-content minmax(0,1fr) max-content}
 .toolbar > .project-name{width:100%;max-width:100%;min-width:0}
}
@media(max-width:780px){.project-type-chip{font-size:9px;padding:2px 3px}}



/* v1.1.97 — przesuwalny minigraf, bez listy, nagłówka i opisów. */
.graph-navigator{
 position:absolute;left:16px;top:72px;box-sizing:border-box;
 width:max(144px,min(306px,calc(100% - var(--left) - var(--right) - var(--graph-rail-width) - 16px)));max-width:calc(100% - 24px);max-height:min(62vh,580px);
 display:block;z-index:14;overflow:hidden;
 padding:7px 6px 5px;border:1px solid #738da9;border-radius:11px;
 background:rgba(22,36,56,.98);box-shadow:0 15px 36px #0006;
 cursor:grab;touch-action:none;user-select:none
}
.graph-navigator[hidden]{display:none!important}
.graph-navigator.is-dragging{cursor:grabbing;box-shadow:0 26px 60px #000a}
.graph-nav-close{position:absolute;z-index:3;right:4px;top:4px;
 width:21px;height:21px;display:grid;place-items:center;padding:0;
 color:#bbd0e5;font:400 20px/1 Arial,sans-serif;
 background:rgba(39,57,79,.94);border:1px solid #57718c;border-radius:5px;
 cursor:pointer}
.graph-nav-close:hover,.graph-nav-close:focus-visible{color:white;background:#4d6d90;outline:1px solid #afd5f5}
.graph-nav-canvas{overflow:auto;max-height:calc(min(62vh,580px) - 12px);scrollbar-width:thin;
 scrollbar-color:#637c98 transparent;overscroll-behavior:contain}
.graph-nav-diagram{position:relative;margin-inline:auto;width:280px;min-width:280px}
.graph-nav-lines{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.graph-nav-line{fill:none;stroke:#829bb7;stroke-width:1.4;opacity:.85;stroke-linejoin:round}
.graph-nav-line.local{stroke:#8198af;stroke-dasharray:3 2}
.graph-nav-line.equal{stroke:#c7a0e7;stroke-width:2}
.graph-nav-mini-node{position:absolute;box-sizing:border-box;width:48px;height:24px;
 appearance:none;padding:0;overflow:hidden;
 border:1px solid #859cb5;border-radius:4px;
 background:#445368;box-shadow:inset 0 -3px 0 var(--mini-accent,#9bb9d4),0 1px 2px #0004;
 cursor:pointer;touch-action:manipulation;transition:filter .12s,outline-color .12s}
.graph-nav-mini-node::before{content:"";position:absolute;top:6px;left:7px;right:10px;height:2px;
 background:rgba(233,239,248,.55);box-shadow:0 5px 0 rgba(233,239,248,.27);pointer-events:none}
.graph-nav-mini-node:hover,.graph-nav-mini-node:focus-visible{filter:brightness(1.28);outline:2px solid #c0d9f4;outline-offset:2px}
.graph-nav-mini-node.is-primary{background:#61718a;border-color:#d7e5f4;outline:2px solid #bad5ee;outline-offset:2px}
.graph-nav-mini-node.is-viewed:not(.is-primary){outline:2px dashed #d5e8f8;outline-offset:2px}
html[data-theme="light"] .graph-navigator{background:rgba(245,249,253,.98);border-color:#99abc2;box-shadow:0 14px 32px #25384a38}
html[data-theme="light"] .graph-nav-close{background:#e5edf7;color:#47627e;border-color:#a5b8ce}
html[data-theme="light"] .graph-nav-close:hover,html[data-theme="light"] .graph-nav-close:focus-visible{background:#d2e4f6;color:#193d63}
html[data-theme="light"] .graph-nav-mini-node{background:#c0cad7;border-color:#6e819a}
html[data-theme="light"] .graph-nav-mini-node::before{background:rgba(34,53,74,.48);box-shadow:0 5px 0 rgba(34,53,74,.25)}
html[data-theme="light"] .graph-nav-mini-node.is-primary{background:#a4b5ca;border-color:#416b95;outline-color:#477cae}
html[data-theme="light"] .graph-nav-mini-node.is-viewed:not(.is-primary){outline-color:#477cae}
html[data-theme="light"] .graph-nav-line{stroke:#7088a3}
html[data-theme="light"] .graph-nav-line.local{stroke:#7189a1}
html[data-theme="light"] .graph-nav-line.equal{stroke:#9270c7}
@media(max-width:520px){.graph-navigator{max-width:calc(100vw - 16px)}}

/* v1.1.98: minimalny minigraf otwierany wyłącznie przyciskiem. */
.graph-navigator{width:max(112px,min(226px,calc(100vw - 28px)));padding:5px 5px 4px;border-radius:8px}
.graph-nav-canvas{max-height:none;height:100%;width:100%;display:flex;align-items:center;justify-content:center;overflow:auto;scrollbar-width:thin;scrollbar-color:#637c98 transparent;overscroll-behavior:contain}
.graph-nav-diagram{width:210px;min-width:210px;margin:auto;transform-origin:top left}
.graph-nav-mini-node{width:24px;height:12px;border-radius:2px;background:#536275;border:1px solid #9db1c8;box-shadow:none;transition:background .12s,border-color .12s}
.graph-nav-mini-node::before{display:none!important;content:none!important}
.graph-nav-mini-node.is-primary{background:#7a90a8;border:1px solid #d3e7f9;outline:1px solid #d3e7f9;outline-offset:1px}
.graph-nav-mini-node.is-viewed:not(.is-primary){outline:1px dashed #bbd8f1;outline-offset:1px}
@keyframes graphNavTargetFlash{0%{box-shadow:0 0 0 0 rgba(191,220,247,.0);outline-color:transparent}20%{box-shadow:0 0 0 6px rgba(191,220,247,.18);outline-color:#d7ebfb}55%{box-shadow:0 0 0 12px rgba(191,220,247,.0);outline-color:#f0c9a6}100%{box-shadow:0 0 0 0 rgba(191,220,247,.0);outline-color:transparent}}
.graph-node.graph-nav-target-flash .graph-card,.graph-card.graph-nav-target-flash{animation:graphNavTargetFlash 1.2s ease-out 1}
.graph-nav-line{stroke-width:1.1;opacity:.83}
.graph-nav-line.equal{stroke-width:1.4}
.graph-nav-empty-diagram{height:94px}
.graph-nav-placeholder{position:absolute;left:93px;top:45px;width:24px;height:12px;border:1px solid #8298ae;border-radius:2px;background:#475a6e}
html[data-theme="light"] .graph-nav-mini-node{background:#bdcbd9;border:1px solid #8198ae}

function plainNoteToHtml(raw){
 const text=String(raw||'').replace(/\r\n?/g,'\n');

}
const NOTE_IMAGE_MAX_BYTES = 40 * 1024;
const NOTE_IMAGE_MAX_EDGE = 960;
const NOTE_IMAGE_MAX_URL_LENGTH = Math.ceil(NOTE_IMAGE_MAX_BYTES * 4 / 3) + 130;
function validNoteImageSrc(src){
 if(typeof src!=='string'||src.length>NOTE_IMAGE_MAX_URL_LENGTH)return false;
 const match=/^data:image\/(webp|jpeg|png);base64,([a-zA-Z0-9+/]+={0,2})$/.exec(src);
 if(!match||match[2].length%4!==0)return false;
 try{
  const bytes=atob(match[2]);if(bytes.length>NOTE_IMAGE_MAX_BYTES||bytes.length<12)return false;
  if(match[1]==='png'){
   if(!bytes.startsWith('\x89PNG\r\n\x1a\n')||bytes.length<24)return false;
   const dim=pos=>(bytes.charCodeAt(pos)*16777216+bytes.charCodeAt(pos+1)*65536+bytes.charCodeAt(pos+2)*256+bytes.charCodeAt(pos+3));
   if(dim(16)>NOTE_IMAGE_MAX_EDGE||dim(20)>NOTE_IMAGE_MAX_EDGE)return false;
  } else if(match[1]==='jpeg'){if(bytes.charCodeAt(0)!==255||bytes.charCodeAt(1)!==216)return false}
  else if(!bytes.startsWith('RIFF')||bytes.slice(8,12)!=='WEBP')return false;
  return true;
 }catch{return false}
}
function sanitizeNoteHtml(raw){
 const template=document.createElement('template');template.innerHTML=String(raw||'');
 const allowed=new Set(['P','DIV','BR','H1','H2','H3','STRONG','B','EM','I','U','UL','OL','LI','BLOCKQUOTE']);
 const ignored=new Set(['SCRIPT','STYLE','SVG','MATH','IFRAME','OBJECT','EMBED','FORM','INPUT','BUTTON','TEXTAREA','VIDEO','AUDIO','META','LINK']);
 const output=document.createElement('div');
 function copyNode(node){
  if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.nodeValue);
  if(node.nodeType!==Node.ELEMENT_NODE||ignored.has(node.tagName))return null;
  if(node.tagName==='IMG'){
   const src=node.getAttribute('src');
   if(!validNoteImageSrc(src))return null;
   const img=document.createElement('img');img.setAttribute('src',src);img.setAttribute('alt','Ilustracja notatki');img.setAttribute('loading','lazy');
   return img;
  }
  const el=allowed.has(node.tagName)?document.createElement(node.tagName.toLowerCase()):document.createDocumentFragment();
  for(const child of Array.from(node.childNodes)){const clean=copyNode(child);if(clean)el.appendChild(clean)}
  return el;
 }
 for(const child of Array.from(template.content.childNodes)){const clean=copyNode(child);if(clean)output.appendChild(clean)}
 return output.innerHTML;
}
function noteHtmlToPlain(html){
 const div=document.createElement('div');div.innerHTML=sanitizeNoteHtml(html);
 let result='';const blocks=new Set(['P','DIV','H1','H2','H3','UL','OL','BLOCKQUOTE']);
 function visit(node){
  if(node.nodeType===Node.TEXT_NODE){result+=node.nodeValue;return}
  if(node.nodeType!==Node.ELEMENT_NODE)return;
  if(node.tagName==='BR'){result+='\n';return}
  if(node.tagName==='IMG'){result+='[obraz]\n';return}
  if(node.tagName==='LI')result+='• ';
  for(const ch of Array.from(node.childNodes))visit(ch);
  if(node.tagName==='LI')result+='\n';
  else if(blocks.has(node.tagName))result+='\n\n';
 }
 for(const child of Array.from(div.childNodes))visit(child);
 return result.replace(/\n{3,}/g,'\n\n').trim();
}
function normalizeNoteSections(project){

 for(let i=0;i<ready.length;i++){const u=ready[i];topo.push(u);for(const v of out.get(u)){indeg.set(v,indeg.get(v)-1);if(indeg.get(v)===0)ready.push(v)}}
 if(topo.length!==groups.length)throw Error('To połączenie utworzyłoby sprzeczny cykl');
 return {items,find,groups,arcs,topo};
}

  (assigned?`${assigned} przypisanych wydarzeń pozostanie w grafie jako nieprzypisane.\n`:'')+
  'Wydarzenia i relacje nie zostaną usunięte.';

// walidacji relacji za każdym zwykłym kliknięciem w kafelek.
let graphRailNetwork=null;
function graphRailGroupIds(graph,choices=graphSelection){
 if(!graph||!choices.length)return [];
 const chosen=[...new Set(choices.filter(id=>graph.items.includes(id)))];
 if(!chosen.length)return [];
 const seeds=new Set(chosen.map(id=>graph.find(id)));
 let groups=new Set(seeds);
 if(seeds.size>1){
  const out=new Map(graph.groups.map(g=>[g,[]])),back=new Map(graph.groups.map(g=>[g,[]]));
  for(const [u,v] of graph.arcs){out.get(u).push(v);back.get(v).push(u)}
  const future=new Set(seeds),past=new Set(seeds);
  for(const u of graph.topo)if(future.has(u))for(const v of out.get(u))future.add(v);
  for(const u of graph.topo.slice().reverse())if(past.has(u))for(const v of back.get(u))past.add(v);
  groups=new Set([...future].filter(g=>past.has(g)));
 }

}

function graphChapterPreviewShow(trigger){

 if(trigger.dataset.action==='graph-insert-chapter'){
  const after=Number(trigger.dataset.chapterAfter);

  const side=trigger.dataset.chapterSide||'end';
  const gap=project.querySelector(`.graph-chapter-band[data-graph-zone="${2*(after+1)}"]`);
  const range=gap?.getBoundingClientRect();
  const previewHeight=GRAPH_NODE_GAP;
  // Przylep podgląd do KONKRETNEGO rozdziału referencyjnego:
  // start = zaraz POD poprzednim rozdziałem, end = zaraz NAD następnym.

   ?(previous?.getBoundingClientRect().bottom??range?.top)
   :(next?.getBoundingClientRect().top??range?.bottom);

// Ta sama, wolna od zmian w stanie kalkulacja służy do podglądu i zatwierdzenia.
function graphPlanChapterFromSelection(){
 if(!graphHasChapters()||!graphSelection.length)throw Error('Zaznacz wydarzenia do nowego rozdziału');
 const graph=graphNetwork(),ids=graphRailGroupIds(graph),zoneById=graphChapterZones(graph);
 if(!ids.length)throw Error('Nie znaleziono wydarzeń do nowego rozdziału');
 const zones=new Set(ids.map(id=>zoneById.get(id)));
 if(zones.size!==1)throw Error('Zaznaczone wydarzenia obejmują różne rozdziały lub przerwy. Przenieś je najpierw do jednego obszaru.');
 const z=[...zones][0],isChapter=z%2===1,chapterIndex=isChapter?(z-1)/2:z/2;
 const newChapter={id:uid(),name:'Nowy rozdział'};
 const planned=state.graphChapters.slice();planned.splice(isChapter?chapterIndex+1:chapterIndex,0,newChapter);
 const draft={...graphChapterMembership()},move=new Set(ids);
 if(isChapter){
  const oldId=state.graphChapters[chapterIndex].id;
  const groups=new Set(ids.map(id=>graph.find(id))),out=new Map(graph.groups.map(g=>[g,[]]));
  for(const [u,v] of graph.arcs)out.get(u).push(v);
  const later=new Set(groups);
  for(const u of graph.topo)if(later.has(u))for(const v of out.get(u))later.add(v);
  for(const id of graph.items)if(draft[id]===oldId&&later.has(graph.find(id)))move.add(id);
 }
 for(const id of move)draft[id]=newChapter.id;
 const result=graphChapterReconcile(draft,graph,newChapter.id,planned);
 const members=graph.items.filter(id=>result[id]===newChapter.id);
 const gapPlacement={...(state.graphChapterGapPlacement||{})};
 if(!isChapter){
  const board=root.querySelector('.graph-board');
  const nodeMap=new Map([...board.querySelectorAll('.graph-node')].map(n=>[n.dataset.graphEvent,n]));
  const memberNodes=members.map(id=>nodeMap.get(id)).filter(Boolean);
  if(memberNodes.length){
   const rangeTop=Math.min(...memberNodes.map(n=>n.offsetTop));
   const oldPrev=state.graphChapters[chapterIndex-1]?.id||null;
   const oldNext=state.graphChapters[chapterIndex]?.id||null;
   for(const id of graph.items){
    if(zoneById.get(id)!==z||members.includes(id)||result[id])continue;
    const node=nodeMap.get(id);if(!node)continue;
    const follows=node.offsetTop+node.offsetHeight/2>=rangeTop;
    gapPlacement[id]=follows?{after:newChapter.id,before:oldNext}:{after:oldPrev,before:newChapter.id};
   }
  }
 }

}

}
function graphChapterInfo(graph=graphNetwork()){
 // Każda grupa równości musi być nierozdzielna między poziomymi pasami czasu.
 const groups=new Map(graph.groups.map(g=>[g,[]]));
 for(const id of graph.items)groups.get(graph.find(id)).push(id);
 const out=new Map(graph.groups.map(g=>[g,[]]));
 const back=new Map(graph.groups.map(g=>[g,[]]));
 for(const [u,v] of graph.arcs){out.get(u).push(v);back.get(v).push(u)}
 return {groups,out,back};
}
function graphChapterReconcile(proposed,graph,preferred=null,chapters=state.graphChapters){
 if(!graphHasChapters())return {...proposed};
 const ids=new Set(graph.items),assign={};
 const validIds=new Set(chapters.map(c=>c.id));
 for(const [id,cid] of Object.entries(proposed))if(ids.has(id)&&validIds.has(cid))assign[id]=cid;
 const {groups,out,back}=graphChapterInfo(graph);
 const expand=id=>{
  const seeds=new Set([...groups.keys()].filter(g=>groups.get(g).some(e=>assign[e]===id)));
  if(!seeds.size)return;
  const down=new Set(seeds),up=new Set(seeds);
  for(const g of graph.topo)if(down.has(g))for(const v of out.get(g))down.add(v);
  for(const g of graph.topo.slice().reverse())if(up.has(g))for(const u of back.get(g))up.add(u);
  for(const g of groups.keys()){
   const members=groups.get(g);
   if(!down.has(g)||!up.has(g))continue;
   for(const eventId of members){
    const previous=assign[eventId];
    if(previous&&previous!==id&&id!==preferred)throw Error('Przypisanie tworzyłoby lukę chronologiczną w innym rozdziale');
    assign[eventId]=id;
   }
  }
 };
 // Pierwszeństwo ma właśnie wykonywane przeniesienie. Wymuszone elementy
 // mogą przejść z poprzedniego rozdziału razem z dwoma wybranymi końcami.
 if(preferred)expand(preferred);
 for(const ch of chapters)if(ch.id!==preferred)expand(ch.id);
 // Zabezpieczenie dla równości także przy pojedynczym przypisanym wydarzeniu.
 for(const members of groups.values()){
  const assigned=[...new Set(members.map(id=>assign[id]).filter(Boolean))];
  if(assigned.length>1)throw Error('Wydarzenia równoczesne nie mogą trafić do różnych rozdziałów');
  if(assigned.length)for(const id of members)assign[id]=assigned[0];
 }
 // Związek przyczynowy z rozdziału późniejszego do wcześniejszego jest zakazany.
 const chapterRank=new Map(chapters.map((c,i)=>[c.id,i]));
 const reachableRank=new Map();
 for(const g of graph.topo){
  let rank=reachableRank.get(g)??-1;
  for(const id of groups.get(g))if(assign[id]){
   const current=chapterRank.get(assign[id]);
   if(rank>current)throw Error('Ten ruch narusza chronologiczną kolejność rozdziałów');
   rank=Math.max(rank,current);
  }
  for(const v of out.get(g))reachableRank.set(v,Math.max(reachableRank.get(v)??-1,rank));
 }
 return assign;
}
function graphChapterZones(graph,assignments=graphChapterMembership()){
 const zone=new Map();if(!graphHasChapters())return zone;
 const {groups,out,back}=graphChapterInfo(graph),fixed=new Map(),min=new Map(),max=new Map();
 const lastZone=state.graphChapters.length*2;
 for(const [g,members] of groups){
  const positions=[...new Set(members.map(id=>assignments[id]).filter(Boolean))];
  const index=positions.length?state.graphChapters.findIndex(c=>c.id===positions[0]):-1;
